<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Päikesevarjutus 12. august 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a; /* Tume taust (Tailwind slate-900) */
            color: #f8fafc;
            font-family: 'Fira Sans', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
        }
        /* Kohandatud liuguri stiil */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #facc15;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #475569;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <div class="max-w-4xl w-full flex flex-col gap-6">
        
        <!-- Päis -->
        <header class="text-center">
            <h1 class="text-3xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-orange-500 mb-2">
                12. augusti päikesevarjutus
            </h1>
        </header>

        <!-- Paneelid (Kontrollid ja Lõuend) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Vasak paneel: Seaded -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl flex flex-col gap-6">
                
                <!-- Linna valik -->
                <div>
                    <label for="citySelect" class="block text-sm font-medium text-slate-300 mb-2">Vali asukoht (vaatluspunkt)</label>
                    <select id="citySelect" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-yellow-500 focus:outline-none transition">
                        <option value="Tallinn" selected>Tallinn</option>
                        <option value="Tartu">Tartu</option>
                        <option value="Narva">Narva</option>
                        <option value="Pärnu">Pärnu</option>
                        <option value="Madrid">Madrid (Hispaania)</option>
                        <option value="Reykjavik">Reykjavík (Island)</option>
                    </select>
                </div>

                <!-- Info kuvamine -->
                <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-slate-400 text-sm">Kohalik kellaaeg:</span>
                        <span id="timeDisplay" class="text-xl font-mono text-yellow-400 font-bold">19:30</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-400 text-sm">Päikese kattuvus:</span>
                        <span id="coverageDisplay" class="text-xl font-mono text-white font-bold">0.0%</span>
                    </div>
                    <div id="totalityAlert" class="mt-3 text-center text-red-400 font-bold text-sm hidden animate-pulse">
                        TÄIELIK VARJUTUS!
                    </div>
                </div>

                <!-- Aja kontroll -->
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="block text-sm font-medium text-slate-300">Aeg (19:30 - 22:00)</label>
                        <button id="playBtn" class="text-xs bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-1 px-3 rounded transition">
                            ▶ Mängi
                        </button>
                    </div>
                    <input type="range" id="timeSlider" min="0" max="150" value="0" step="0.5">
                </div>
                
                <div class="mt-auto pt-4 border-t border-slate-700">
                    <p class="text-xs text-slate-500 leading-relaxed">
                        Lihtsustatud illustratsioon, kellaajad (EEST) ja kattuvus on ligikaudsed.
                    </p>
                </div>
            </div>

            <!-- Parem paneel: Lõuend -->
            <div class="lg:col-span-2 relative aspect-video md:aspect-[4/3] lg:aspect-auto h-[400px] lg:h-[500px]">
                <canvas id="eclipseCanvas"></canvas>
            </div>
            
        </div>
    </div>

    <script>
        // --- Andmed linnade kohta ---
        // maxTime: minutid alates 19:30
        // magnitude: varjutuse faasi suurus (1.0 = täielik)
        // angle: nurk radiaanides, kust Kuu Päikesele peale liigub
        const citiesData = {
            "Tallinn": { maxTime: 83, magnitude: 0.834, angle: Math.PI / 4 }, // Maksimum ~20:53
            "Tartu": { maxTime: 83, magnitude: 0.800, angle: Math.PI / 4 },
            "Narva": { maxTime: 84, magnitude: 0.780, angle: Math.PI / 4 },
            "Pärnu": { maxTime: 82, magnitude: 0.840, angle: Math.PI / 4 },
            "Madrid": { maxTime: 120, magnitude: 1.01, angle: Math.PI / 2.5 }, // Täisvarjutus õhtul
            "Reykjavik": { maxTime: 78, magnitude: 1.05, angle: Math.PI / 6 } // Täisvarjutus varem
        };

        // --- DOM Elemendid ---
        const canvas = document.getElementById('eclipseCanvas');
        const ctx = canvas.getContext('2d');
        const citySelect = document.getElementById('citySelect');
        const timeSlider = document.getElementById('timeSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const coverageDisplay = document.getElementById('coverageDisplay');
        const playBtn = document.getElementById('playBtn');
        const totalityAlert = document.getElementById('totalityAlert');

        // --- Muutujad ---
        let currentCity = "Tallinn";
        let timeMinutes = 0; // 0 = 19:30 EEST
        let isPlaying = false;
        let animationFrameId;
        const R = 80; // Päikese ja Kuu baasraadius
        const stars = [];

        // Loo staatilised tähed taustale
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * 2000,
                y: Math.random() * 2000,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }

        // --- Funktsioonid ---

        // Kohanda lõuendi suurust vastavalt ekraanile
        function resizeCanvas() {
            const parent = canvas.parentElement;
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
            draw(); // Joonista kohe uuesti, et vältida vilkumist
        }

        // Vorminda kellaaeg (algab 19:30)
        function formatTime(minutes) {
            const totalMinutes = 19 * 60 + 30 + minutes;
            const h = Math.floor(totalMinutes / 60) % 24;
            const m = Math.floor(totalMinutes % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }

        function draw() {
            const data = citiesData[currentCity];
            
            // 1. Arvuta Kuu positsioon ja kattuvus
            const maxT = data.maxTime;
            const mag = data.magnitude;
            
            // Minimaalne kaugus keskpunktide vahel maksimumi hetkel
            const minDistance = Math.max(0, 2 * R * (1 - mag)); 
            
            // Kuu kiirus pikslites minutis
            const velocity = (4 * R) / 120; // Liigub -2R kuni 2R umbes 120 minutiga
            
            // Asukoht mööda trajektoori
            const pathDist = (timeMinutes - maxT) * velocity;
            
            // Kuu baas-koordinaadid (enne pööramist)
            const moonBaseX = pathDist;
            const moonBaseY = minDistance;
            
            // Pööra trajektoori vastavalt linna nurgale
            const angle = data.angle;
            const moonOffsetX = moonBaseX * Math.cos(angle) - moonBaseY * Math.sin(angle);
            const moonOffsetY = moonBaseX * Math.sin(angle) + moonBaseY * Math.cos(angle);
            
            // Keskpunktid
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Tõeline kaugus päikesest
            const currentDistance = Math.hypot(moonOffsetX, moonOffsetY);
            
            // Arvuta visuaalne kattuvuse protsent (ligikaudne, põhineb kaugusel)
            let coveragePercentage = 0;
            if (currentDistance < 2 * R) {
                // Lihtsustatud paraboolne mudel protsendi arvutamiseks
                const maxCoverage = Math.min(100, mag * 100);
                const timeDiff = Math.abs(timeMinutes - maxT);
                // Varjutus kestab umbes +/- 60 minutit maksimumist
                coveragePercentage = Math.max(0, maxCoverage * (1 - Math.pow(timeDiff / 60, 2)));
                
                // Kui on totaalne varjutus (mag >= 1) ja oleme piisavalt lähedal
                if (mag >= 1.0 && currentDistance < R * 0.1) {
                    coveragePercentage = 100;
                }
            }
            
            // Uuenda UI tekste
            timeDisplay.innerText = formatTime(timeMinutes);
            coverageDisplay.innerText = coveragePercentage.toFixed(1) + "%";
            
            if (coveragePercentage > 99.9) {
                totalityAlert.classList.remove('hidden');
                coverageDisplay.classList.add('text-red-400');
                coverageDisplay.classList.remove('text-white');
            } else {
                totalityAlert.classList.add('hidden');
                coverageDisplay.classList.remove('text-red-400');
                coverageDisplay.classList.add('text-white');
            }

            // 2. Joonista taust ja taevas
            // Mida suurem kattuvus, seda tumedamaks läheb
            const darkness = coveragePercentage / 100;
            const skyColorR = Math.floor(30 * (1 - darkness));
            const skyColorG = Math.floor(41 * (1 - darkness));
            const skyColorB = Math.floor(59 * (1 - darkness));
            
            ctx.fillStyle = `rgb(${skyColorR}, ${skyColorG}, ${skyColorB})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Tähed (muutuvad nähtavaks, kui on pime)
            if (darkness > 0.5) {
                const starOpacity = (darkness - 0.5) * 2; // 0 to 1
                stars.forEach(star => {
                    ctx.beginPath();
                    ctx.arc(star.x % canvas.width, star.y % canvas.height, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity * starOpacity})`;
                    ctx.fill();
                });
            }

            
            // Päikese kroon / kuma (nähtav tugeva varjutuse ajal)
            if (darkness > 0.7) {
                const coronaGradient = ctx.createRadialGradient(cx, cy, R, cx, cy, R * 3);
                coronaGradient.addColorStop(0, `rgba(255, 255, 255, ${darkness})`);
                coronaGradient.addColorStop(0.2, `rgba(255, 250, 200, ${darkness * 0.5})`);
                coronaGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                ctx.beginPath();
                ctx.arc(cx, cy, R * 3, 0, Math.PI * 2);
                ctx.fillStyle = coronaGradient;
                ctx.fill();
            }

            // Päike (Kollane/Valge)
            ctx.beginPath();
            ctx.arc(cx, cy, R, 0, Math.PI * 2);
            
            // Päikese värv muutub punakamaks madalal horisondil, aga hoiame siin lihtsalt särava
            const sunGradient = ctx.createRadialGradient(cx - R/3, cy - R/3, R/10, cx, cy, R);
            sunGradient.addColorStop(0, '#ffffff');
            sunGradient.addColorStop(0.8, '#fde047'); // yellow-300
            sunGradient.addColorStop(1, '#eab308'); // yellow-500
            
            ctx.fillStyle = sunGradient;
            
            // Sära efekt (glow)
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#facc15';
            ctx.fill();
            
            // Eemalda varjud järgmiste elementide jaoks
            ctx.shadowBlur = 0;

            // Kuu (Tume / Must)
            ctx.beginPath();
            ctx.arc(cx + moonOffsetX, cy + moonOffsetY, R * 1.02, 0, Math.PI * 2); // Kuu on visuaalselt pisut suurem või sama suur
            
            // Kuu värv on taeva värvi, et see tekitaks augu efekti, 
            // aga lisame natuke kera efekti
            const moonGradient = ctx.createRadialGradient(
                cx + moonOffsetX - R/2, cy + moonOffsetY - R/2, 
                R/10, cx + moonOffsetX, cy + moonOffsetY, R
            );
            moonGradient.addColorStop(0, '#1e293b');
            moonGradient.addColorStop(1, '#020617');
            
            ctx.fillStyle = moonGradient;
            ctx.fill();
            
            // Kuu äärejoon, et see eristuks paremini 100% varjutuse ajal
            if (darkness > 0.95) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        
        // Animatsiooni loogika
        function animate() {
            if (isPlaying) {
                timeMinutes += 0.2; // Aja kulumise kiirus
                if (timeMinutes > 150) {
                    timeMinutes = 150;
                    togglePlay(false);
                }
                timeSlider.value = timeMinutes;
                draw();
                animationFrameId = requestAnimationFrame(animate);
            }
        }

        function togglePlay(forceState) {
            isPlaying = forceState !== undefined ? forceState : !isPlaying;
            
            if (isPlaying) {
                if (timeMinutes >= 150) timeMinutes = 0; // Alusta algusest, kui oli lõpus
                playBtn.innerHTML = '⏸ Peata';
                playBtn.classList.replace('bg-yellow-500', 'bg-red-500');
                playBtn.classList.replace('hover:bg-yellow-400', 'hover:bg-red-400');
                animate();
            } else {
                playBtn.innerHTML = '▶ Mängi';
                playBtn.classList.replace('bg-red-500', 'bg-yellow-500');
                playBtn.classList.replace('hover:bg-red-400', 'hover:bg-yellow-400');
                cancelAnimationFrame(animationFrameId);
            }
        }

        // Sündmused
        window.addEventListener('resize', resizeCanvas);
        
        citySelect.addEventListener('change', (e) => {
            currentCity = e.target.value;
            draw();
        });

        timeSlider.addEventListener('input', (e) => {
            timeMinutes = parseFloat(e.target.value);
            draw();
        });
        
        // Peata animatsioon, kui kasutaja sikutab liugurit
        timeSlider.addEventListener('mousedown', () => { if(isPlaying) togglePlay(false); });
        timeSlider.addEventListener('touchstart', () => { if(isPlaying) togglePlay(false); });

        playBtn.addEventListener('click', () => togglePlay());

        // Esmane käivitamine
        window.onload = function() {
            resizeCanvas(); // See kutsub välja ka draw()
        };

    </script>
</body>
</html>
