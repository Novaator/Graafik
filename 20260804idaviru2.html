<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodukoha Hinnangute Visualiseering</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fira Sans', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex justify-center items-center p-0 overflow-hidden bg-transparent">

    <div class="w-full bg-white border border-slate-200 flex flex-row overflow-hidden max-h-[550px] h-full rounded-none sm:rounded-xl">
        
        <!-- Vasak veerg (Menüü) -->
        <aside class="w-48 sm:w-56 bg-slate-50/50 border-r border-slate-100 flex flex-col flex-shrink-0 h-full">
            <div class="p-3 sm:p-4 border-b border-slate-100 bg-white">
                <p class="text-sm text-slate-600 leading-snug">Klõpsa sotsiaaldemograafilistele rühmadele, et näha täpsemat jaotust.</p>
            </div>
            
            <div class="p-2 sm:p-3 flex-grow overflow-y-auto">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-2 mt-1">Vali vaade</h2>
                <nav class="space-y-1" id="nav-buttons">
                    <!-- Nupud genereeritakse JavaScriptiga -->
                </nav>
            </div>
        </aside>

        <!-- Parem veerg (Graafik) -->
        <main class="flex-grow flex flex-col p-3 sm:p-6 overflow-hidden h-full relative bg-white">
            <header class="mb-4 flex-shrink-0">
                <h2 id="chart-title" class="text-xl sm:text-2xl font-bold text-slate-800">Kõik vastajad</h2>
            </header>

            <div class="flex-grow relative w-full h-full min-h-[250px]">
                <canvas id="myChart"></canvas>
            </div>
        </main>
    </div>

    <script>
        // Pikad laused on jagatud massiividesse, et Chart.js murraks need graafikul mitmele reale (parem loetavus)
        const statements = [
            ["Minu kodupaik pakub mulle", "parimaid töövõimalusi"],
            ["Kui viibin mõnda aega eemal,", "igatsen kodukohta"],
            ["Minu kodupaiga tööstus muudab", "selle eriliseks ja väärtuslikuks"],
            ["Minu kodupaiga vaatamisväärsused ja/", "või loodus muudab selle eriliseks"],
            ["Naabruskonna inimesed on", "üksteist toetavad ja ühtehoidvad"],
            ["Tunnen, et mul on siin lähedasi sõpru", "ja/või sugulasi, kes hoiavad mind siin"]
        ];

        // Värvipalett (Sky blue, Orange, Emerald, Violet)
        const colors = [
            { bg: 'rgba(56, 189, 248, 0.85)', border: 'rgb(14, 165, 233)' },   // Eesti / Kõik (Sinine)
            { bg: 'rgba(251, 146, 60, 0.85)', border: 'rgb(249, 115, 22)' }    // Vene (Oranž)
        ];

        // Andmestik, mis on pildilt pilt_2.png välja loetud
        const rawData = {
            "Kõik vastajad": [
                { label: "Kõik vastajad", data: [25, 73, 50, 80, 65, 85], colorIndex: 0 }
            ],
            "Eesti ja vene võrdlus": [
                { label: "Eesti", data: [39, 78, 43, 84, 67, 81], colorIndex: 0 },
                { label: "Vene", data: [24, 73, 51, 79, 65, 86], colorIndex: 1 }
            ]
        };

        let myChart = null;

        function renderChart(categoryKey) {
            const ctx = document.getElementById('myChart').getContext('2d');
            const groupData = rawData[categoryKey];

            // Valmistame andmed ette Chart.js jaoks
            const datasets = groupData.map(item => {
                return {
                    label: item.label,
                    data: item.data,
                    backgroundColor: colors[item.colorIndex].bg,
                    borderColor: colors[item.colorIndex].border,
                    borderWidth: 1,
                    borderRadius: 4,
                    barPercentage: 0.8,
                    categoryPercentage: 0.9
                };
            });

            document.getElementById('chart-title').textContent = categoryKey;

            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: statements, // Y-telje pikad tekstid
                    datasets: datasets
                },
                options: {
                    indexAxis: 'y', // MÄÄRAB GRAAFIKU HORISONTAALSEKS
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20,
                                font: {
                                    family: "'Fira Sans', sans-serif",
                                    size: 13
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { family: "'Fira Sans', sans-serif", size: 14 },
                            bodyFont: { family: "'Fira Sans', sans-serif", size: 13 },
                            padding: 12,
                            cornerRadius: 8,
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.x !== null) {
                                        label += context.parsed.x + '%';
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { // Nüüd on X telg protsentide telg
                            beginAtZero: true,
                            max: 100,
                            grid: {
                                color: 'rgba(226, 232, 240, 1)',
                                drawBorder: false,
                            },
                            ticks: {
                                stepSize: 20, // 20% sammud, nagu soovitud
                                callback: function(value) {
                                    return value + '%';
                                },
                                font: { family: "'Fira Sans', sans-serif" },
                                color: '#64748b'
                            }
                        },
                        y: { // Nüüd on Y telg kategooriate (väidete) telg
                            grid: {
                                display: false,
                                drawBorder: false,
                            },
                            ticks: {
                                font: { family: "'Fira Sans', sans-serif", size: 12 },
                                color: '#475569'
                            }
                        }
                    }
                }
            });
        }

        function setupNavigation() {
            const navContainer = document.getElementById('nav-buttons');
            const categories = Object.keys(rawData);

            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-2.5 rounded-lg mb-1 transition-all duration-200 font-medium text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-1 flex items-center justify-between`;
                
                btn.textContent = category;
                
                btn.onclick = () => {
                    Array.from(navContainer.children).forEach(child => {
                        child.classList.remove('bg-sky-50', 'text-sky-700', 'border-sky-100');
                        child.classList.add('text-slate-600', 'hover:bg-slate-50', 'border-transparent');
                    });
                    
                    btn.classList.remove('text-slate-600', 'hover:bg-slate-50', 'border-transparent');
                    btn.classList.add('bg-sky-50', 'text-sky-700', 'border-sky-100');
                    
                    renderChart(category);
                };

                navContainer.appendChild(btn);
            });

            // Vaikimisi ava "Kõik vastajad"
            const initialCategory = "Kõik vastajad";
            const initialBtnIndex = categories.indexOf(initialCategory);
            
            if(initialBtnIndex !== -1 && navContainer.children[initialBtnIndex]) {
                 navContainer.children[initialBtnIndex].click();
            }
        }

        // Käivita rakendus
        window.onload = () => {
            setupNavigation();
        };
    </script>
</body>
</html>
