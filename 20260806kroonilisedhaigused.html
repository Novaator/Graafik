                ],
                male: [

                    { name: "Eesnäärmehaigused", val: 40.0 }, { name: "Kodade virvendusarütmia", val: 32.3 },
                    { name: "Südame isheemiatõbi", val: 25.7 }, { name: "Kae ja muud läätsehaigused", val: 23.6 },
                    { name: "Düslipideemia", val: 19.6 }, { name: "Soliidsed tuumorid", val: 18.8 },
                    { name: "Glaukoom", val: 16.7 }, { name: "Osteoartriit ja degen. liigesehaigused", val: 16.4 }
                ]
            }
        ];

        let currentSlide = 0;
        const slidesWrapper = document.getElementById('slides-wrapper');
        const indicatorsContainer = document.getElementById('slide-indicators');
        const chartInstances = []; // Hoiab Chart.js instantse meeles hävitamiseks

        // Abifunktsioon liiga pikkade siltide poolitamiseks (et graafik oleks kompaktne)
        function formatLabel(label) {
            if (label.length > 28) {
                const words = label.split(' ');
                let mid = Math.floor(words.length / 2);
                // Proovime leida mõistlikuma murdekoha (nt koma juurest)
                const commaIdx = words.findIndex(w => w.includes(','));
                if(commaIdx > 0 && commaIdx < words.length - 1) mid = commaIdx + 1;
                
                return [words.slice(0, mid).join(' '), words.slice(mid).join(' ')];
            }
            return label;
        }

        // Genereerime slaidid DOM-i
        dataSet.forEach((group, index) => {
            // Indikaator (täpp)
            const dot = document.createElement('button');
            dot.className = `w-3 h-3 rounded-full transition-colors ${index === 0 ? 'bg-slate-800' : 'bg-slate-300'}`;
            dot.onclick = () => goToSlide(index);
            indicatorsContainer.appendChild(dot);

            // Slaidi konteiner
            const slide = document.createElement('div');
            slide.id = `slide-${index}`;
            // Lisatud overflow-y-auto mobiili jaoks, kui sisu peaks ikka liiga pikk olema
            slide.className = `slide-container absolute inset-0 w-full h-full p-4 sm:p-6 flex flex-col md:flex-row gap-4 sm:gap-6 overflow-y-auto md:overflow-visible ${index === 0 ? 'opacity-100 z-10 pointer-events-auto' : 'opacity-0 z-0 pointer-events-none'}`;
            
            // Vanusegrupi tiitel slaidil
            const ageBadge = document.createElement('div');
            // Parandatud paigutus: kitsastel ekraanidel (nt 670px) on silt lihtsalt reas keskel,
            // laiematel (md) aga absoluutselt positsioneeritud slaidide vahele.
            ageBadge.className = 'self-center bg-slate-100 px-4 py-1 rounded-full text-slate-700 font-bold text-lg shadow-sm border border-slate-200 z-20 mb-2 md:absolute md:top-2 md:left-1/2 md:-translate-x-1/2 md:mb-0';
            ageBadge.textContent = `Vanus ${group.age}`;
            slide.appendChild(ageBadge);

            // Naised veerg (Kõrgus fikseeritud miinimumiga mobiilis)
            const colFemale = document.createElement('div');
            colFemale.className = 'flex-1 min-h-[350px] md:h-full flex flex-col relative pt-4 md:pt-8';
            colFemale.innerHTML = `<h3 class="text-center font-semibold text-pink-600 mb-2">Naised</h3><div class="relative flex-1 w-full"><canvas id="canvas-f-${index}"></canvas></div>`;
            
            // Mehed veerg (Kõrgus fikseeritud miinimumiga mobiilis)
            const colMale = document.createElement('div');
            colMale.className = 'flex-1 min-h-[350px] md:h-full flex flex-col relative pt-4 md:pt-8';
            colMale.innerHTML = `<h3 class="text-center font-semibold text-blue-600 mb-2">Mehed</h3><div class="relative flex-1 w-full"><canvas id="canvas-m-${index}"></canvas></div>`;

            slide.appendChild(colFemale);
            slide.appendChild(colMale);
            slidesWrapper.appendChild(slide);
        });

        // Üldised seaded Chart.js jaoks
        Chart.defaults.font.family = "'Fira Sans', sans-serif";
        Chart.defaults.color = '#475569';

        function createChartConfig(dataArray, colorStr) {
            return {
                type: 'bar',
                data: {
                    labels: dataArray.map(item => formatLabel(item.name)),
                    datasets: [{
                        data: dataArray.map(item => item.val),
                        backgroundColor: colorStr,
                        borderRadius: 4,
                        barPercentage: 0.7,
                        categoryPercentage: 0.9
                    }]
                },
                options: {
                    indexAxis: 'y', // Horisontaalne
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { right: 35 } // Ruumi datalabels jaoks
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            // Suurendatud hüpikakna (tooltip) fonti loetavuse parandamiseks (20px)
                            titleFont: { size: 20 },
                            bodyFont: { size: 20 },
                            padding: 12,
                            callbacks: {
                                label: function(context) { return context.raw + '%'; }
                            }
                        },
                        datalabels: {
                            anchor: 'end',
                            align: 'right',
                            color: colorStr,
                            font: { weight: '600', size: 11 },
                            formatter: (value) => value.toFixed(1)
                        }
                    },
                    scales: {
                        x: {
                            max: 100, // Fikseeritud 100% peale skaala näitamiseks
                            grid: { color: '#e2e8f0', drawBorder: false },
                            ticks: { 
                                callback: function(value) { return value + '%'; },
                                font: { size: 10 }
                            }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { 
                                font: { size: 11, lineHeight: 1.1 },
                                color: '#1e293b'
                            }
                        }
                    },
                    animation: { duration: 800, easing: 'easeOutQuart' }
                }
            };
        }

        // Initsialiseerib graafikud antud slaidil (nii et nad ei joonistuks kõik korraga laadimisel)
        function renderChartsForSlide(index) {
            const group = dataSet[index];
            
            // Naised
            const ctxF = document.getElementById(`canvas-f-${index}`).getContext('2d');
            if(!Chart.getChart(ctxF)) {
                new Chart(ctxF, createChartConfig(group.female, '#db2777')); // Pink
            }
            
            // Mehed
            const ctxM = document.getElementById(`canvas-m-${index}`).getContext('2d');
            if(!Chart.getChart(ctxM)) {
                new Chart(ctxM, createChartConfig(group.male, '#2563eb')); // Blue
            }
        }

        // Slaidide loogika
        function goToSlide(index) {
            // Peida eelmine
            const oldSlide = document.getElementById(`slide-${currentSlide}`);
            oldSlide.classList.remove('opacity-100', 'z-10', 'pointer-events-auto');
            oldSlide.classList.add('opacity-0', 'z-0', 'pointer-events-none');
            indicatorsContainer.children[currentSlide].classList.replace('bg-slate-800', 'bg-slate-300');

            // Uuenda indeks
            currentSlide = index;

            // Näita uut
            const newSlide = document.getElementById(`slide-${currentSlide}`);
            newSlide.classList.remove('opacity-0', 'z-0', 'pointer-events-none');
            newSlide.classList.add('opacity-100', 'z-10', 'pointer-events-auto');
            indicatorsContainer.children[currentSlide].classList.replace('bg-slate-300', 'bg-slate-800');

            // Renderda graafikud (kui veel pole renderdatud)
            renderChartsForSlide(currentSlide);

            // Nuppude staatus
            document.getElementById('btn-prev').disabled = currentSlide === 0;
            document.getElementById('btn-next').disabled = currentSlide === dataSet.length - 1;
        }

        // Sündmuste kuulajad nuppudele
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentSlide > 0) goToSlide(currentSlide - 1);
        });
        document.getElementById('btn-next').addEventListener('click', () => {
            if (currentSlide < dataSet.length - 1) goToSlide(currentSlide + 1);
        });

        // Käivita esmane renderdus (slaid 0)
        document.addEventListener("DOMContentLoaded", () => {
            renderChartsForSlide(0);
            document.getElementById('btn-prev').disabled = true; // Alguses esimene nupp keelatud
        });

    </script>
