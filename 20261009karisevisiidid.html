  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>
    tailwind.config = {
      theme: {

            sans: ['"Fira Sans"', 'sans-serif'],

        }
      }

    body {
      font-family: 'Fira Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    /* Kaardiradade interaktsioonid */
    .country-path {
      transition: fill 0.2s ease, stroke 0.2s ease;
      cursor: pointer;
    }
    .country-path:hover {
      filter: brightness(0.92);
      stroke: #0f172a;
      stroke-width: 0.8px;
    }
    .country-visited {
      fill: #0f294a !important; /* Tumesinine ametlik toon */
    }
    .country-visited:hover {
      fill: #1d4ed8 !important;
      filter: drop-shadow(0 2px 6px rgba(15, 41, 74, 0.45));
    }
    .country-home {
      fill: #0284c7 !important; /* Kodumaa Eesti helesinine */
    }

    /* Täisekraani režiimi stiilid (nii brauseri Fullscreen API kui ka CSS varuvariandi jaoks) */
    #chart-widget:fullscreen,
    #chart-widget:-webkit-full-screen,
    #chart-widget.is-fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      margin: 0 !important;
      border: none !important;
    }

    #chart-widget.is-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      z-index: 99999 !important;
    }

    #chart-widget:fullscreen #map-viewport,
    #chart-widget:-webkit-full-screen #map-viewport,
    #chart-widget.is-fullscreen #map-viewport {
      flex: 1 1 0% !important;
      height: 100% !important;
      min-height: 0 !important;
    }

    /* Skrolliribade stiilid */
    .custom-scrollbar::-webkit-scrollbar {
      height: 5px;
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.1);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* Alapealkirja tiheduse optimeerimine */
    .subtitle-text {
      letter-spacing: -0.035em;
    }
  </style>
</head>

    function initD3Map() {
      const width = mapViewport.clientWidth || 670;
      const height = mapViewport.clientHeight || 550;

      projection = d3.geoNaturalEarth1()
        .scale(width / 5.2)
        .center([15, 25])
        .translate([width / 2, height / 2]);

      pathGenerator = d3.geoPath().projection(projection);

      svg = d3.select("#map-svg");
      svg.selectAll("*").remove();

      g = svg.append("g").attr("id", "map-layers");

      zoomBehavior = d3.zoom()
        .scaleExtent([1, 14])
        .on("zoom", (event) => {
          g.attr("transform", event.transform);
        });

      svg.call(zoomBehavior);

      // Klõpsates kaardi tühjale taustale sulgub detailiaken
      svg.on('click', (event) => {
        if (event.target === svg.node() || event.target.tagName === 'svg') {
          closeDetailsModal();
        }
      });

      document.getElementById('zoom-in').onclick = () => {
        svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.4);
      };
      document.getElementById('zoom-out').onclick = () => {
        svg.transition().duration(300).call(zoomBehavior.scaleBy, 0.7);
      };
      document.getElementById('zoom-reset').onclick = () => {
        resetMapView();
      };
    }

    async function loadWorldMap() {
      initD3Map();
      const loader = document.getElementById('map-loader');
      loader.classList.remove('hidden');

      const urls = [
        "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json",
        "https://unpkg.com/world-atlas@2.0.2/countries-110m.json",
        "https://raw.githubusercontent.com/topojson/world-atlas/master/countries-110m.json"
      ];

      let topology = null;
      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            topology = await res.json();
            break;
          }
        } catch (e) {
          console.warn("TopoJSON laadimine ebaõnnestus allikast:", url);
        }
      }

      if (topology) {
        worldGeoData = topojson.feature(topology, topology.objects.countries);
        renderCountries();
        updateMapColors();
        loader.classList.add('hidden');
      } else {
        loader.innerHTML = `
          <div class="text-center p-4">
            <p class="text-xs text-rose-600 font-semibold mb-1">Kaardi laadimine ebaõnnestus</p>
            <p class="text-[11px] text-slate-500">Palun kontrolli internetiühendust ja värskenda lehte.</p>
          </div>
        `;
      }
    }

    function renderCountries() {
      if (!worldGeoData || !g) return;

      const layer = g.append("g").attr("class", "countries-layer");

      layer.selectAll("path")
        .data(worldGeoData.features)
        .enter()
        .append("path")
        .attr("class", "country-path")
        .attr("d", pathGenerator)
        .attr("stroke", "#94a3b8")
        .attr("stroke-width", "0.4")
        .attr("fill", "#e2e8f0")
        .on("mouseenter", handleCountryHover)
        .on("mousemove", handleCountryMove)
        .on("mouseleave", handleCountryLeave)
        .on("click", (event, d) => handleCountryClick(event, d));

      // Eesti esiletõstmine koduriigina
      g.selectAll(".country-path")
        .filter(d => parseInt(d.id, 10) === 233)
        .classed("country-home", true)
        .attr("stroke", "#0369a1")
        .attr("stroke-width", "0.8");
    }

    function getActiveVisits() {
      if (currentYear === "all") {
        const all = [];
        Object.keys(visitsData).forEach(yr => {
          visitsData[yr].forEach(v => all.push({ ...v, yearOccurred: yr }));
        });
        return all;
      }
      return (visitsData[currentYear] || []).map(v => ({ ...v, yearOccurred: currentYear }));
    }

    function getVisitsByFeatureId(featureId) {
      const active = getActiveVisits();
      const normId = parseInt(featureId, 10);
      return active.filter(v => v.id && parseInt(v.id, 10) === normId);
    }

    function updateMapColors() {
      if (!g) return;

      const active = getActiveVisits();
      const visitedIds = new Set(active.filter(v => v.id).map(v => parseInt(v.id, 10)));

      g.selectAll(".country-path")
        .each(function(d) {
          const path = d3.select(this);
          const normId = parseInt(d.id, 10);

          if (normId === 233) {
            path.classed("country-home", true);
            path.classed("country-visited", false);
          } else if (visitedIds.has(normId)) {
            path.classed("country-visited", true);
            path.classed("country-home", false);
          } else {
            path.classed("country-visited", false);
            path.classed("country-home", false);
          }
        });

      renderCountryChips();
    }

    function renderCountryChips() {
      const container = document.getElementById('country-chips-container');
      const counter = document.getElementById('stats-counter');
      const bottomSelect = document.getElementById('bottom-year-select');
      
      if (bottomSelect && bottomSelect.value !== currentYear) {
        bottomSelect.value = currentYear;
      }

      const visits = getActiveVisits();
      container.innerHTML = "";

      const uniqueCountries = [];
      const seen = new Set();
      visits.forEach(v => {
        const cName = v.displayName || v.country;
        if (!seen.has(cName)) {
          seen.add(cName);
          uniqueCountries.push(v);
        }
      });

      counter.textContent = `${visits.length} visiiti (${uniqueCountries.length} riiki)`;

      if (uniqueCountries.length === 0) {
        container.innerHTML = `<span class="text-slate-400 italic text-[11px]">Sellel perioodil visiite ei toimunud</span>`;
        return;
      }

      uniqueCountries.forEach(v => {
        const chip = document.createElement('button');
        chip.type = "button";
        chip.className = "px-2.5 py-1 rounded-full bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-700 text-[11px] font-medium border border-slate-200 transition-colors flex items-center gap-1 shrink-0 select-none";
        chip.innerHTML = `<span>${v.flag || "🌍"}</span> <span>${v.displayName || v.country}</span>`;
        chip.onclick = () => {
          if (chipsHaveMoved) return;
          focusCountryByName(v.country);
        };
        container.appendChild(chip);
      });
    }

    function handleCountryHover(event, d) {
      const normId = String(parseInt(d.id, 10));
      const visits = getVisitsByFeatureId(d.id);
      const isEstonia = normId === "233";

      tooltip.classList.remove('opacity-0');

      const estonianName = ESTONIAN_COUNTRY_NAMES[normId] || (d.properties && d.properties.name) || "Välisriik";

      if (isEstonia) {
        tooltip.innerHTML = `🇪🇪 <b class="text-[16pt]">Eesti</b> <span class="text-blue-300 text-[14pt]">(koduriik)</span>`;
      } else if (visits.length > 0) {
        const flag = visits[0].flag || "🌍";
        const countTxt = visits.length > 1 ? `(${visits.length} visiiti)` : '(visiit)';
        tooltip.innerHTML = `${flag} <b class="text-[16pt]">${visits[0].displayName || estonianName}</b> <span class="text-blue-300 text-[14pt]">★ ${countTxt}</span>`;
      } else {
        tooltip.innerHTML = `<span class="text-[16pt] font-semibold">${estonianName}</span> <span class="text-slate-400 text-[14pt]">(Teised riigid)</span>`;
      }
    }

    function handleCountryMove(event) {
      const rect = mapViewport.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      tooltip.style.left = `${x}px`;
      tooltip.style.top = `${y - 12}px`;
    }

    function handleCountryLeave() {
      tooltip.classList.add('opacity-0');
    }

    function handleCountryClick(event, d) {
      const normId = String(parseInt(d.id, 10));
      const visits = getVisitsByFeatureId(d.id);

      if (visits.length > 0) {
        openDetailsModal(visits[0].displayName || visits[0].country, visits[0].flag, visits);
        zoomToFeature(d);
      } else if (normId === "233") {
        openDetailsModal("Eesti Vabariik", "🇪🇪", [
          {
            yearOccurred: currentYear === "all" ? "2021–2026" : currentYear,
            action: "Alar Karis andis Riigikogu ees ametivande 11. oktoobril 2021, astudes Eesti Vabariigi presidendiks."
          }
        ]);
        zoomToFeature(d);
      } else {
        closeDetailsModal();
      }
    }

    function focusCountryByName(countryName) {
      const meta = COUNTRY_META[countryName];
      const visits = getActiveVisits().filter(v => v.country === countryName || (meta && v.country === meta.name));
      if (!meta || visits.length === 0) return;

      openDetailsModal(meta.name, meta.flag, visits);

      if (worldGeoData) {
        const feature = worldGeoData.features.find(f => parseInt(f.id, 10) === parseInt(meta.id, 10));
        if (feature) {
          zoomToFeature(feature);
        }
      }
    }

    function zoomToFeature(feature) {
      const bounds = pathGenerator.bounds(feature);
      const dx = bounds[1][0] - bounds[0][0];
      const dy = bounds[1][1] - bounds[0][1];
      const x = (bounds[0][0] + bounds[1][0]) / 2;
      const y = (bounds[0][1] + bounds[1][1]) / 2;

      const width = mapViewport.clientWidth || 670;
      const height = mapViewport.clientHeight || 550;

      const scale = Math.max(1.5, Math.min(8, 0.85 / Math.max(dx / width, dy / height)));
      const translate = [width / 2 - scale * x, height / 2 - scale * y];

      svg.transition()
        .duration(650)
        .call(
          zoomBehavior.transform,
          d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
        );
    }

    function resetMapView() {
      svg.transition()
        .duration(500)
        .call(zoomBehavior.transform, d3.zoomIdentity);
    }

    const detailsModal = document.getElementById('details-modal');
    const detailFlag = document.getElementById('detail-flag');
    const detailCountryName = document.getElementById('detail-country-name');
    const detailYearBadge = document.getElementById('detail-year-badge');
    const visitsListContainer = document.getElementById('visits-list-container');
    const photoWrapper = document.getElementById('photo-wrapper');
    const detailPhoto = document.getElementById('detail-photo');

    function openDetailsModal(countryName, flag, visits, isManual = false) {
      detailFlag.textContent = flag || "🌍";
      detailCountryName.textContent = countryName;
      
      if (isManual) {
        detailYearBadge.textContent = "Kasutusjuhis";
      } else {
        detailYearBadge.textContent = currentYear === "all" ? "Kõik visiidid (2021–2026)" : `${currentYear}. aasta visiidid`;
      }

      const photoItem = visits.find(v => v.photo && v.photo.trim() !== "");
      if (photoItem && photoItem.photo) {
        detailPhoto.src = photoItem.photo;
        photoWrapper.classList.remove('hidden');
      } else {
        photoWrapper.classList.add('hidden');
        detailPhoto.src = "";
      }

      visitsListContainer.innerHTML = "";

      visits.forEach((v, idx) => {
        const card = document.createElement('div');
        card.className = "p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-1.5";

        const headerDiv = document.createElement('div');
        headerDiv.className = "flex items-center justify-between";

        const titleSpan = document.createElement('span');
        titleSpan.className = "font-bold text-slate-800 text-[18pt] leading-tight";

        if (isManual) {
          titleSpan.textContent = v.title || "Juhis";
          headerDiv.appendChild(titleSpan);
        } else {
          titleSpan.textContent = v.title || (visits.length > 1 ? `${idx + 1}. visiit` : 'Visiidi tegevus');
          headerDiv.appendChild(titleSpan);

          if (v.yearOccurred || currentYear !== "all") {
            const yearTag = document.createElement('span');
            yearTag.className = "px-2 py-0.5 rounded bg-blue-100 text-blue-800 text-[14pt] font-semibold";
            yearTag.textContent = v.yearOccurred ? `${v.yearOccurred}. a` : `${currentYear}. a`;
            headerDiv.appendChild(yearTag);
          }
        }

        const descP = document.createElement('p');
        descP.className = "text-slate-700 text-[16pt] leading-relaxed pt-1";
        descP.textContent = v.action || "";

        card.appendChild(headerDiv);
        card.appendChild(descP);
        visitsListContainer.appendChild(card);
      });

      detailsModal.classList.remove('translate-x-full');
    }

    function closeDetailsModal() {
      detailsModal.classList.add('translate-x-full');
    }

    document.getElementById('close-modal-btn').onclick = closeDetailsModal;
    document.getElementById('modal-close-bottom').onclick = closeDetailsModal;

    function openInstructionsModal() {
      openDetailsModal(
        "Kaardirakenduse juhend",
        "📖",
        [
          {
            title: "Riikide uurimine",
            action: "Klõpsa kaardil tumesinisega tähistatud riigile või allservas olevale riiginupule, et näha presidendi visiidi ja kohtumiste üksikasju."
          },
          {
            title: "Kaardi liigutamine ja suum",
            action: "Kaarti saab vabalt hiirega haarata ja lohistada. Suurendamiseks ja vähendamiseks kasuta hiirerullikut, kaardil olevaid +/− nuppe või puuteekraanil kahe sõrme liigutust."
          },
          {
            title: "Aastate valik",
            action: "Vali päises asuvast keritavast aastateribast või kaardi allserva rippmenüüst soovitud aasta (2021–2026 või koondvaade „Kõik aastad”)."
          },
          {
            title: "Täisekraan ja vaate sulgemine",
            action: "Päises olev nupp „Ava üle ekraani” suurendab graafiku kogu kuvarile. Üksikasjade akna sulgemiseks klõpsa kaardil suvalises kohas või vajuta klahvi Esc."
          }
        ],
        true
      );
    }

    document.addEventListener('click', (event) => {
      if (!detailsModal.classList.contains('translate-x-full')) {
        const isInsideModal = detailsModal.contains(event.target);
        const isCountryPath = event.target.closest && event.target.closest('.country-path');
        const isChip = event.target.closest && event.target.closest('#country-chips-container');
        const isGuideBtn = event.target.closest && event.target.closest('#guide-btn');
        const isYearTab = event.target.closest && event.target.closest('#year-tabs');
        const isYearSelect = event.target.closest && event.target.closest('#bottom-year-select');

        if (!isInsideModal && !isCountryPath && !isChip && !isGuideBtn && !isYearTab && !isYearSelect) {
          closeDetailsModal();
        }
      }
    });

    const tabButtons = document.querySelectorAll('.tab-btn');
    const bottomYearSelect = document.getElementById('bottom-year-select');

    function switchActiveYear(year) {
      if (year === currentYear) return;
      currentYear = year;

      if (bottomYearSelect && bottomYearSelect.value !== currentYear) {
        bottomYearSelect.value = currentYear;
      }

      tabButtons.forEach(b => {
        const bYear = b.getAttribute('data-year');
        if (bYear === currentYear) {
          b.className = "tab-btn px-3 py-1.5 rounded-lg transition-all duration-150 whitespace-nowrap bg-blue-600 text-white font-semibold shadow-sm text-[16pt]";
          const activeBadge = b.querySelector('span');
          if (activeBadge) {
            activeBadge.className = "ml-1 px-2 py-0.5 text-xs rounded-full bg-blue-800/80 text-blue-100";
          }
        } else {
          b.className = "tab-btn px-3 py-1.5 rounded-lg transition-all duration-150 whitespace-nowrap text-slate-300 hover:text-white hover:bg-slate-800 text-[16pt]";
          const badge = b.querySelector('span');
          if (badge) {
            badge.className = "ml-1 px-2 py-0.5 text-xs rounded-full bg-slate-800 text-slate-300";
          }
        }
      });

      closeDetailsModal();
      updateMapColors();
    }

    tabButtons.forEach(btn => {
      btn.onclick = () => {
        if (tabsHaveMoved) return;
        switchActiveYear(btn.getAttribute('data-year'));
      };
    });

    if (bottomYearSelect) {
      bottomYearSelect.addEventListener('change', (e) => {
        switchActiveYear(e.target.value);
      });
    }

    // Ülemise aastateriba sikutamine (drag-to-scroll)
    const yearTabsNav = document.getElementById('year-tabs');
    let isTabsDragging = false;
    let tabsStartX = 0;
    let tabsScrollLeft = 0;

    yearTabsNav.addEventListener('mousedown', (e) => {
      isTabsDragging = true;
      tabsHaveMoved = false;
      tabsStartX = e.pageX - yearTabsNav.offsetLeft;
      tabsScrollLeft = yearTabsNav.scrollLeft;
    });

    yearTabsNav.addEventListener('mousemove', (e) => {
      if (!isTabsDragging) return;
      e.preventDefault();
      const x = e.pageX - yearTabsNav.offsetLeft;
      const walk = (x - tabsStartX) * 1.5;
      if (Math.abs(walk) > 4) {
        tabsHaveMoved = true;
      }
      yearTabsNav.scrollLeft = tabsScrollLeft - walk;
    });

    window.addEventListener('mouseup', () => {
      isTabsDragging = false;
      setTimeout(() => { tabsHaveMoved = false; }, 50);
    });

    yearTabsNav.addEventListener('wheel', (e) => {
      if (e.deltaY !== 0) {
        e.preventDefault();
        yearTabsNav.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    // Allserva riikide riba sikutamine (drag-to-scroll)
    const chipsContainer = document.getElementById('country-chips-container');
    let isChipsDragging = false;
    let chipsStartX = 0;
    let chipsScrollLeft = 0;

    chipsContainer.addEventListener('mousedown', (e) => {
      isChipsDragging = true;
      chipsHaveMoved = false;
      chipsStartX = e.pageX - chipsContainer.offsetLeft;
      chipsScrollLeft = chipsContainer.scrollLeft;
    });

    chipsContainer.addEventListener('mousemove', (e) => {
      if (!isChipsDragging) return;
      e.preventDefault();
      const x = e.pageX - chipsContainer.offsetLeft;
      const walk = (x - chipsStartX) * 1.5;
      if (Math.abs(walk) > 4) {
        chipsHaveMoved = true;
      }
      chipsContainer.scrollLeft = chipsScrollLeft - walk;
    });

    window.addEventListener('mouseup', () => {
      isChipsDragging = false;
    });

    const chartWidget = document.getElementById('chart-widget');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fullscreenText = document.getElementById('fullscreen-text');

    function isWidgetFullscreen() {
      return Boolean(
        document.fullscreenElement === chartWidget ||
        document.webkitFullscreenElement === chartWidget ||
        chartWidget.classList.contains('is-fullscreen')
      );
    }

    function updateFullscreenUI() {
      const isFull = isWidgetFullscreen();
      if (isFull) {
        fullscreenText.textContent = "Välju ekraanilt";
      } else {
        fullscreenText.textContent = "Ava üle ekraani";
        document.body.style.overflow = "";
      }
      setTimeout(() => {
        handleResize();
      }, 100);
    }

    fullscreenBtn.onclick = toggleFullscreen;

    async function toggleFullscreen() {
      if (!isWidgetFullscreen()) {
        try {
          if (chartWidget.requestFullscreen) {
            await chartWidget.requestFullscreen();
          } else if (chartWidget.webkitRequestFullscreen) {
            await chartWidget.webkitRequestFullscreen();
          } else {
            chartWidget.classList.add('is-fullscreen');
            document.body.style.overflow = "hidden";
          }
        } catch (err) {
          // Kui brauser või iframe ei luba Fullscreen API-t, rakendub CSS-varulahendus
          chartWidget.classList.add('is-fullscreen');
          document.body.style.overflow = "hidden";
        }
      } else {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          try {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              await document.webkitExitFullscreen();
            }
          } catch (e) {
            // Eirame võimalikke sulgemishälbeid
          }
        }
        chartWidget.classList.remove('is-fullscreen');
        document.body.style.overflow = "";
      }
      updateFullscreenUI();
    }

    document.addEventListener('fullscreenchange', updateFullscreenUI);
    document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

    const guideBtn = document.getElementById('guide-btn');
    if (guideBtn) {
      guideBtn.onclick = openInstructionsModal;
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (isWidgetFullscreen()) {
          toggleFullscreen();
        }
        closeDetailsModal();
      }
    });

    const resizeObserver = new ResizeObserver(() => {
      handleResize();
    });
    resizeObserver.observe(mapViewport);

    function handleResize() {
      if (!projection || !pathGenerator || !g) return;

      const width = mapViewport.clientWidth || 670;
      const height = mapViewport.clientHeight || 550;

      projection
        .scale(width / 5.2)
        .center([15, 25])
        .translate([width / 2, height / 2]);

      g.selectAll(".country-path").attr("d", pathGenerator);
    }

    window.onload = function() {
      loadWorldMap();
    };
  </script>
</body>
</html>
