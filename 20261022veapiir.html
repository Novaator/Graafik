<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erakondade reitingud</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fira Sans Condensed', sans-serif;
      font-weight: 400; /* Strict adherence to no-bold rule */
    }

    body {
      background-color: #ffffff;
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }

    .chart-container {
      width: 100%;
      max-width: 780px;
      max-height: 665px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chart-title {
      font-size: 20px;
      color: #333333;
      outline: none;
    }

    .chart-legend {
      font-size: 14px;
      color: #555555;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-symbol {
      display: inline-flex;
      align-items: center;
      position: relative;
      width: 32px;
      height: 14px;
    }

    .legend-symbol::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1.5px;
      background-color: #4A4A4A;
      transform: translateY(-50%);
    }

    .legend-symbol .cap {
      position: absolute;
      top: 1px;
      bottom: 1px;
      width: 1.5px;
      background-color: #4A4A4A;
    }

    .legend-symbol .cap.left { left: 0; }
    .legend-symbol .cap.right { right: 0; }

    .legend-symbol .dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      background-color: #4A4A4A;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .bars-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
    }

    .bar-row {
      display: flex;
      align-items: center;
      height: 40px;
      position: relative;
    }

    .party-label {
      width: 120px;
      min-width: 120px;
      text-align: right;
      padding-right: 12px;
      font-size: 15px;
      color: #222222;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .plot-area {
      flex-grow: 1;
      height: 100%;
      position: relative;
      border-left: 1px solid #CCCCCC;
    }

    .bar {
      height: 100%;
      border-radius: 0 3px 3px 0;
      display: flex;
      align-items: center;
      padding-left: 8px;
      position: relative;
      cursor: pointer;
    }

    .bar-value {
      font-size: 15px;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    .bar-value.outside {
      position: absolute;
      left: 100%;
      margin-left: 8px;
      color: #111111;
    }

    .error-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      pointer-events: all;
      cursor: pointer;
      z-index: 5;
    }

    .error-line {
      position: absolute;
      height: 1.5px;
      background-color: #4A4A4A;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .error-cap {
      position: absolute;
      width: 1.5px;
      height: 18px;
      background-color: #4A4A4A;
      top: 50%;
      transform: translateY(-50%);
    }

    .error-cap.left { left: 0; }
    .error-cap.right { right: 0; }

    .error-center-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: #4A4A4A;
      border-radius: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .chart-footer {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-top: 14px;
      gap: 3px;
    }

    .footer-line {
      font-size: 13px;
      color: #777777;
      outline: none;
    }

    /* Tooltip Styles */
    .custom-tooltip {
      position: fixed;
      display: none;
      background: #333333;
      color: #FFFFFF;
      font-size: 13px;
      padding: 5px 9px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
      transform: translate(-50%, -100%);
      margin-top: -8px;
    }

    .custom-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 4px;
      border-style: solid;
      border-color: #333333 transparent transparent transparent;
    }
  </style>
</head>
<body>

  <div class="chart-container">
    <div class="chart-header">
      <div class="chart-title" contenteditable="true">Erakondade reitingud küsitlusperioodil 12.-21. oktoober 2026</div>
      <div class="chart-legend">
        <span class="legend-symbol">
          <span class="cap left"></span>
          <span class="dot"></span>
          <span class="cap right"></span>
        </span>
        <span>- veapiir</span>
      </div>
    </div>

    <div class="bars-container" id="barsArea"></div>

    <div class="chart-footer">
      <div class="footer-line" contenteditable="true">Graafika: Mirjam Mäekivi</div>
      <div class="footer-line" contenteditable="true">Allikas: Kantar Emor</div>
    </div>
  </div>

  <div class="custom-tooltip" id="tooltip"></div>

  <script>
    const data = [
      { name: "Keskerakond", support: 20.6, error: 2.1, color: "#027D2B", textTheme: "light" },
      { name: "SDE", support: 20.4, error: 2.0, color: "#CE1126", textTheme: "light" },
      { name: "Isamaa", support: 19.4, error: 2.0, color: "#009DE0", textTheme: "light" },
      { name: "Reformierakond", support: 14.2, error: 1.8, color: "#FFDC00", textTheme: "dark" },
      { name: "EKRE", support: 13.8, error: 1.8, color: "#2139B5", textTheme: "light" },
      { name: "Parempoolsed", support: 6.5, error: 1.3, color: "#ff6100", textTheme: "dark" },
      { name: "KOOS", support: 1.7, error: 0.7, color: "#dc5356", textTheme: "dark" },
      { name: "Eesti 200", support: 1.5, error: 0.6, color: "#00C0C9", textTheme: "dark" },
      { name: "Rohelised", support: 0.8, error: 0.5, color: "#60BE19", textTheme: "dark" },
      { name: "ERK", support: 0.7, error: 0.4, color: "#000000", textTheme: "dark" },
      { name: "Vasakliit", support: 0.2, error: 0.2, color: "#FA040A", textTheme: "dark" },
      { name: "Vabaerakond", support: 0.0, error: 0.0, color: "#2EC9D1", textTheme: "dark" }
    ];

    const maxVal = Math.max(...data.map(d => d.support + d.error));
    const scaleMax = maxVal * 1.15; // Jätame veidi ruumi paremale

    const barsContainer = document.getElementById('barsArea');
    const tooltip = document.getElementById('tooltip');

    function showTooltip(e, text) {
      tooltip.innerText = text;
      tooltip.style.display = 'block';
      moveTooltip(e);
    }

    function moveTooltip(e) {
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + 'px';
    }

    function hideTooltip() {
      tooltip.style.display = 'none';
    }

    data.forEach(item => {
      const row = document.createElement('div');
      row.className = 'bar-row';

      const label = document.createElement('div');
      label.className = 'party-label';
      label.innerText = item.name;
      row.appendChild(label);

      const plotArea = document.createElement('div');
      plotArea.className = 'plot-area';

      const barWidthPct = (item.support / scaleMax) * 100;
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.width = barWidthPct + '%';
      bar.style.backgroundColor = item.color;

      const valFormatted = item.support.toFixed(1).replace('.', ',') + '%';
      const errFormatted = '± ' + item.error.toFixed(1).replace('.', ',') + '%';

      const valSpan = document.createElement('span');
      valSpan.className = 'bar-value';

      if (item.support < 2.5) {
        valSpan.classList.add('outside');
        valSpan.innerText = valFormatted;
        // Väljaspool tulpa on tekst alati must, hoolimata teemast
        valSpan.style.color = '#111111';
        // Nihutame teksti paremale, et vältida kattumist veapiiriga, kui see eksisteerib
        let offset = item.error > 0 ? ((item.error / scaleMax) * 100) + 1.5 : 1;
        valSpan.style.left = `calc(${barWidthPct}% + ${offset}%)`;
        plotArea.appendChild(valSpan);
      } else {
        valSpan.innerText = valFormatted;
        valSpan.style.color = item.textTheme === 'light' ? '#FFFFFF' : '#111111';
        bar.appendChild(valSpan);
      }

      bar.addEventListener('mouseenter', (e) => showTooltip(e, `${item.name}: ${valFormatted}`));
      bar.addEventListener('mousemove', moveTooltip);
      bar.addEventListener('mouseleave', hideTooltip);

      plotArea.appendChild(bar);

      // Veapiiri marker
      if (item.support > 0 || item.error > 0) {
        const minVal = Math.max(0, item.support - item.error);
        const maxVal = item.support + item.error;
        const leftPct = (minVal / scaleMax) * 100;
        const widthPct = ((maxVal - minVal) / scaleMax) * 100;
        const centerOffsetPct = (item.support / scaleMax) * 100;

        const errorMarker = document.createElement('div');
        errorMarker.className = 'error-marker';
        errorMarker.style.left = leftPct + '%';
        errorMarker.style.width = Math.max(widthPct, 0.2) + '%'; 

        const line = document.createElement('div');
        line.className = 'error-line';
        errorMarker.appendChild(line);

        const leftCap = document.createElement('div');
        leftCap.className = 'error-cap left';
        errorMarker.appendChild(leftCap);

        const rightCap = document.createElement('div');
        rightCap.className = 'error-cap right';
        errorMarker.appendChild(rightCap);

        const centerDot = document.createElement('div');
        centerDot.className = 'error-center-dot';
        centerDot.style.left = ((centerOffsetPct - leftPct) / widthPct) * 100 + '%';
        errorMarker.appendChild(centerDot);

        // Veapiiri tooltip - peatame event propagationi, et vältida tulba tooltippi kattumist
        errorMarker.addEventListener('mouseenter', (e) => {
          e.stopPropagation();
          showTooltip(e, errFormatted);
        });
        errorMarker.addEventListener('mousemove', (e) => {
          e.stopPropagation();
          moveTooltip(e);
        });
        errorMarker.addEventListener('mouseleave', hideTooltip);

        plotArea.appendChild(errorMarker);
      }

      row.appendChild(plotArea);
      barsContainer.appendChild(row);
    });
  </script>
</body>
</html>
