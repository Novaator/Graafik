    // Üksiku slaidi pildi või kohatäite komponent
    function SlideView({ item, onOpenModal }) {
      if (!item) return null;

      if (item.image) {
        return (
          <div 
            onClick={() => onOpenModal && onOpenModal(item)}
            className="flex-shrink-0 w-full h-full relative cursor-zoom-in"
          >
            <img 
              src={item.image} 
              alt={formatName(item.name)} 
              className="w-full h-full object-cover pointer-events-none select-none" 
            />
            {item.author && (
              <div className="absolute bottom-2 left-3 bg-black/60 text-white/90 text-[11px] px-2.5 py-1 rounded-md backdrop-blur-sm pointer-events-none">
                Foto: {item.author}
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="flex-shrink-0 w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-[#1c3e1e] to-[#0e2410] text-[#c9e8ca] select-none p-6 text-center">
          <div className="w-16 h-16 rounded-2xl bg-white/10 flex items-center justify-center mb-3 text-white/70 shadow-inner">
            <ImageIcon className="w-9 h-9" />
          </div>
          <span className="text-base font-semibold tracking-wide text-white">Foto lisamisel</span>
          <span className="text-xs text-[#a2d8a4] mt-1 italic tracking-wide">{item.latin}</span>
        </div>
      );
    }

    function App() {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [modalImageItem, setModalImageItem] = useState(null);
      
      // Sikutamise ja animatsiooni olekud
      const [dragStartPos, setDragStartPos] = useState(null);
      const [dragOffset, setDragOffset] = useState(0);
      const [slideOffset, setSlideOffset] = useState(-1);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [isJumping, setIsJumping] = useState(false);
      
      // Pisipiltide sikutamise olekud
      const [isThumbDragging, setIsThumbDragging] = useState(false);
      const [thumbStartX, setThumbStartX] = useState(0);
      const [thumbScrollLeft, setThumbScrollLeft] = useState(0);
      const [thumbDragDistance, setThumbDragDistance] = useState(0);
      
      const thumbnailContainerRef = useRef(null);

      const currentItem = slimeMolds[currentIndex];
      
      const prevIndex = currentIndex === 0 ? slimeMolds.length - 1 : currentIndex - 1;
      const nextIndex = currentIndex === slimeMolds.length - 1 ? 0 : currentIndex + 1;

      // ESC klahviga modaali sulgemine
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setModalImageItem(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Kerib valitud pisipildi automaatselt vaatevälja keskele
      useEffect(() => {
        if (thumbnailContainerRef.current) {
          const container = thumbnailContainerRef.current;
          const selectedThumb = container.children[currentIndex];
          if (selectedThumb) {
            const scrollLeft = selectedThumb.offsetLeft - (container.offsetWidth / 2) + (selectedThumb.offsetWidth / 2);
            container.scrollTo({ left: scrollLeft, behavior: 'smooth' });
          }
        }
      }, [currentIndex]);

      const handleNext = () => {
        if (isTransitioning || isJumping) return;
        setIsTransitioning(true);
        setDragOffset(0);
        setSlideOffset(-2);
        
        setTimeout(() => {
          setIsTransitioning(false);
          setSlideOffset(-1);
          setCurrentIndex(nextIndex);
        }, 300);
      };

      const handlePrev = () => {
        if (isTransitioning || isJumping) return;
        setIsTransitioning(true);
        setDragOffset(0);
        setSlideOffset(0);
        
        setTimeout(() => {
          setIsTransitioning(false);
          setSlideOffset(-1);
          setCurrentIndex(prevIndex);
        }, 300);
      };

      const goToSlide = (index) => {
        if (isTransitioning || isJumping || index === currentIndex) return;
        setIsJumping(true);
        
        setTimeout(() => {
          setCurrentIndex(index);
          setIsJumping(false);
        }, 250);
      };

      // --- Pisipiltide kerimine hiirega ---
      const handleThumbMouseDown = (e) => {
        setIsThumbDragging(true);
        setThumbDragDistance(0);
        setThumbStartX(e.pageX - thumbnailContainerRef.current.offsetLeft);
        setThumbScrollLeft(thumbnailContainerRef.current.scrollLeft);
      };

      const handleThumbMouseMove = (e) => {
        if (!isThumbDragging) return;
        e.preventDefault();
        const x = e.pageX - thumbnailContainerRef.current.offsetLeft;
        const walk = x - thumbStartX;
        setThumbDragDistance(Math.abs(walk));
        thumbnailContainerRef.current.scrollLeft = thumbScrollLeft - walk;
      };

      const handleThumbMouseUpOrLeave = () => {
        setIsThumbDragging(false);
      };

      // --- Peapildi libistamine / swipe ---
      const handleDragStart = (clientX, clientY) => {
        if (isTransitioning || isJumping) return;
        setDragStartPos({ x: clientX, y: clientY });
        setDragOffset(0);
      };

      const handleDragMove = (clientX, clientY) => {
        if (!dragStartPos) return;
        
        const diffX = clientX - dragStartPos.x;
        const diffY = clientY - dragStartPos.y;

        if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(dragOffset) < 10) {
          setDragStartPos(null);
          return;
        }
        
        setDragOffset(diffX);
      };

      const handleDragEnd = () => {
        if (!dragStartPos) return;
        setDragStartPos(null);
        
        if (dragOffset > 75) {
          handlePrev();
        } else if (dragOffset < -75) {
          handleNext();
        } else {
          setIsTransitioning(true);
          setDragOffset(0);
          setTimeout(() => setIsTransitioning(false), 300);
        }
      };

      const handleOpenModal = (item) => {
        if (item && item.image && Math.abs(dragOffset) < 5) {
          setModalImageItem(item);
        }
      };

      return (
        <div 
          className="w-full min-h-screen flex items-center justify-center bg-transparent py-4 sm:p-6"
          style={{ color: '#28902d' }}
        >
          <div 
            className="max-w-2xl w-full bg-[#f4faf4] sm:rounded-2xl shadow-sm sm:shadow-xl overflow-hidden border-y sm:border border-[#28902d]/25 relative flex flex-col"
          >
            {/* Peapilt ja pühkimisala */}
            <div 
              className="relative h-72 sm:h-84 md:h-96 w-full group bg-[#112413] select-none overflow-hidden touch-pan-y"
              onMouseDown={(e) => handleDragStart(e.clientX, e.clientY)}
              onMouseMove={(e) => handleDragMove(e.clientX, e.clientY)}
              onMouseUp={handleDragEnd}
              onMouseLeave={handleDragEnd}
              onTouchStart={(e) => handleDragStart(e.touches[0].clientX, e.touches[0].clientY)}
              onTouchMove={(e) => handleDragMove(e.touches[0].clientX, e.touches[0].clientY)}
              onTouchEnd={handleDragEnd}
            >
              {/* Kolme slaidi liigutatav lint */}
              <div 
                className={`flex w-full h-full ${
                  isTransitioning ? 'transition-transform duration-300 ease-out' : 'duration-0'
                } ${isJumping ? 'opacity-0 scale-[1.02] transition-all duration-250' : 'opacity-100 scale-100'}`}
                style={{ transform: `translateX(calc(${slideOffset * 100}% + ${dragOffset}px))` }}
              >
                <SlideView item={slimeMolds[prevIndex]} onOpenModal={handleOpenModal} />
                <SlideView item={currentItem} onOpenModal={handleOpenModal} />
                <SlideView item={slimeMolds[nextIndex]} onOpenModal={handleOpenModal} />
              </div>
              
              {/* Eelmise slaidi nupp */}
              <button 
                onMouseDown={(e) => e.stopPropagation()}
                onMouseUp={(e) => e.stopPropagation()}
                onTouchStart={(e) => e.stopPropagation()}
                onTouchEnd={(e) => e.stopPropagation()}
                onClick={(e) => { e.stopPropagation(); handlePrev(); }}
                className="absolute left-3 top-1/2 -translate-y-1/2 p-2.5 bg-[#28902d]/85 text-white rounded-full hover:bg-[#28902d] hover:scale-105 active:scale-95 transition-all backdrop-blur-md shadow-lg z-20"
                aria-label="Eelmine limak"
              >
                <ChevronLeft size={22} />
              </button>
              
              {/* Järgmise slaidi nupp */}
              <button 
                onMouseDown={(e) => e.stopPropagation()}
                onMouseUp={(e) => e.stopPropagation()}
                onTouchStart={(e) => e.stopPropagation()}
                onTouchEnd={(e) => e.stopPropagation()}
                onClick={(e) => { e.stopPropagation(); handleNext(); }}
                className="absolute right-3 top-1/2 -translate-y-1/2 p-2.5 bg-[#28902d]/85 text-white rounded-full hover:bg-[#28902d] hover:scale-105 active:scale-95 transition-all backdrop-blur-md shadow-lg z-20"
                aria-label="Järgmine limak"
              >
                <ChevronRight size={22} />
              </button>

              {/* Pildi suurendamise nupp */}
              {currentItem.image && (
                <button
                  onMouseDown={(e) => e.stopPropagation()}
                  onTouchStart={(e) => e.stopPropagation()}
                  onClick={(e) => { e.stopPropagation(); setModalImageItem(currentItem); }}
                  className="absolute bottom-3 right-3 p-2 bg-black/60 hover:bg-[#28902d] text-white rounded-lg backdrop-blur-md transition-all shadow-md z-20 flex items-center gap-1.5 text-xs font-medium cursor-pointer"
                  title="Suurenda pilti"
                >
                  <ZoomInIcon size={16} />
                  <span className="hidden sm:inline">Suurenda</span>
                </button>
              )}

              {/* Loendur */}
              <div className="absolute top-4 right-4 bg-[#28902d]/90 text-white px-3.5 py-1 rounded-full text-xs font-bold tracking-wider backdrop-blur-sm z-10 shadow pointer-events-none">
                {currentIndex + 1} / {slimeMolds.length}
              </div>
            </div>

            {/* Pisipiltide riba */}
            <div 
              ref={thumbnailContainerRef}
              className={`w-full bg-[#1a5e1d]/8 flex gap-2 overflow-x-auto hide-scrollbar p-3 border-b border-[#28902d]/15 items-center select-none ${isThumbDragging ? 'cursor-grabbing' : 'cursor-grab'}`}
              onMouseDown={handleThumbMouseDown}
              onMouseMove={handleThumbMouseMove}
              onMouseUp={handleThumbMouseUpOrLeave}
              onMouseLeave={handleThumbMouseUpOrLeave}
            >
              {slimeMolds.map((item, idx) => (
                <button
                  key={item.id}
                  onClick={(e) => {
                    if (thumbDragDistance > 5) {
                      e.preventDefault();
                      return;
                    }
                    goToSlide(idx);
                  }}
                  className={`flex-shrink-0 w-14 h-14 sm:w-16 sm:h-16 rounded-lg overflow-hidden transition-all duration-200 border-2 relative ${
                    currentIndex === idx 
                      ? 'border-[#28902d] ring-2 ring-[#28902d]/30 opacity-100 shadow scale-105' 
                      : 'border-transparent opacity-60 hover:opacity-100 hover:scale-100'
                  }`}
                  aria-label={`Mine liigile: ${formatName(item.name)}`}
                  title={`${formatName(item.name)} (${item.latin})`}
                >
                  {item.image ? (
                    <img 
                      src={item.image} 
                      alt="" 
                      className="w-full h-full object-cover pointer-events-none" 
                    />
                  ) : (
                    <div className="w-full h-full bg-[#204924] text-[#a4d4a7] flex flex-col items-center justify-center text-[10px] font-bold p-1 text-center">
                      <ImageIcon className="w-4 h-4 mb-0.5 opacity-70" />
                      <span className="leading-tight truncate max-w-full">{item.name.slice(0, 5)}…</span>
                    </div>
                  )}
                </button>
              ))}
            </div>

            {/* Sisuplokk: Pealkirjad ja kirjeldus */}
            <div className={`p-6 sm:p-8 transition-all duration-300 ease-out ${
              (isTransitioning || isJumping) ? 'opacity-0 translate-y-2' : 'opacity-100 translate-y-0'
            }`}>
              {/* Eestikeelne peanimi püstkirjas: ainult esitäht suur (nt Sinakas kobarlimak) */}
              <h2 className="text-2xl sm:text-3xl font-bold tracking-tight mb-1" style={{ color: '#28902d' }}>
                {formatName(currentItem.name)}
              </h2>

              {/* Ladinakeelne teaduslik nimi kursiivis selle all */}
              <p className="text-base sm:text-lg italic font-medium opacity-85 mb-5" style={{ color: '#1a5e1d' }}>
                {currentItem.latin}
              </p>
              
              {/* Kirjeldus */}
              <div className="min-h-[5.5rem] bg-white/75 p-5 rounded-xl border border-[#28902d]/15 shadow-sm">
                {currentItem.description ? (
                  <p 
                    className="leading-relaxed text-[1.02rem] text-[#1a4a1c]" 
                    dangerouslySetInnerHTML={{ __html: currentItem.description }}
                  />
                ) : (
                  <div className="text-[#28902d]/80 italic py-2 flex items-center gap-2">
                    <span className="inline-block w-2 h-2 rounded-full bg-[#28902d]/60"></span>
                    Selle limaku kohta kirjeldus ja foto hetkel puuduvad.
                  </div>
                )}
              </div>

              {/* Kiire navigeerimisriba ja olekurida allservas */}
              <div className="mt-6 pt-4 border-t border-[#28902d]/15 flex items-center justify-between text-xs font-semibold text-[#1a5e1d]/75">
                <button 
                  onClick={handlePrev}
                  className="hover:text-[#28902d] transition-colors flex items-center gap-1 py-1 px-2 rounded hover:bg-[#28902d]/10"
                >
                  <ChevronLeft size={16} /> Eelmine
                </button>
                <span className="opacity-60 uppercase tracking-wider text-[11px]">
                  Limak {currentIndex + 1} / {slimeMolds.length}
                </span>
                <button 
                  onClick={handleNext}
                  className="hover:text-[#28902d] transition-colors flex items-center gap-1 py-1 px-2 rounded hover:bg-[#28902d]/10"
                >
                  Järgmine <ChevronRight size={16} />
                </button>
              </div>

            </div>

          </div>

          {/* Täisekraanil / suurendatud pildi modaal (Lightbox) */}
          {modalImageItem && (
            <div 
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-3 sm:p-6 transition-all"
              onClick={() => setModalImageItem(null)}
            >
              {/* Sulgemisnupp */}
              <button 
                onClick={() => setModalImageItem(null)}
                className="absolute top-4 right-4 sm:top-6 sm:right-6 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 p-2.5 rounded-full backdrop-blur-sm transition-all z-50"
                aria-label="Sulge suurendatud vaade"
              >
                <CloseIcon size={26} />
              </button>

              {/* Suur pilt ja info */}
              <div 
                className="max-w-5xl max-h-[85vh] w-full flex flex-col items-center justify-center"
                onClick={(e) => e.stopPropagation()}
              >
                <img 
                  src={modalImageItem.image} 
                  alt={formatName(modalImageItem.name)} 
                  className="max-h-[75vh] max-w-full object-contain rounded-lg shadow-2xl border border-white/10"
                />
                
                <div className="mt-3 text-center text-white">
                  <div className="text-lg font-bold">
                    {formatName(modalImageItem.name)} <span className="font-normal italic text-white/70">({modalImageItem.latin})</span>
                  </div>
                  {modalImageItem.author && (
                    <div className="text-xs text-white/60 mt-1">
                      Foto autor: {modalImageItem.author}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
