<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erakondade toetused septembris, oktoobris ja novembris</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fira Sans Condensed', sans-serif; }
    html, body { width: 100%; background: #FFFFFF; color: #333333; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    .c1-container { width: 100%; max-width: 820px; margin: 0 auto; padding: 18px 20px 14px 20px; background: #FFFFFF; }
    .c1-title { font-size: clamp(20px, 2.8vw, 24px); line-height: 1.25; color: #4A4A4A; font-weight: 400; margin-bottom: 24px; }
    .c1-plot-wrapper { position: relative; display: flex; align-items: stretch; width: 100%; padding-left: 24px; }
    .c1-y-title { position: absolute; left: 2px; top: 48%; transform: translateY(-50%) rotate(-90deg); font-size: 16px; color: #4A4A4A; user-select: none; }
    .c1-chart-area { position: relative; flex: 1; height: 300px; margin-top: 8px; }
    .c1-grid-line { position: absolute; left: 0; right: 0; border-bottom: 1px solid #e0e0e0; pointer-events: none; z-index: 1; }
    .c1-grid-line.zero { border-bottom: 2px solid #333333; z-index: 4; }
    .c1-grid-label { position: absolute; left: 0; bottom: 4px; font-size: 15px; color: #4A4A4A; line-height: 1; }
    .c1-groups-row { position: absolute; left: 28px; right: 0; top: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-around; z-index: 3; }
    .c1-group { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding: 0 6px; }
    .c1-tick { position: absolute; bottom: -8px; left: 0; width: 1px; height: 8px; background: #555555; }
    .c1-tick-right { position: absolute; bottom: -8px; right: 0; width: 1px; height: 8px; background: #555555; }
    .c1-bar-col { position: relative; width: 24px; max-width: 30%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
    .c1-bar { position: relative; width: 100%; cursor: pointer; transition: filter 0.15s ease; display: flex; justify-content: center; align-items: flex-end; }
    .c1-bar:hover { filter: brightness(0.92); }
    .c1-val-inside { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 15px; line-height: 1; padding-top: 6px; white-space: nowrap; pointer-events: none; }
    .c1-val-outside { position: absolute; bottom: 100%; left: 50%; writing-mode: vertical-rl; transform: translateX(-50%) rotate(180deg); padding-top: 5px; font-size: 15px; line-height: 1; color: #111111; white-space: nowrap; pointer-events: none; }
    .c1-x-labels { margin-left: 52px; display: flex; justify-content: space-around; height: 106px; padding-top: 10px; }
    .c1-x-label-cell { flex: 1; position: relative; }
    .c1-x-label-text { position: absolute; top: 6px; right: 42%; transform: rotate(-45deg); transform-origin: top right; font-size: 15px; color: #333333; white-space: nowrap; }
    .c1-footer { text-align: center; margin-top: 4px; font-size: 15px; color: #4A4A4A; }
    .tooltip { position: fixed; top: 0; left: 0; background: #FFFFFF; color: #222222; border: 1px solid #CCCCCC; border-radius: 4px; padding: 5px 10px; font-size: 14px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); pointer-events: none; opacity: 0; transition: opacity 0.1s ease; z-index: 100; }
    @media (max-width: 520px) { .c1-bar-col { width: 16px; } .c1-val-inside, .c1-val-outside { font-size: 12px; } .c1-x-label-text { font-size: 13px; } }
  </style>
</head>
<body>
  <main class="c1-container">
    <h1 class="c1-title">Erakondade toetused <span style="color:#8fd0f2;font-weight:700">septembris</span>, <span style="color:#2b8ec2;font-weight:700">oktoobris</span> ja <span style="color:#064d73;font-weight:700">novembris</span></h1>
    <div class="c1-plot-wrapper">
      <div class="c1-y-title">%</div>
      <div class="c1-chart-area" id="chart-area">
        <div class="c1-groups-row" id="groups-row"></div>
      </div>
    </div>
    <div class="c1-x-labels" id="x-labels"></div>
    <footer class="c1-footer">Andmed: Emor</footer>
  </main>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <script>
    (function () {
      const months = [{"label":"September","color":"#8fd0f2","textColor":"#111111"},{"label":"Oktoober","color":"#2b8ec2","textColor":"#FFFFFF"},{"label":"November","color":"#064d73","textColor":"#FFFFFF"}];
      const parties = [{"name":"Keskerakond","tooltipName":"Keskerakond","values":[17,21,25]},{"name":"SDE","tooltipName":"SDE","values":[17,20,21]},{"name":"Isamaa","tooltipName":"Isamaa","values":[24,19,19]},{"name":"EKRE","tooltipName":"EKRE","values":[13,14,14]},{"name":"Reformierakond","tooltipName":"Reformierakond","values":[15,14,11]},{"name":"Parempoolsed","tooltipName":"Parempoolsed","values":[10,7,6]},{"name":"Eesti 200","tooltipName":"Eesti 200","values":[2,2,2]}];
      const maxScaleY = 32;
      const chartArea = document.getElementById('chart-area');
      const groupsRow = document.getElementById('groups-row');
      const xLabels = document.getElementById('x-labels');
      const tooltip = document.getElementById('tooltip');

      [0, 10, 20, 30].forEach(function (tickVal) {
        const line = document.createElement('div');
        line.className = 'c1-grid-line' + (tickVal === 0 ? ' zero' : '');
        line.style.bottom = ((tickVal / maxScaleY) * 100) + '%';
        const lbl = document.createElement('span');
        lbl.className = 'c1-grid-label';
        lbl.textContent = tickVal;
        line.appendChild(lbl);
        chartArea.insertBefore(line, groupsRow);
      });

      function showTip(txt, x, y) {
        tooltip.textContent = txt;
        tooltip.style.opacity = '1';
        const r = tooltip.getBoundingClientRect();
        let l = x + 12, t = y - r.height - 8;
        if (l + r.width > window.innerWidth - 8) l = x - r.width - 12;
        if (l < 8) l = 8;
        if (t < 8) t = y + 12;
        tooltip.style.left = l + 'px';
        tooltip.style.top = t + 'px';
      }

      function hideTip() { tooltip.style.opacity = '0'; }

      parties.forEach(function (p, i) {
        const g = document.createElement('div');
        g.className = 'c1-group';
        const tick = document.createElement('span');
        tick.className = 'c1-tick';
        g.appendChild(tick);
        if (i === parties.length - 1) {
          const tr = document.createElement('span');
          tr.className = 'c1-tick-right';
          g.appendChild(tr);
        }

        months.forEach(function (m, mIdx) {
          const val = p.values[mIdx];
          const col = document.createElement('div');
          col.className = 'c1-bar-col';
          const bar = document.createElement('div');
          bar.className = 'c1-bar';
          bar.style.height = ((val / maxScaleY) * 100) + '%';
          bar.style.backgroundColor = m.color;
          const sp = document.createElement('span');
          sp.textContent = val + '%';
          if (val <= 3) { sp.className = 'c1-val-outside'; }
          else { sp.className = 'c1-val-inside'; sp.style.color = m.textColor; }
          bar.appendChild(sp);

          const label = p.tooltipName + ' (' + m.label + '): ' + val + '%';
          bar.addEventListener('mouseenter', function (e) { showTip(label, e.clientX, e.clientY); });
          bar.addEventListener('mousemove', function (e) { showTip(label, e.clientX, e.clientY); });
          bar.addEventListener('mouseleave', hideTip);
          col.appendChild(bar);
          g.appendChild(col);
        });

        groupsRow.appendChild(g);

        const xc = document.createElement('div');
        xc.className = 'c1-x-label-cell';
        const xt = document.createElement('span');
        xt.className = 'c1-x-label-text';
        xt.textContent = p.name;
        xc.appendChild(xt);
        xLabels.appendChild(xc);
      });

      window.addEventListener('scroll', hideTip, { passive: true });
    })();
  </script>
</body>
</html>
