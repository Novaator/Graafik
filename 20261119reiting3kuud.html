<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erakondade toetused septembris, oktoobris ja novembris</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fira Sans Condensed', sans-serif; }
    html, body { width: 100%; background: #FFFFFF; color: #333333; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    .c1-container { width: 100%; max-width: 670px; max-height: 440px; margin: 0 auto; padding: 12px 12px 10px; overflow: hidden; background: #FFFFFF; }
    .c1-title { font-size: 21px; line-height: 1.22; color: #4A4A4A; font-weight: 400; margin: 0 0 8px 0; }
    .c1-svg { width: 100%; height: auto; display: block; overflow: visible; }
    .c1-bar-rect { cursor: pointer; transition: filter 0.14s ease; }
    .c1-bar-rect:hover { filter: brightness(0.92); }
    .c1-footer { text-align: center; margin: 6px 0 0 0; font-size: 13.5px; line-height: 1.2; color: #555555; font-weight: 400; }
    .tooltip { position: fixed; top: 0; left: 0; background: #222222; color: #FFFFFF; border-radius: 4px; padding: 5px 10px; font-size: 13px; font-weight: 400; line-height: 1.2; white-space: nowrap; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22); pointer-events: none; opacity: 0; transition: opacity 0.1s ease; z-index: 100; }
    @media (max-width: 480px) { .c1-title { font-size: 18px; } }
  </style>
</head>
<body>
  <main class="c1-container">
    <h1 class="c1-title">Erakondade toetused <span style="color:#8fd0f2;font-weight:700">septembris</span>, <span style="color:#2b8ec2;font-weight:700">oktoobris</span> ja <span style="color:#064d73;font-weight:700">novembris</span></h1>
    <svg id="chart-svg" class="c1-svg" viewBox="0 0 650 305" role="img" aria-label="Erakondade toetused septembris, oktoobris ja novembris"></svg>
    <footer class="c1-footer">Andmed: Emor</footer>
  </main>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <script>
    (function () {
      const months = [{"label":"september","color":"#8fd0f2","textColor":"#111111"},{"label":"oktoober","color":"#2b8ec2","textColor":"#FFFFFF"},{"label":"november","color":"#064d73","textColor":"#FFFFFF"}];
      const parties = [{"name":"Keskerakond","tooltipName":"Keskerakond","values":[17,21,25]},{"name":"SDE","tooltipName":"SDE","values":[17,20,21]},{"name":"Isamaa","tooltipName":"Isamaa","values":[24,19,19]},{"name":"EKRE","tooltipName":"EKRE","values":[13,14,14]},{"name":"Reformierakond","tooltipName":"Reformierakond","values":[15,14,11]},{"name":"Parempoolsed","tooltipName":"Parempoolsed","values":[10,7,6]},{"name":"Eesti 200","tooltipName":"Eesti 200","values":[2,2,2]}];
      const svg = document.getElementById('chart-svg');
      const tooltip = document.getElementById('tooltip');

      const W = 650, H = 305;
      const padLeft = 42, padRight = 14, padTop = 16, padBottom = 84;
      const plotW = W - padLeft - padRight;
      const plotH = H - padTop - padBottom;
      const baseY = padTop + plotH;
      const maxY = 30;

      function el(tag, attrs) {
        const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
        if (attrs) {
          Object.keys(attrs).forEach(function (k) { node.setAttribute(k, String(attrs[k])); });
        }
        return node;
      }

      function showTip(txt, x, y) {
        tooltip.textContent = txt;
        tooltip.style.opacity = '1';
        const r = tooltip.getBoundingClientRect();
        let l = x + 12, t = y - r.height - 8;
        if (l + r.width > window.innerWidth - 8) l = x - r.width - 12;
        if (l < 8) l = 8;
        if (t < 8) t = y + 12;
        tooltip.style.left = l + 'px';
        tooltip.style.top = t + 'px';
      }

      function hideTip() { tooltip.style.opacity = '0'; }

      [0, 10, 20, 30].forEach(function (tickVal) {
        const y = baseY - (tickVal / maxY) * plotH;
        svg.appendChild(el('line', {
          x1: padLeft, y1: y.toFixed(2), x2: W - padRight, y2: y.toFixed(2),
          stroke: tickVal === 0 ? '#333333' : '#E5E5E5',
          'stroke-width': tickVal === 0 ? '1.5' : '1'
        }));
        const lbl = el('text', {
          x: padLeft - 8, y: y.toFixed(2),
          'text-anchor': 'end', 'dominant-baseline': 'central',
          'font-size': '13', 'font-weight': '400', fill: '#4A4A4A'
        });
        lbl.textContent = String(tickVal);
        svg.appendChild(lbl);
      });

      const yCy = padTop + plotH / 2;
      const yLbl = el('text', {
        x: 12, y: yCy.toFixed(2),
        'text-anchor': 'middle', 'dominant-baseline': 'central',
        transform: 'rotate(-90 12 ' + yCy.toFixed(2) + ')',
        'font-size': '13', 'font-weight': '400', fill: '#4A4A4A'
      });
      yLbl.textContent = '%';
      svg.appendChild(yLbl);

      const n = parties.length;
      const slotW = plotW / n;
      const barGap = 2.5;
      const barW = 19.2;
      const clusterW = barW * 3 + barGap * 2;

      for (let t = 0; t <= n; t++) {
        const tx = padLeft + t * slotW;
        svg.appendChild(el('line', {
          x1: tx.toFixed(2), y1: baseY, x2: tx.toFixed(2), y2: baseY + 6,
          stroke: '#555555', 'stroke-width': '1'
        }));
      }

      parties.forEach(function (p, i) {
        const clusterStartX = padLeft + i * slotW + (slotW - clusterW) / 2;
        months.forEach(function (m, j) {
          const val = p.values[j];
          const barH = (val / maxY) * plotH;
          const barX = clusterStartX + j * (barW + barGap);
          const barY = baseY - barH;
          const barCx = barX + barW / 2;

          const rect = el('rect', {
            x: barX.toFixed(2), y: barY.toFixed(2),
            width: barW.toFixed(2), height: barH.toFixed(2),
            fill: m.color, class: 'c1-bar-rect'
          });
          const tip = p.tooltipName + ' (' + m.label + '): ' + val + '%';
          rect.addEventListener('mouseenter', function (e) { showTip(tip, e.clientX, e.clientY); });
          rect.addEventListener('mousemove', function (e) { showTip(tip, e.clientX, e.clientY); });
          rect.addEventListener('mouseleave', hideTip);
          rect.addEventListener('click', function (e) { e.stopPropagation(); showTip(tip, e.clientX, e.clientY); });
          svg.appendChild(rect);

          const isSmall = val <= 3;
          const labelY = isSmall ? (barY - 5) : (baseY - 6);
          const valText = el('text', {
            x: barCx.toFixed(2), y: labelY.toFixed(2),
            'text-anchor': 'start', 'dominant-baseline': 'central',
            transform: 'rotate(-90 ' + barCx.toFixed(2) + ' ' + labelY.toFixed(2) + ')',
            'font-size': '12.5', 'font-weight': '400',
            fill: isSmall ? '#111111' : m.textColor,
            'pointer-events': 'none'
          });
          valText.textContent = val + '%';
          svg.appendChild(valText);
        });

        const lx = padLeft + (i + 0.5) * slotW;
        const ly = baseY + 12;
        const pLbl = el('text', {
          x: lx.toFixed(2), y: ly.toFixed(2),
          'text-anchor': 'end',
          transform: 'rotate(-42 ' + lx.toFixed(2) + ' ' + ly.toFixed(2) + ')',
          'font-size': '13.5', 'font-weight': '400', fill: '#333333'
        });
        pLbl.textContent = p.name;
        svg.appendChild(pLbl);
      });

      document.addEventListener('click', hideTip);
      window.addEventListener('scroll', hideTip, { passive: true });
    })();
  </script>
</body>
</html>
