<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATH ja ärevushäire ravikulud (2020–2026)</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-weight: 400;
    }

    body {
      background: transparent;
      font-family: 'Fira Sans Condensed', sans-serif;
      color: #181c20;
      -webkit-font-smoothing: antialiased;
    }

    .err-card {
      width: 100%;
      max-width: 670px;
      background: #ffffff;
      border: 1px solid #dfe4e8;
      padding: 14px 16px 12px 16px;
      position: relative;
      overflow: hidden;
    }

    .err-header {
      margin-bottom: 8px;
    }

    .err-title {
      font-size: 15pt;
      line-height: 1.22;
      color: #181c20;
      margin-bottom: 3px;
    }

    .err-subtitle {
      font-size: 12.5pt;
      line-height: 1.25;
      color: #4a525a;
    }

    .err-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 8px;
      font-size: 10.5pt;
      color: #2f363d;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .panels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: end;
    }

    .panel {
      width: 100%;
    }

    .panel-title {
      font-size: 11.5pt;
      color: #181c20;
      margin-bottom: 4px;
      padding-left: 34px;
    }

    svg.chart-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }
