<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reitingud koos "ei oska öelda" vastajatega perioodil 9.-18.11.2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fira Sans Condensed', sans-serif; font-weight: 400 !important; }
    html, body { width: 100%; background: #FFFFFF; color: #333333; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    .c2-container { width: 100%; max-width: 820px; margin: 0 auto; padding: 18px 20px 14px 20px; background: #FFFFFF; }
    .c2-title { font-size: clamp(20px, 2.8vw, 24px); line-height: 1.25; color: #4A4A4A; margin-bottom: 24px; }
    .c2-plot-area { position: relative; height: 255px; width: 100%; border-bottom: 1px solid #dedede; display: flex; align-items: flex-end; justify-content: space-around; padding: 0 10px; }
    .c2-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 0 8px; }
    .c2-bar-wrap { position: relative; width: 100%; max-width: 58px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .c2-val-top { font-size: 15px; color: #111111; margin-bottom: 6px; line-height: 1; white-space: nowrap; }
    .c2-bar { width: 100%; border-radius: 3px 3px 0 0; cursor: pointer; transition: filter 0.15s ease; }
    .c2-bar:hover { filter: brightness(0.92); }
    .c2-x-labels { display: flex; justify-content: space-around; padding: 0 10px; height: 106px; }
    .c2-x-cell { flex: 1; position: relative; }
    .c2-x-text { position: absolute; top: 10px; right: 45%; transform: rotate(-45deg); transform-origin: top right; font-size: 15px; color: #333333; white-space: nowrap; }
    .tooltip { position: fixed; top: 0; left: 0; background: #FFFFFF; color: #222222; border: 1px solid #CCCCCC; border-radius: 4px; padding: 5px 10px; font-size: 14px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); pointer-events: none; opacity: 0; transition: opacity 0.1s ease; z-index: 100; }
    @media (max-width: 520px) { .c2-col { padding: 0 3px; } .c2-x-text { font-size: 13px; } }
  </style>
</head>
<body>
  <main class="c2-container">
    <h1 class="c2-title">Reitingud koos "ei oska öelda" vastajatega perioodil 9.-18.11.2026</h1>
    <div class="c2-plot-area" id="plot-area"></div>
    <div class="c2-x-labels" id="x-labels"></div>
  </main>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <script>
    (function () {
      const items = [{"name":"Keskerakond","tooltipName":"Keskerakond","value":18,"color":"#027D2B"},{"name":"SDE","tooltipName":"SDE","value":14,"color":"#CE1126"},{"name":"Isamaa","tooltipName":"Isamaa","value":13,"color":"#009DE0"},{"name":"EKRE","tooltipName":"EKRE","value":10,"color":"#2139B5"},{"name":"Reform","tooltipName":"Reform","value":8,"color":"#FFDC00"},{"name":"Parempoolsed","tooltipName":"Parempoolsed","value":4,"color":"#ff6100"},{"name":"Eesti 200","tooltipName":"Eesti 200","value":1,"color":"#5fb7e5"},{"name":"Ei oska öelda","tooltipName":"Ei oska öelda","value":30,"color":"#141312"}];
      const plotArea = document.getElementById('plot-area');
      const xLabels = document.getElementById('x-labels');
      const tooltip = document.getElementById('tooltip');
      const maxVal = Math.max.apply(null, items.map(function (d) { return d.value; })) * 1.18;

      function showTip(txt, x, y) {
        tooltip.textContent = txt;
        tooltip.style.opacity = '1';
        const r = tooltip.getBoundingClientRect();
        let l = x + 12, t = y - r.height - 8;
        if (l + r.width > window.innerWidth - 8) l = x - r.width - 12;
        if (l < 8) l = 8;
        if (t < 8) t = y + 12;
        tooltip.style.left = l + 'px';
        tooltip.style.top = t + 'px';
      }

      function hideTip() { tooltip.style.opacity = '0'; }

      items.forEach(function (item) {
        const col = document.createElement('div');
        col.className = 'c2-col';
        const wrap = document.createElement('div');
        wrap.className = 'c2-bar-wrap';
        const top = document.createElement('div');
        top.className = 'c2-val-top';
        top.textContent = item.value + '%';
        const bar = document.createElement('div');
        bar.className = 'c2-bar';
        bar.style.height = ((item.value / maxVal) * 100) + '%';
        bar.style.backgroundColor = item.color;
        const label = item.tooltipName + ': ' + item.value + '%';
        bar.addEventListener('mouseenter', function (e) { showTip(label, e.clientX, e.clientY); });
        bar.addEventListener('mousemove', function (e) { showTip(label, e.clientX, e.clientY); });
        bar.addEventListener('mouseleave', hideTip);
        wrap.appendChild(top);
        wrap.appendChild(bar);
        col.appendChild(wrap);
        plotArea.appendChild(col);

        const xc = document.createElement('div');
        xc.className = 'c2-x-cell';
        const xt = document.createElement('span');
        xt.className = 'c2-x-text';
        xt.textContent = item.name;
        xc.appendChild(xt);
        xLabels.appendChild(xc);
      });

      window.addEventListener('scroll', hideTip, { passive: true });
    })();
  </script>
</body>
</html>
