    "vastused": {
      "tutvustus": "Riina Aav arendab keemilisi meetodeid ja ringmajanduslikke tehnoloogiaid, keskendudes supramolekulaarsele keemiale ja molekulide iseorganiseerumisele. Tema teadustöö edendab mehhanokeemilisi sünteesimeetodeid ning ressursisäästlikkust keemiatööstuses rakendatavates protsessides.\n\nViimastel aastatel juhib ta riiklikku ringmajanduse tippkeskust SOURCES ning edendab haruldaste muldmetallide väärindamist Ida-Virumaal koostöös kohaliku ettevõtlusega. Aav osaleb Euroopa Komisjoni projektides, kus tema uurimisrühm loob saasteaineid tuvastavaid sensormaterjale ja arendab mehhanokeemilisi protsesse roheliste ravimite tootmiseks. Samuti on ta kahe patentse leiutise autor ja juhendab Eesti Teadusagentuuri uurimisgrante.\n\nAav on Tallinna Tehnikaülikooli keemia tenuuri täisprofessor, kes valiti 2024. aastal ülikooli aasta teadlaseks ja 2023. aastal aasta õppejõuks. Teda tunnustati 2024. aastal Valgetähe IV klassi teenetemärgiga ning ta panustab aktiivselt Euroopa Keemiaseltsi mehhanokeemia erialavõrgustikus.",
      "k1": "Elu tipphetked on midagi, kus emotsionaalne laeng on väga kõrge, on eneseuhkus ja tunne, et peale seda hetke algab elus uus ja põnev etapp. Üks esimestest oli kindlasti doktorandina Genfi ülikooli A. Alexakise teaduslaborisse minek 2000. aastal: tohutu hüpe teadustöö keskkonnas ja samas tunne, et Eestist kaasa saadud oskuste rakendamine on erakordselt lihtne. Mäletan, peale mu kokkuvõtvat seminari kõrvalgrupi professori kommentaari: \"... ja Sa tegid seda vaid nelja kuuga?\" Reaktsioonide sõelumine, kiraalse katalüsaatori kristallstruktuurini jõudmine, ringdikroismi spektrite abil planaarse kiraalsusega ühendite konformatsioonide lahustispetsiifilisuse leid –  kõik see oli väga põnev.\n\nJärgmine elu tipphetk oli perega seotud: mu esimene laps sündis mõned aastad peale Genfi reisi, teine varsti peale doktorikaitsmist ja kolmas peale järeldoktorantuuri. Peale suuremaid teadustöö pingutusi, milleks muidugi välisülikoolides viibimine ja doktorikraadi kaitsmiseks vajaliku materjali kokku kirjutamine ju olid, olen võtnud aja töölt eemal olemiseks ja oma koduse keskkonna loomiseks, iga järgneva lapse sünd lisas keerukust elukorraldusse, aga õnneks on mul suurepärane abikaasa kõrval.\n\nDoktorikraadi kaitsmine 2005. aastal Margus Lopi ja Tõnis Kangeri juhendamisel oli mulle äärmiselt oluline, ja 9,11-sekosterooli totaalsünteesist jäi puudu vaid viimase süsinik-süsinik sideme moodustamine. Järgmine tipphetk on seotud iseseisva uurimissuuna otsinguga, järeldoktorantuur UC Illinoisi ülikoolis Fulbright teadlasvahetuse grandiga 2008. aastal. See sai teoks küllaltki suunatud tegevuse tagajärjel, mille võimalikkusesse ma ei uskunud kuni USA lennukile suundumiseni. \n\nJäreldoktorantuur oli kindlasti mu edasist teadlastööd defineeriv ja uut kvaliteeditasandit võimaldav hüpe. Teaduse eesliinile jõudmiseks ei piisa uudishimust, on vaja ka väga süstemaatilist ja ambitsioonikat tööd teha ning seda ei saa teha üksi, keemiateaduses peab selleks olema efektiivne teadusrühm. Ääremärkusena, mu järeldoktorantuuri juhendaja S.E. Denmark panustas 2026. aasta Nobeli keemiapreemia saanud Kagan ja Soai avastatud mittelineaarse kiraalse autokatalüüsi mehhanismi mõtestamisse, olen jätkuvalt rõõmus ka oma kolleegide teadussaavutuste üle\n\nTeaduselu tippsündmusteks pean ka oma 2013. aasta hemikukurbituriilide sünteesi artikli ilmumist ning kutsutud ettekandjana 2023. aastal väga pika ajalooga supramolekulaarse keemia konverentsil esinemist. Ligi kolmveerandtuhandelise kuulajaskonnaga saalis sain jagada meie viimaseid teadustulemusi hemikukurbituriilide mehhanokeemilisest sünteesist ja iseorganiseerumisest, see oli uhke tunne.\n\nÜks viimasemaid tipphetki on olnud muidugi Eesti presidendilt auraha saamine – see tunnustus ju ei kuulu ainult mulle, vaid kannan seda tänu suurepärastele kolleegidele Tehnikaülikoolist.\n\nMulle tundub, et mu elus on rohkelt tipphetki, mu akadeemilist ja isiklikku elu määravad sündmused on olnud orgaaniliselt vahelduvad ja usun, et eredaid hetki tuleb veel.",
      "k2": "Looksin eksperimentaalse keemia laborvõrgustiku, mis kataks teadustöö ja ka tööstusprotsesside eelpiloteerimise vajadusi ehk looks laborite võrgustiku, kus saaks teaduslaboriskaalast (milligramm kogused) sujuvalt keemilisi protsesse viia tootmisse ülekantavasse skaalasse.\n\nMeie ühiskonna õpimotivatsioon on väga kõrge, teadmishimu on olemas nii noortel kui ka vanematel. Samas vajame innovaatilisemat tööstust. See ei saa sündida olemasolevaid tootmisprotsesse optimeerides, selleks on vaja katsetada täiesti uusi reaktsioone ja protsesse ja seda ei saa teha põlveotsas, see vajab hästi varustatud laboreid. Miks räägin laborivõrgustikust? Osa laboreid on ülikoolides juba olemas, aga ülikoolist välja uued tehnoloogiad hästi ei jõua.\n\nMaailmas räägitakse palju ressursi taaskasutusest ja jätkusuutlikumatest tehnoloogiatest, aga sageli jäädakse protsessi monitoorimise, olemasolevate tootjate jälgimise või jäljendamise ja praeguste tehnoloogiate jalajälje hindamise etappi kinni. Realistlikku ettekujutust uutest keemilistest tehnoloogiatest ei teki ilma katset püsti panemata, see vajab füüsilist keskkonda. Sellises eelpiloteerimise laboris sündivad ebaõnnestumised ja ma väga loodan, et ka õnnestumised, vajavad päevavalgust ja loomulikult julgeid investeeringuid ja inimesi. Euroopa ja ka Eesti keemiatööstusega toimuvad praegu märgilised muutused tööstus- ja geopoliitiliste arengute tõttu ning minu arvates on Eestis võimalik selles vallas oma panus anda.\n\nPraegu räägitakse väga palju tehisarust ja sellest tingitud hariduse ja tootmise muutumisest. Tehisaru mudelid vajavad samas reaalsusega kooskõlas olevat andmestikku, uute ressursisäästlike tehnoloogiate arengu jaoks katseandmestiku loomiseks on vaja eel-piloteerimise laboreid, sellest minu meelest piisavalt ei räägita.",
      "k3": "Mul tekkis seda olukorda lugedes kaks küsimust:\n    1. kuidas ma saan olla kindel, et viga artiklis on teadlikult varjatud?\n    2. miks peaks parema teadmise ilmnemisel valdkonna vastu avalikkuse usaldus langema?\n\nOlen nõus, et teadlaste tegutsemise jätkusuutlikkus sõltub nende mainest ja avalikuks tulnud ja teadlikult valeandmeid esitanud teadlased ei saavuta konkurentsipõhises teadustöö keskkonnas edu ja nii-öelda surevad teadusmaailmast välja. Olen eelretsenseerimisel küll avastanud manipuleeritud jooniseid ja tulemustes kahtlust äratanud seosetuid väljendeid ja saanud nii tahtlikult esitatud valeandmete ilmumist teaduskirjanduses vältida, sellest ise toimetajale teada andes.\n\nSellist olukorda, kus töö oleks juba ilmunud, tsiteeritud ning on tekkinud kahtlus, et tulemused on valed ja sellel alal tegutsevad teadlased sooviks seda tahtlikult varjata, ma hästi ette ei kujuta, sest teadusmaailm on globaalne ja kui mitte esimene märkaja, siis teine ikka veast avalikkusele märku annab.\n\nSamas seda juhtub ikka, et juba avaldatud töö sisaldab vigu ning need vead on tekkinud kas tähelepanematusest või teadmatusest, tavaliselt avaldatakse sellise artikli vastusena uue tõestusmaterjaliga teadustöö, mis eelneva vea parandab, või avaldavad autorid ise oma tulemustele paranduse. Vigu parandavad artiklites isegi Nobeli preemia laureaadid ja minu meelest ei juhtu nende mainega pikemas perspektiivis midagi, aga muidugi satuvad nad selles olukorras olles rambivalgusesse ja mõnigi kord peavad kolleegidele olukorda põhjendama.\n\nHüpoteetilises olukorras ja hea kolleegina võin sellise paranduse ilmumisele ka ise kaasa aidata. Keemiateaduses on muide katsete mittekorratavus väga asjakohane probleem ja tihti just mitte autorite pahatahtlikkuse, vaid protseduuride ebapiisava kirjelduse ning lähteühendite puhtuse kõikumise tõttu. Seetõttu jälgin ma oma laboris, et võtmereaktsioone teostaks mitu erinevat inimest, nii tulevad ebakõlad juba enne avaldamist ilmsiks. Mõiste “teaduslik vale” on mulle arusaamatu, sest kui uus teadmine on saadud, siis see tuleb varem või hiljem avalikuks.",
      "k4": "Akadeemikud on Eestis teiste akadeemikute poolt välja valitud teadlased ehk Eesti Teaduste Akadeemia ise kujundab oma kogukonna mainet uute liikmete valimisega. Tegevteadlased peavad kindlasti osa oma tööst suunama oma kolleegidele, et toetada intellektuaalset väljakutset pakkuvat töökeskkonda, kasvatada teadlasjärelkasvu ning aidata kaasa teadmiste siirdele ka väljapoole uurimisasutuse seinu.\n\nEnamus Eestis töötavatest teadlastest on meie ühiskonna ülalpidamisel, väga väike osa teadus-arendustöödest –  ma ei oska isegi öelda kui väike – tehakse täiesti sõltumatult ülikoolidest ja riigi toel tegutsevatest teadusasutustest. See on olnud meie ühiskonna sisene kokkulepe, et haridus on meie riigis ühiskondlik hüve ja hea juurdepääsetavusega ja teadlased on need, kes hariduse kvaliteedi tagavad ja seetõttu ühiskonna järeltulevasse põlve panustavad. Lisaks muidugi saavad teadlased erialaekspertidena nõustada ka avalikku ja erasektorit. Meie ühiskonna konkurentsivõime ja edukus toetub riigi poolt rahastatud teadlaste panusele.\n\nAkadeemikud on üks osa teadlastest, kellest osa on tegevteadlased, osa emeriteerunud, igal juhul omavad nad suuremat elukogemust ja teadmisi kui keskmine Eesti elanik, see akadeemikute kompetentsi klaster on minu meelest vajalik, et kriitiliselt hinnata meie ühiskonnas ja teadusmaailmas toimuvaid protsesse.\n\nTeadlasest saab arvamusliider kui ta avalikult sõna võtma hakkab ja tema arvamus ka teistele korda läheb. Kuna teadlased on treenitud kriitiliselt mõtlema, siis võiks eeldada, et nende arvamus on suurema mõjuga ja väärt tähele panemist, seeläbi võiks akadeemikutest arvamusliidrite nõu ka ühiskonnale kasulik olla.",
      "k5": "Eesti akadeemiku tiitel on tunnustus Eesti Teaduste Akadeemia liikmete poolt ja kutse kuuluda akadeemikute kogukonda. Arvan, et meie akadeemikutel on kohustusi nii üksteise ees kui ka riigi teiste asutuste ees ja neid kohustusi täidetakse individuaalselt ja vastavalt oma kompetentsile ja võimekusele. Arvan, et sooviksin olla aktiivne akadeemia liige. Seega ilmselgelt kaasneks sellega mulle lisakohustusi, milliseid täpselt, selle üle on hetkel ennatlik arutada."
    }

  {
    "id": 11,
    "nimi": "Ivo Leito",
    "amet": "analüütilise keemia professor",
    "valdkond": "Keemia",

    "asutus": "Tartu Ülikool",
    "asutuseToon": "#2E66A4",
    "pilt": "https://s.err.ee/photo/orig/2026/11/02/3869008h72f8.png",
    "autor": "Maarja Liiv",
    "vastused": {
      "tutvustus": "Ivo Leito uurib analüütilist keemiat, keskendudes happe-aluse tasakaaludele, keemilisele metroloogiale, kromatograafiale ja massispektromeetriale. Tema teadustöö kirjeldab täpselt kvantitatiivselt raskesti mõõdetavaid keemilisi nähtusi ja loob ulatuslikke happelisuse ning aluselisuse skaalasid mittevesikeskkondades.\n\nViimastel aastatel juhib ta Analüütilise keemia kvaliteedi infrastruktuuri (AKKI), mis pakub laboritele meetodiarendust ja analüüse, sidudes teaduse otseselt ravimi-, biotehnoloogia- ja toiduainetööstusega. Leito juhitud töörühm osales 2025. aastal avaldatud Rahvusvahelise Puhta ja Rakenduskeemia Liidu (IUPAC) tehnilise raporti koostamisel, mis süstematiseerib mittevesikeskkondades mõõdetud happelisuse andmeid, ja ta korraldas ka Eesti liitumist selle organisatsiooniga. Lisaks arendas ta rahvusvahelised veebikursused, mille on edukalt lõpetanud tuhanded õppijad ligi 150 riigist.\n\nLeito on Tartu Ülikooli analüütilise keemia professor ja õppetooli juhataja. Ta pälvis 2025. aastal Tartu Ülikooli suure medali ja Haridus- ja Teadusministeerium valis ta 2015. aastal aasta õppejõuks.",
      "k1": "Tööalased tipphetked on suures osas kahte liiki. Ühed on seotud sellega, kui teised teadlased kasutavad meie tulemusi oma valdkondades oluliste edasiminekute saavutamiseks. Teised on seotud juhendatavate kraadiõppurite kraaditööde kaitsmistega. Eraelulised tipphetked on laste sünnid ning seejärel tipphetked laste elus.",
      "k2": "Ma ei usu, et ma suudan tuua välja olulise probleemi, millest räägitakse liiga vähe. Pigem räägitakse enamikust probleemidest täiesti piisavalt, mõnikord ehk ka liiga palju. Pudelikaelaks pole mitte ebapiisav rääkimine, vaid ikka see, et rääkimisega ei kaasne otsused ja teod.\n\nKui unistada laiemalt, siis asi, mille ma ära lahendaksin, puudutab mitte minu teadusvaldkonda, vaid kogu ühiskonda ja on kokku võetav USA 33. presidendi Harry S. Truman’i öeldud lausega „It is amazing what you can accomplish if you do not care who gets the credit“, mis vabas tõlkes kõlab „On imeline, kui palju on võimalik saavutada, kui mitte hoolida sellest, kellele langeb tunnustus nende saavutuste eest“. Sellisest suhtumisest on meie (ja muidugi mitte ainult meie) ühiskonnas kindlasti puudus.",
      "k3": "Teaduslikud vead teadusartiklites ja nende parandamine – kas siis samade autorite poolt või teiste poolt – on teaduse loomulik osa ja neid vigu parandades liigub teadus edasi.\n\nToon näite. Üks meie valdkonnas oluline tugiväärtus (2,4,6-trinitrofenooli happelisus atsetonitriilis) mõõdeti esmakordselt ühe analüütilise keemia alusepanija I. M. Kolthoffi grupi poolt. Mõne aja pärast nad avastasid, et olid oluliselt alahinnangud veesisalduse mõju lahustis ja seetõttu oli tõenäoline, et nende määratud väärtus on vale.\n\nTollal oli kogu see valdkond alles arengu alguses ja veesisalduse mõjud olid vähe uuritud. Nad viisid paremini kontrollitud tingimustes (ja erinevaid sõltumatuid eksperimendimeetodeid kasutades) läbi uue põhjaliku  uuringu, milles leidsid, et algselt määratud väärtus oli üle 2 logaritmilise ühiku (ehk üle 100 korra) nihkes. Nad avaldasid selle uuringu ja see ülihoolikalt määratud happelisuse väärtus on siiamaani kasutuses olulise tugiväärtusena hapete tugevuste mõõtmisel. Kolthoffi teaduslikku autoriteeti või karjääri see juhtum ei kahjustanud mitte kuidagi, pigem isegi vastupidi.\n\nSeega, ma ei usu, et vea parandamine oluliselt kahjustaks kolleegi karjääri, ja kui selline olukord tekib, siis annan kolleegile teada, et ma selle kriitilise vea leidsin ja lasen tal endal kavandada järgmised sammud.",
      "k4": "Teadlane töötab lõppkokkuvõttes ikka ühiskonnale. See on nii, olenemata, kas töö toimub koostöös kolleegidega baasteaduste sfääris või on tegemist rakendusteadusega koostöös mõne ettevõttega. Teadustulemused baasteaduses võivad näiteks panustada suurte väljakutsete – kliima, elurikkus, efektiivne ressursside kasutus jne – alal. Innovatiivsed arendused ettevõtetes loovad töökohti, kasvatavad majanduse konkurentsivõimet ja lõppkokkuvõttes suurendavad ühiskonna rikkust. Ja iseenesest mõistetavalt, kui teadlane teeb õppetööd ning koolitab noori spetsialiste, ka siis on suund ühiskonnale väga selge.\n\nKui teadlane on oma erialal pädev, siis on tal head võimalused tõusta arvamusliidriks. Ja see on igati põhjendatud staatus sel juhul. „Lihtsalt arvamusliider“ või pigem isegi „lihtsalt arvaja“ võiks teadlasest saada ehk siis, kui ta esitaks seisukohti, mis on teadus- ja faktipõhise lähenemisega vastuolus. Aga selline asi on teadlaste puhul haruldane.",
      "k5": "Akadeemiku tiitel oleks nii tunnustus kui ka vastutus ja aitaks kindlasti kaasa pühendunud tegutsemisele. Usun, et oluline ja igati õigustatud ootus akadeemikule on see, et ta panustaks riigi ja ühiskonna ees seisvate probleemide teaduspõhisesse lahendamisse."
    }

  {
    "id": 12,
    "nimi": "Monika Mortimer",
    "amet": "vanemteadur",
    "valdkond": "Keemia",
    "valdkonnaToon": "#ff5050",
    "asutus": "KBFI",
    "asutuseToon": "#CD5C6E",
    "pilt": "https://s.err.ee/photo/orig/2026/11/02/3869011h3083.png",
    "autor": "Diana Unt",
    "vastused": {
      "tutvustus": "Monika Mortimer uurib keskkonnakeemiat, keskendudes uudsete saasteainete, sealhulgas nanokomposiitide ja PFAS-ühendite riskihindamisele ning bio-nano vastastikmõjudele. Ta ühendab materjaliteaduse, analüütilise keemia ja molekulaarse toksikoloogia, et arendada ennetavaid metodoloogiaid, millega hinnata saasteainete ohutust.\n\nViimastel aastatel juhib ta Keemilise ja Bioloogilise Füüsika Instituudis uut rahvusvahelist uurimisrühma ning rakendab materjalide loomisel ohutu ja kestliku disaini kontseptsiooni. Pärast pikaajalist teadustööd Šveitsi, USA ja Hiina ülikoolides naasis ta Eestisse, et töötada välja uusi meetodeid, millega kaasajastada kemikaaliohutuse standardeid.\n\nMortimer pälvis 2025. aastal Eesti Rahvuskultuuri Fondi Teaduste Akadeemia allfondi stipendiumi. Samuti nõustab ja hindab ta eksperdina Euroopa Komisjoni Marie Skłodowska-Curie doktorantide ning REACH-UPPA programmide teadusprojekte.",
      "k1": "Kui vastata küsimusele, millised tipphetked on seotud minu tööga ja millised juhtunud sellele vaatamata, siis pean tõdema, et minu elus on need kaks poolt olnud teineteise võimendajaks. Minu isikliku elu vaieldamatuks tipphetkeks on kahe tütre sirgumine ja nende iseseisva tee leidmine – ühe edukas karjäär küberjulgeoleku eksperdina Microsoftis ja teise pühendumine meditsiiniõpingutele Californias. Nende õpingutes ja karjääris USAs mängis olulist rolli minu otsus siirduda järeldoktorantuuri California ülikooli Santa Barbaras, mis võimaldas neil saada haridus USA-s. Seega on minu rahvusvaheline teaduskarjäär seotud ka isiklikult oluliste hetkedega.\n\nTööalastest tipphetkedest rääkides on oluline olnud teadustöö jõudmine faasi, kus saan oma ideid ellu viia kodumaal. Eestisse naasmise järel pean viimase aja suurimaks kordaminekuks mahukate grantide pälvimist – olgu selleks ohutute ja keskkonnasõbralike nanomaterjalide disaini alane PRG-projekt või Eesti turba bioaktiivsusele keskenduv TEM-TA projekt. Need on andnud võimaluse luua Keemilise ja Bioloogilise Füüsika Instituudis (KBFI) oma uurimissuund ja töötada juhtivteadurina.\n\n2025. aastal oli suur au vastu võtta Eesti rahvuskultuuri fondi Eesti teaduste akadeemia allfondi stipendium, mis tunnustas rahvusvahelist teadlaskarjääri ja Eestis tehtud uurimistööd. Kõrghetkedeks on alati ka oma juhendatavate edu – näiteks kui minu doktorandi Katre Jugansoni doktoritöö pälvis riikliku peapreemia. Loomulikult on ka praegune akadeemikukandidaadiks esitamine üks mu senise karjääri vaieldamatuid tipphetki. See on kinnitus, et pikaajaline töö keskkonnakeemia, materjaliteaduse ja bioloogia valdkondade integreerimisel on läinud korda.",
      "k2": "Kui raha ja bürokraatia poleks takistuseks, asutaksin Eestisse tipptasemel kestliku materjalitehnoloogia keskuse. Praegu näeme sageli, et teadlased loovad küll uusi materjale, kuid nende ohutusele ja kogu eluringile mõeldakse alles tootearenduse lõpus. Eesti võiks aga olla teerajaja uutmoodi keemias, kus juba uue molekuli või aine disainimisel võetakse arvesse selle ohutust, keskkonnasõbralikkust ja hilisemat taaskasutatavust.\n\nKBFI on siin oma paindlikkusega suurepärane eeskuju – see on unikaalne keskkond, kus füüsikud, keemikud ja bioloogid saavad interdistsiplinaarsete uuringutega hinnata materjalide ohutust juba disaini varases faasis. Just seda põhimõtet rakendame ka minu juhitavas PRG-projektis, kus arendame uudseid metall-fenoolseid võrgustikke spetsiaalselt selleks, et metalle keskkonnast jätkusuutlikult eraldada ja uuesti ringlusse võtta.\n\nMaailmas laiemalt räägitakse minu hinnangul liiga palju üha uute nanomaterjalide sünteesist, keskendudes eeskätt nende lühiajalisele tehnilisele tõhususele. Liiga vähe pööratakse aga tähelepanu materjalide saatusele reaalsetes tingimustes. Mis toimub tootega kogu selle kasutusaja jooksul ja eluea lõpus? Kas näiteks niiskuse või päikesekiirguse toimel võib sellest eralduda mürgiseid komponente? Me ei tohi luua uusi materjale, mis muutuvad looduses aja möödudes lihtsalt uuteks probleemseteks saasteaineteks. Peame juba eos, molekulaarsel tasandil mõistma, kuidas materjale ohutult algosadeks lagundada ja väärtusliku ressursina uuesti ringlusse suunata.",

let activeQuestionIndex = 0;
let activeCandidateId = null;
let activeFieldFilter = "all";
let activeInstFilter = "all";
let isAnimatingFilter = false;

const editorialTabsEl = document.getElementById("editorialTabs");
const editorialQuoteTextEl = document.getElementById("editorialQuoteText");
const photoGridEl = document.getElementById("photoGrid");
const filterActionsEl = document.getElementById("filterActions");
const resetFiltersBtn = document.getElementById("resetFiltersBtn");

const drawerOverlayEl = document.getElementById("drawerOverlay");
const slideDrawerEl = document.getElementById("slideDrawer");
const drawerCloseBtn = document.getElementById("drawerCloseBtn");
const drawerNameEl = document.getElementById("drawerName");
const drawerRoleEl = document.getElementById("drawerRole");
const drawerInstBadgeEl = document.getElementById("drawerInstBadge");
const drawerFieldBadgeEl = document.getElementById("drawerFieldBadge");
const drawerNavPillsEl = document.getElementById("drawerNavPills");
const drawerTopicLabelEl = document.getElementById("drawerTopicLabel");
const drawerQuestionQuoteEl = document.getElementById("drawerQuestionQuote");
const drawerBodyEl = document.getElementById("drawerBody");
const drawerPhotoCreditEl = document.getElementById("drawerPhotoCredit");
const drawerPrevBtn = document.getElementById("drawerPrevBtn");
const drawerNextBtn = document.getElementById("drawerNextBtn");
const drawerStepIndicatorEl = document.getElementById("drawerStepIndicator");

function createFallbackSvg(name, color) {
  const initials = name
    .split(" ")
    .map(p => p[0])
    .join("")
    .slice(0, 2)
    .toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="330" viewBox="0 0 300 330">
    <rect width="300" height="330" fill="#f0f5f1"/>
    <circle cx="150" cy="145" r="56" fill="${color}" opacity="0.16"/>
    <text x="150" y="160" text-anchor="middle" fill="${color}" font-family="Fira Sans, sans-serif" font-size="38" font-weight="400">${initials}</text>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

// Horisontaalsed vahelehed põhilehel
function renderTabs() {
  editorialTabsEl.innerHTML = "";
  QUESTIONS.forEach((q, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tab-btn" + (idx === activeQuestionIndex ? " active" : "");
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", idx === activeQuestionIndex ? "true" : "false");
    btn.textContent = q.label;

    btn.addEventListener("click", () => {
      switchQuestion(idx);
    });

    editorialTabsEl.appendChild(btn);
  });
}

function renderQuote() {
  const q = QUESTIONS[activeQuestionIndex];
  editorialQuoteTextEl.classList.add("fading");
  setTimeout(() => {
    editorialQuoteTextEl.textContent = `„${q.fullText}“`;
    editorialQuoteTextEl.classList.remove("fading");
  }, 120);
}

function isCandidateVisible(cand) {
  const fieldMatches = (activeFieldFilter === "all" || cand.valdkond === activeFieldFilter);
  const instMatches = (activeInstFilter === "all" || cand.asutus === activeInstFilter);
  return fieldMatches && instMatches;
}

function hasAnswer(cand, qId) {
  const ans = cand.vastused[qId] || "";
  return !ans.includes("ei esitanud sellele ankeediküsimusele vastust");
}

// Kaartide renderdamine
function renderGrid() {
  photoGridEl.innerHTML = "";
  const curQ = QUESTIONS[activeQuestionIndex];

  CANDIDATES.forEach(cand => {
    const card = document.createElement("div");
    card.className = "candidate-card";
    card.dataset.id = cand.id;
    card.tabIndex = 0;
    card.style.setProperty("--inst-color", cand.asutuseToon);

    if (activeCandidateId === cand.id) {
      card.classList.add("selected");
    }

    if (!isCandidateVisible(cand)) {
      card.classList.add("is-hidden");
    }

    // Märge, kui kandidaadil puudub sellele küsimusele vastus
    if (curQ.id !== "tutvustus" && !hasAnswer(cand, curQ.id)) {
      card.classList.add("no-answer");
    }

    // Fotoraam
    const frame = document.createElement("div");
    frame.className = "photo-frame";

    const imgWrap = document.createElement("div");
    imgWrap.className = "photo-img-wrap";

    const img = document.createElement("img");
    img.src = cand.pilt;
    img.alt = cand.nimi;
    img.setAttribute("referrerpolicy", "no-referrer");
    img.onerror = function () {
      this.onerror = null;
      this.src = createFallbackSvg(cand.nimi, cand.asutuseToon);
    };
    imgWrap.appendChild(img);

    const tag = document.createElement("span");
    tag.className = "unanswered-tag";
    tag.textContent = "Vastuseta";
    imgWrap.appendChild(tag);

    // Paks alaosa asutuse tunnusvärvis koos teadlase nimega (lingivalmidusega)
    const nameBar = document.createElement("div");
    nameBar.className = "frame-name-bar";

    const nameLink = document.createElement("a");
    nameLink.href = "#";
    nameLink.className = "candidate-name-link";
    nameLink.textContent = cand.nimi;
    nameLink.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      openDrawer(cand);
    });

    nameBar.appendChild(nameLink);
    frame.appendChild(imgWrap);
    frame.appendChild(nameBar);

    // Metaandmed foto all
    const meta = document.createElement("div");
    meta.className = "card-meta";
    meta.textContent = `${cand.asutus} · ${cand.valdkond}`;

    card.appendChild(frame);
    card.appendChild(meta);

    // Klõpsates avaneb slide-over
    card.addEventListener("click", (e) => {
      e.stopPropagation();
      openDrawer(cand);
    });

    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openDrawer(cand);
      }
    });

    photoGridEl.appendChild(card);
  });
}

// Märgatav laine-animatsioon fotovõrgustikul küsimuse vahetamisel
function triggerGridQuestionAnimation() {
  const curQ = QUESTIONS[activeQuestionIndex];
  const visibleCards = Array.from(photoGridEl.querySelectorAll(".candidate-card:not(.is-hidden)"));

  visibleCards.forEach((card, idx) => {
    const id = parseInt(card.dataset.id, 10);
    const cand = CANDIDATES.find(c => c.id === id);

    // Uuenda vastuseta staatust
    if (curQ.id !== "tutvustus" && cand && !hasAnswer(cand, curQ.id)) {
      card.classList.add("no-answer");
    } else {
      card.classList.remove("no-answer");
    }

    // Eemalda vana animatsiooniklass ja lisa uus staggered viivitusega
    card.classList.remove("card-waving");
    card.style.animationDelay = `${idx * 22}ms`;
    void card.offsetWidth; // force reflow
    card.classList.add("card-waving");

    card.addEventListener("animationend", () => {
      card.classList.remove("card-waving");
      card.style.animationDelay = "";
    }, { once: true });
  });
}

// Slide-over drawer küsimuste navigatsiooniriba ehitamine
function renderDrawerNavPills() {
  drawerNavPillsEl.innerHTML = "";
  QUESTIONS.forEach((q, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "drawer-pill-btn" + (idx === activeQuestionIndex ? " active" : "");
    btn.textContent = q.id === "tutvustus" ? "Tutvustus" : `${idx}. ${q.label}`;

    btn.addEventListener("click", () => {
      switchQuestion(idx);
    });

    drawerNavPillsEl.appendChild(btn);
  });

  // Skrolli aktiivne nupp sahtlis nähtavale
  const activePill = drawerNavPillsEl.querySelector(".drawer-pill-btn.active");
  if (activePill) {
    activePill.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }
}

// Slide-over drawer avamine ja uuendamine
function openDrawer(cand) {
  activeCandidateId = cand.id;

  document.querySelectorAll(".candidate-card").forEach(c => {
    c.classList.toggle("selected", parseInt(c.dataset.id, 10) === cand.id);
  });

  const q = QUESTIONS[activeQuestionIndex];

  drawerNameEl.textContent = cand.nimi;
  drawerRoleEl.textContent = cand.amet;
  drawerInstBadgeEl.textContent = cand.asutus;
  drawerFieldBadgeEl.textContent = cand.valdkond;

  renderDrawerNavPills();

  drawerTopicLabelEl.textContent = q.id === "tutvustus" ? "ÜLEVAADE JA TEADUSTÖÖ" : `${q.shortTitle.toUpperCase()}`;
  drawerQuestionQuoteEl.textContent = `„${q.fullText}“`;

  // Uuenda vastuse teksti animatsiooniga
  drawerBodyEl.classList.remove("animating");
  void drawerBodyEl.offsetWidth;

  const answerText = cand.vastused[q.id] || "Kandidaat ei esitanud sellele ankeediküsimusele vastust.";
  drawerBodyEl.innerHTML = "";
  answerText.split(/\n\n+/).forEach(para => {
    const trimmed = para.trim();
    if (trimmed) {
      const p = document.createElement("p");
      p.textContent = trimmed;
      drawerBodyEl.appendChild(p);
    }
  });
  drawerBodyEl.scrollTop = 0;
  drawerBodyEl.classList.add("animating");

  drawerPhotoCreditEl.textContent = `Foto: ${cand.autor}`;

  // Uuenda sahtli jaluse sammunuppe
  drawerPrevBtn.disabled = (activeQuestionIndex === 0);
  drawerNextBtn.disabled = (activeQuestionIndex === QUESTIONS.length - 1);
  drawerStepIndicatorEl.textContent = `${activeQuestionIndex + 1} / ${QUESTIONS.length}`;

  slideDrawerEl.classList.add("visible");
  slideDrawerEl.setAttribute("aria-hidden", "false");
  drawerOverlayEl.classList.add("visible");
}

function closeDrawer() {
  slideDrawerEl.classList.remove("visible");
  slideDrawerEl.setAttribute("aria-hidden", "true");
  drawerOverlayEl.classList.remove("visible");
  activeCandidateId = null;
  document.querySelectorAll(".candidate-card").forEach(c => c.classList.remove("selected"));
}

drawerCloseBtn.addEventListener("click", closeDrawer);
drawerOverlayEl.addEventListener("click", closeDrawer);

// Sahtlis eelmise ja järgmise küsimuse nupud
drawerPrevBtn.addEventListener("click", () => {
  if (activeQuestionIndex > 0) {
    switchQuestion(activeQuestionIndex - 1);
  }
});

drawerNextBtn.addEventListener("click", () => {
  if (activeQuestionIndex < QUESTIONS.length - 1) {
    switchQuestion(activeQuestionIndex + 1);
  }
});

// Klahvistikunavigatsioon sahtlis (nool vasakule / nool paremale küsimuste vahel)
document.addEventListener("keydown", (e) => {
  if (!slideDrawerEl.classList.contains("visible")) return;

  if (e.key === "Escape") {
    closeDrawer();
  } else if (e.key === "ArrowLeft" && activeQuestionIndex > 0) {
    e.preventDefault();
    switchQuestion(activeQuestionIndex - 1);
  } else if (e.key === "ArrowRight" && activeQuestionIndex < QUESTIONS.length - 1) {
    e.preventDefault();
    switchQuestion(activeQuestionIndex + 1);
  }
});

// Teema vahetamine (nii pealehelt kui sahtli seest)
function switchQuestion(newIndex) {
  if (newIndex < 0 || newIndex >= QUESTIONS.length || newIndex === activeQuestionIndex) return;
  activeQuestionIndex = newIndex;

  // Uuenda pealehe vahelehti
  document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
    const isActive = (idx === activeQuestionIndex);
    btn.classList.toggle("active", isActive);
    btn.setAttribute("aria-selected", isActive ? "true" : "false");
  });

  // Uuenda tsitaati ja vallanda pealehel laine-animatsioon
  renderQuote();
  triggerGridQuestionAnimation();

  // Kui sahtel on lahti, värskenda sujuvalt kandidaadi vastust ja sahtli juhtnuppe
  if (activeCandidateId) {
    const activeCand = CANDIDATES.find(c => c.id === activeCandidateId);
    if (activeCand) {
      openDrawer(activeCand);
    }
  }
}

// FLIP animatsioon filtrite valimisel
function applyFilterAnimation() {
  if (isAnimatingFilter) return;
  isAnimatingFilter = true;

  const hasActiveFilter = (activeFieldFilter !== "all" || activeInstFilter !== "all");
  filterActionsEl.classList.toggle("is-hidden", !hasActiveFilter);

  const cards = Array.from(photoGridEl.querySelectorAll(".candidate-card"));

  const firstRects = new Map();
  cards.forEach(card => {
    if (!card.classList.contains("is-hidden")) {
      firstRects.set(card, card.getBoundingClientRect());
    }
  });

  cards.forEach(card => {
    const id = parseInt(card.dataset.id, 10);
    const cand = CANDIDATES.find(c => c.id === id);
    const visible = isCandidateVisible(cand);
    card.classList.toggle("is-hidden", !visible);
  });

  cards.forEach(card => {
    if (!card.classList.contains("is-hidden")) {
      const first = firstRects.get(card);
      const last = card.getBoundingClientRect();

      if (first) {
        const dx = first.left - last.left;
        const dy = first.top - last.top;
        if (dx !== 0 || dy !== 0) {
          card.style.transform = `translate(${dx}px, ${dy}px)`;
          card.style.transition = 'none';
        }
      } else {
        card.style.opacity = '0';
        card.style.transform = 'translateY(16px) scale(0.96)';
        card.style.transition = 'none';
      }
    }
  });

  photoGridEl.offsetHeight; // force reflow

  requestAnimationFrame(() => {
    cards.forEach(card => {
      if (!card.classList.contains("is-hidden")) {
        card.style.transition = 'transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease, box-shadow 0.26s ease';
        card.style.transform = '';
        card.style.opacity = '1';
      }
    });
  });

  setTimeout(() => {
    cards.forEach(card => {
      if (!card.classList.contains("is-hidden")) {
        card.style.transition = '';
      }
    });
    isAnimatingFilter = false;
  }, 480);

  if (activeCandidateId) {
    const activeCand = CANDIDATES.find(c => c.id === activeCandidateId);
    if (!isCandidateVisible(activeCand)) {
      closeDrawer();
    }
  }
}

function setupFilters() {
  const fieldBtns = document.querySelectorAll("#fieldFilters .pill-btn");
  const instBtns = document.querySelectorAll("#instFilters .pill-btn");

  fieldBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      fieldBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFieldFilter = btn.dataset.field;
      applyFilterAnimation();
    });
  });

  instBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      instBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeInstFilter = btn.dataset.inst;
      applyFilterAnimation();
    });
  });

  resetFiltersBtn.addEventListener("click", () => {
    activeFieldFilter = "all";
    activeInstFilter = "all";

    fieldBtns.forEach(b => b.classList.toggle("active", b.dataset.field === "all"));
    instBtns.forEach(b => b.classList.toggle("active", b.dataset.inst === "all"));

    applyFilterAnimation();
  });
}

// Alglaadimine
renderTabs();
renderQuote();
renderGrid();
setupFilters();
</script>
