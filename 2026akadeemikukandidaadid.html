<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akadeemikukandidaadid 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --nov-green: #28902d;
    --nov-green-dark: #195e1d;
    --nov-green-deep: #142e17;
    --nov-green-tint: #f5f9f5;
    --nov-green-tint-hover: #ebf5ec;
    --nov-green-subtle: #dbeadc;
    --nov-green-border: #e3ede4;
    --nov-text-main: #142918;
    --nov-text-muted: #526f55;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    font-family: 'Fira Sans', sans-serif;
    font-weight: 400 !important;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #ffffff;
    color: var(--nov-text-main);
    line-height: 1.45;
    padding: 16px 8px;
  }

  /* Maksimumlaius 900 px, loetav ka 670 px ja mobiilis */
  .err-graphic-container {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    background: #ffffff;
    padding: 8px 12px;
    position: relative;
    user-select: none;
  }

  /* Päis */
  .err-header {
    margin-bottom: 18px;
  }

  .err-title {
    font-size: 23pt;
    line-height: 1.2;
    color: var(--nov-green-deep);
    margin-bottom: 6px;
    letter-spacing: -0.2px;
  }

  .err-subtitle {
    font-size: 13pt;
    color: var(--nov-text-muted);
    line-height: 1.4;
    margin-bottom: 16px;
  }

  /* Horisontaalsed toimetuslikud vahelehed */
  .tabs-wrapper {
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs-wrapper::-webkit-scrollbar {
    display: none;
  }

  .editorial-tabs {
    display: flex;
    gap: 8px;
    padding: 2px 0;
    min-width: max-content;
  }

  .tab-btn {
    background: #ffffff;
    color: var(--nov-text-muted);
    border: 1px solid var(--nov-green-border);
    padding: 7px 15px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    line-height: 1.2;
    white-space: nowrap;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  }

  .tab-btn:hover {
    background: var(--nov-green-tint-hover);
    color: var(--nov-green-dark);
    border-color: var(--nov-green-subtle);
    transform: translateY(-1px);
  }

  .tab-btn.active {
    background: var(--nov-green);
    color: #ffffff;
    border-color: var(--nov-green);
    box-shadow: 0 2px 8px rgba(40, 144, 45, 0.28);
    transform: translateY(-1px);
  }

  /* Toimetuslik tsitaat kaldkirjas ilma kasti ja märgiseta */
  .editorial-quote-wrap {
    margin: 12px 0 20px 0;
    padding: 4px 2px;
    min-height: 48px;
  }

  .editorial-quote {
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--nov-green-deep);
    font-style: italic;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .editorial-quote.fading {
    opacity: 0;
    transform: translateY(4px);
  }

  /* Pill-filtrid ja dünaamiline "Puhasta filtrid" */
  .filter-area {
    margin-bottom: 22px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .filter-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .filter-caption {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--nov-text-muted);
    min-width: 68px;
    flex-shrink: 0;
  }

  .filter-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    flex: 1;
  }

  .pill-btn {
    background: #ffffff;
    border: 1px solid var(--nov-green-border);
    color: var(--nov-text-main);
    font-size: 11.5px;
    padding: 3.5px 10px;
    border-radius: 14px;
    cursor: pointer;
    line-height: 1.25;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }

  .pill-btn:hover {
    background: var(--nov-green-tint-hover);
    border-color: var(--nov-green-subtle);
    transform: translateY(-1px);
  }

  .pill-btn.active {
    background: var(--nov-green);
    color: #ffffff;
    border-color: var(--nov-green);
  }

  .color-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .pill-btn.active .color-dot {
    box-shadow: 0 0 0 1px #ffffff;
  }

  /* Puhasta filtrid nupp ilmub nähtavale AINULT aktiivse filtri korral */
  .filter-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 2px;
  }

  .filter-actions.is-hidden {
    display: none !important;
  }

  .clear-filters-btn {
    background: transparent;
    border: 1px solid var(--nov-green);
    color: var(--nov-green-dark);
    font-size: 11.5px;
    padding: 3px 10px;
    border-radius: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background-color 0.18s ease, color 0.18s ease;
  }

  .clear-filters-btn:hover {
    background: var(--nov-green);
    color: #ffffff;
  }

  /* Fotovõrgustik */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    position: relative;
    min-height: 280px;
  }

  .candidate-card {
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
    outline: none;
    transition: transform 0.26s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.26s ease, opacity 0.3s ease;
    border-radius: 6px;
    background: #ffffff;
    will-change: transform, opacity;
  }

  .candidate-card.is-hidden {
    display: none !important;
  }

  /* Kui kandidaadil puudub aktiivsele küsimusele vastus */
  .candidate-card.no-answer {
    opacity: 0.62;
  }

  .candidate-card.no-answer:hover {
    opacity: 0.95;
  }

  /* Pildile liikumisel õhuline väljatõste */
  .candidate-card:hover,
  .candidate-card:focus-visible {
    transform: translateY(-6px) scale(1.025);
    box-shadow: 0 12px 24px rgba(40, 144, 45, 0.14);
    z-index: 5;
  }

  .candidate-card.selected {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 0 0 3px var(--inst-color, var(--nov-green)), 0 14px 28px rgba(40, 144, 45, 0.2);
    z-index: 8;
  }

  /* Küsimuse vahetumise märgatav laine-animatsioon kaartidel */
  @keyframes cardQuestionWave {
    0% {
      transform: translateY(0);
    }
    45% {
      transform: translateY(-8px) scale(1.02);
    }
    100% {
      transform: translateY(0) scale(1);
    }
  }

  .card-waving {
    animation: cardQuestionWave 0.36s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  /* Paks raami alaosa teadlase nimega */
  .photo-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 4.75;
    border: 2px solid var(--inst-color, var(--nov-green-border));
    border-radius: 6px;
    overflow: hidden;
    background: #f0f4f1;
    display: flex;
    flex-direction: column;
  }

  .photo-img-wrap {
    flex: 1;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  .photo-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
    transition: transform 0.28s ease;
  }

  .candidate-card:hover .photo-img-wrap img,
  .candidate-card.selected .photo-img-wrap img {
    transform: scale(1.045);
  }

  .unanswered-tag {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(20, 46, 23, 0.75);
    color: #ffffff;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 10px;
    letter-spacing: 0.3px;
    backdrop-filter: blur(2px);
    display: none;
  }

  .candidate-card.no-answer .unanswered-tag {
    display: block;
  }

  .frame-name-bar {
    background-color: var(--inst-color, var(--nov-green));
    padding: 7px 6px;
    text-align: center;
    flex-shrink: 0;
  }

  .candidate-name-link {
    color: #ffffff;
    text-decoration: none;
    font-size: 12.5px;
    line-height: 1.25;
    letter-spacing: 0.15px;
    display: block;
    transition: opacity 0.18s ease;
  }

  .candidate-name-link:hover {
    opacity: 0.92;
  }

  .card-meta {
    margin-top: 6px;
    font-size: 11px;
    color: var(--nov-text-muted);
    text-align: center;
    line-height: 1.3;
  }

  /* Slide-over drawer lahendus */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(18, 41, 20, 0.35);
    backdrop-filter: blur(2px);
    opacity: 0;
    pointer-events: none;
    z-index: 9998;
    transition: opacity 0.3s ease;
  }

  .drawer-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .slide-drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 520px;
    max-width: calc(100vw - 20px);
    background: #ffffff;
    box-shadow: -10px 0 36px rgba(18, 41, 20, 0.2);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .slide-drawer.visible {
    transform: translateX(0);
  }

  .drawer-header {
    padding: 18px 22px 14px 22px;
    background: var(--nov-green-tint);
    border-bottom: 1px solid var(--nov-green-border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-shrink: 0;
  }

  .drawer-person-info {
    min-width: 0;
  }

  .drawer-name {
    font-size: 20px;
    color: var(--nov-green-deep);
    line-height: 1.25;
    margin-bottom: 3px;
  }

  .drawer-role {
    font-size: 12.5px;
    color: var(--nov-text-muted);
    line-height: 1.35;
    margin-bottom: 8px;
  }

  .drawer-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .drawer-badge {
    font-size: 11px;
    padding: 2.5px 8px;
    border-radius: 12px;
    background: #ffffff;
    border: 1px solid var(--nov-green-border);
    color: var(--nov-text-main);
  }

  .drawer-close-btn {
    background: #ffffff;
    border: 1px solid var(--nov-green-border);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--nov-text-main);
    flex-shrink: 0;
    transition: background-color 0.18s ease, transform 0.18s ease;
  }

  .drawer-close-btn:hover {
    background: var(--nov-green-tint-hover);
    transform: rotate(90deg);
  }

  /* Küsimuste navigeerimisriba sahtli sees */
  .drawer-nav-bar {
    background: #edf5ee;
    padding: 8px 18px;
    border-bottom: 1px solid var(--nov-green-border);
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  .drawer-nav-bar::-webkit-scrollbar {
    display: none;
  }

  .drawer-nav-pills {
    display: flex;
    gap: 6px;
    min-width: max-content;
  }

  .drawer-pill-btn {
    background: #ffffff;
    border: 1px solid var(--nov-green-border);
    color: var(--nov-text-muted);
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: 14px;
    cursor: pointer;
    line-height: 1.2;
    white-space: nowrap;
    transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }

  .drawer-pill-btn:hover {
    background: var(--nov-green-tint-hover);
    color: var(--nov-green-dark);
    border-color: var(--nov-green-subtle);
  }

  .drawer-pill-btn.active {
    background: var(--nov-green);
    color: #ffffff;
    border-color: var(--nov-green);
  }

  /* Sahtli küsimuse päis ja tsitaat */
  .drawer-topic-header {
    padding: 12px 22px 10px 22px;
    background: #fafdfa;
    border-bottom: 1px solid var(--nov-green-border);
    flex-shrink: 0;
  }

  .drawer-topic-label {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--nov-green-dark);
    margin-bottom: 4px;
  }

  .drawer-question-quote {
    font-size: 13.5px;
    font-style: italic;
    line-height: 1.4;
    color: var(--nov-green-deep);
  }

  /* Sahtli keha animatsiooniga */
  .drawer-body {
    padding: 22px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.62;
    color: var(--nov-text-main);
    flex: 1;
    user-select: text;
  }

  .drawer-body::-webkit-scrollbar {
    width: 6px;
  }
  .drawer-body::-webkit-scrollbar-track {
    background: #f7faf7;
  }
  .drawer-body::-webkit-scrollbar-thumb {
    background: #c5dac7;
    border-radius: 3px;
  }

  .drawer-body.animating {
    animation: drawerTextEnter 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes drawerTextEnter {
    0% {
      opacity: 0;
      transform: translateY(8px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .drawer-body p {
    margin-bottom: 13px;
    text-align: left;
  }

  .drawer-body p:last-child {
    margin-bottom: 0;
  }

  /* Sahtli jalus navigatsiooninuppudega */
  .drawer-footer {
    padding: 10px 22px;
    font-size: 11px;
    color: var(--nov-text-muted);
    border-top: 1px solid var(--nov-green-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    background: #fafdfa;
    gap: 12px;
  }

  .drawer-nav-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .drawer-step-btn {
    background: #ffffff;
    border: 1px solid var(--nov-green-border);
    color: var(--nov-text-main);
    font-size: 11.5px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    line-height: 1.2;
    transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }

  .drawer-step-btn:hover:not(:disabled) {
    background: var(--nov-green-tint-hover);
    border-color: var(--nov-green-subtle);
    color: var(--nov-green-dark);
  }

  .drawer-step-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .drawer-step-indicator {
    font-size: 11px;
    color: var(--nov-text-muted);
    min-width: 38px;
    text-align: center;
  }

  .err-footer {
    margin-top: 24px;
    padding-top: 10px;
    font-size: 14pt;
    color: var(--nov-text-muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }

  /* Kohanduvus */
  @media (max-width: 720px) {
    .photo-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .err-title {
      font-size: 19pt;
    }
  }

  @media (max-width: 480px) {
    .photo-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .filter-caption {
      min-width: 100%;
    }
    .slide-drawer {
      width: 100vw;
      max-width: 100vw;
    }
    .drawer-footer {
      flex-direction: column-reverse;
      align-items: flex-start;
      gap: 8px;
    }
  }
</style>
</head>
<body>

<div class="err-graphic-container" id="errGraphic">
  <header class="err-header">
    <h1 class="err-title">Akadeemikukandidaadid 2026</h1>
    <p class="err-subtitle">Vali teema ning klõpsa teadlase fotol, et avada paremalt tema täismahus vastus ja ülevaade.</p>

    <!-- Horisontaalsed toimetuslikud vahelehed -->
    <div class="tabs-wrapper">
      <nav class="editorial-tabs" id="editorialTabs" role="tablist"></nav>
    </div>

    <!-- Toimetuslik küsimuse tsitaat -->
    <div class="editorial-quote-wrap">
      <p class="editorial-quote" id="editorialQuoteText"></p>
    </div>

    <!-- Pill-filtrid -->
    <div class="filter-area">
      <div class="filter-row">
        <span class="filter-caption">Valdkond</span>
        <div class="filter-pills" id="fieldFilters">
          <button type="button" class="pill-btn active" data-field="all">Kõik</button>
          <button type="button" class="pill-btn" data-field="Astrofüüsika"><span class="color-dot" style="background:#0033cc"></span>Astrofüüsika</button>
          <button type="button" class="pill-btn" data-field="Elektroonika"><span class="color-dot" style="background:#33cccc"></span>Elektroonika</button>
          <button type="button" class="pill-btn" data-field="Filosoofia"><span class="color-dot" style="background:#ff9900"></span>Filosoofia</button>
          <button type="button" class="pill-btn" data-field="Geomaatika"><span class="color-dot" style="background:#009900"></span>Geomaatika</button>
          <button type="button" class="pill-btn" data-field="Haridusuuringud"><span class="color-dot" style="background:#ffcc00"></span>Haridusuuringud</button>
          <button type="button" class="pill-btn" data-field="Keemia"><span class="color-dot" style="background:#ff5050"></span>Keemia</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-caption">Asutus</span>
        <div class="filter-pills" id="instFilters">
          <button type="button" class="pill-btn active" data-inst="all">Kõik</button>
          <button type="button" class="pill-btn" data-inst="Tallinna Tehnikaülikool"><span class="color-dot" style="background:#850045"></span>Tallinna Tehnikaülikool</button>
          <button type="button" class="pill-btn" data-inst="Tartu Ülikool"><span class="color-dot" style="background:#2E66A4"></span>Tartu Ülikool</button>
          <button type="button" class="pill-btn" data-inst="Tallinna Ülikool"><span class="color-dot" style="background:#B20E10"></span>Tallinna Ülikool</button>
          <button type="button" class="pill-btn" data-inst="KBFI"><span class="color-dot" style="background:#CD5C6E"></span>KBFI</button>
        </div>
      </div>
      <div class="filter-actions is-hidden" id="filterActions">
        <button type="button" class="clear-filters-btn" id="resetFiltersBtn">
          ✕ Puhasta filtrid
        </button>
      </div>
    </div>
  </header>

  <!-- Fotovõrgustik -->
  <main>
    <section class="photo-grid" id="photoGrid"></section>
  </main>

  <footer class="err-footer">
    <span>Allikas: Eesti Teaduste Akadeemia, ERR Novaator</span>
  </footer>
</div>

<!-- Slide-over drawer lahendus koos sisese küsimusenavigatsiooniga -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="slide-drawer" id="slideDrawer" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="drawer-header">
    <div class="drawer-person-info">
      <h2 class="drawer-name" id="drawerName"></h2>
      <div class="drawer-role" id="drawerRole"></div>
      <div class="drawer-badges">
        <span class="drawer-badge" id="drawerInstBadge"></span>
        <span class="drawer-badge" id="drawerFieldBadge"></span>
      </div>
    </div>
    <button type="button" class="drawer-close-btn" id="drawerCloseBtn" aria-label="Sulge külgpaneel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Sise-navigatsiooninupud küsimuste vahel -->
  <div class="drawer-nav-bar">
    <div class="drawer-nav-pills" id="drawerNavPills"></div>
  </div>

  <div class="drawer-topic-header">
    <div class="drawer-topic-label" id="drawerTopicLabel"></div>
    <div class="drawer-question-quote" id="drawerQuestionQuote"></div>
  </div>

  <div class="drawer-body" id="drawerBody"></div>

  <div class="drawer-footer">
    <div class="drawer-nav-controls">
      <button type="button" class="drawer-step-btn" id="drawerPrevBtn" aria-label="Eelmine küsimus">
        ← Eelmine
      </button>
      <span class="drawer-step-indicator" id="drawerStepIndicator">1 / 6</span>
      <button type="button" class="drawer-step-btn" id="drawerNextBtn" aria-label="Järgmine küsimus">
        Järgmine →
      </button>
    </div>
    <span id="drawerPhotoCredit"></span>
  </div>
</aside>

<script>
const QUESTIONS = [

    "vastused": {
      "tutvustus": "Margit Sutrop uurib moraalifilosoofiat, rakenduseetikat ja Eesti filosoofia mõistet. Tema teadustöö analüüsib väärtuskonflikte, eetilist otsustusvõimet ning usaldust teaduse ja tehnoloogiate, sealhulgas tehisintellekti vastu.\n\nViimastel aastatel juhib ta tehisintellekti eetika ning teaduseetika uurimissuundi, vedades eest Eesti Tehisintellekti Tippkeskuse rahvusvahelist eetikanõukogu ja Euroopa Komisjoni teaduse usaldusväärsust käsitlevaid projekte. Lisaks koostab ta teaduseetika käsiraamatut ning töötas muu hulgas juhtivautorina välja 2025. aastal ilmunud OECD eetilise kompetentsuse raamistiku peatüki.\n\nSutrop on Tartu Ülikooli praktilise filosoofia professor, eetikakeskuse juhataja ning riigikogu liige. Ta valiti 2004. aastal Academia Europaea liikmeks ning nõustab eksperdina üle paarikümne aasta Euroopa Komisjoni eetikaküsimustes.",
      "k1": "Kõige erilisemad on olnud hetked, mil midagi juhtub esimest korda. Laste ja hiljem lapselaste sünd. Esimene välisreis – doktoristipendiumi saamine ja õppima asumine Oxfordi ülikoolis 1991. aastal. Olin õppinud Miina Härma Gümnaasiumis süvendatult inglise keelt, aga polnud kunagi Inglismaale saanud. Londonisse saabudes tiirutas lennuk nii madalalt linna kohal, et oli tunne nagu saaksin katsuda Big Beni ning lugeda kokku tuvid Trafalgari väljakul. Raske oli uskuda, et näen oma silmaga seni vaid raamatutest tuttavaid paiku.\n\nEesti iseseisvuse taastamine. Doktoritöö kaitsmine Konstanzi Ülikoolis. Tartu Ülikooli professoriks valimine – seisime koos teiste Eesti stipendiaatidega Konstanzi Ülikooli rõdul, kust avanes vaade Bodenseele ja Alpidele, ning ootasime telefonikõnet, kas Tartu Ülikooli nõukogu valis mu ära. Esimene päev riigikogus – ametivande andmine, pühalik lubadus teenida oma riiki ja jääda ustavaks Eesti Vabariigile ning tema põhiseaduslikule korrale.\n\nNeed on väga erinevad hetked, kuid kõiki ühendab tunne, et algab midagi uut ja olulist. Osa neist on seotud minu tööga, osa isikliku eluga, osa meie kõigi ühise ajalooga. Töö ja elu on tihedalt läbi põimunud, peamine väljakutse on olnud leida nende vahel tasakaal.",
      "k2": "Tagaksin Eesti teadusele piisava ja stabiilse rahastuse ning muudaksin teaduse rahastamise põhimõtteid. Rahastamise aluseks peaks olema usaldus, millega kaasneb vastutus. Kui teadlane on näidanud oma töö rahvusvaheliselt kõrget taset ja jätkuvat aktiivsust, peaks tal olema kindel baasrahastus teadustöö jätkamiseks. Ta ei peaks pidevalt kirjutama uusi projektitaotlusi lihtsalt selleks, et oma uurimisrühma elus hoida. Lisaraha võiks taotleda vaid uute suurte projektide käivitamiseks, uute inimeste töölevõtmiseks ja teadustaristu arendamiseks.\n\nSenisest enam tuleks teadlaste hindamisel arvestada teadusvaldkondade eripära. Füüsika, matemaatika, arstiteaduse, põllumajandusteaduse, sotsiaal- ja humanitaarteaduste tulemusi ei saa mõõta sama mõõdupuuga. Alusteadustelt ei saa nõuda kohese ühiskondliku kasu näitamist, kuid ilma nendeta ei sünni ka tulevased rakendused.\n\nTeaduse rahastamine peab tagama ka akadeemilise järelkasvu. Tuleks jälgida, millistes valdkondades on tekkimas lünk, ning just nende erialade andekaid noori saata stipendiumidega maailma parimatesse ülikoolidesse. Sama oluline on toetada nende tagasitulekut ja oma uurimisrühma loomist Eestis.\n\nOsalen Teaduste Akadeemia teaduse ja kõrghariduse komisjonis, mis tegi hiljuti avaliku pöördumise „Eesti teadus on suurem kui Eesti”. Tegime ettepaneku luua Eestis ja välismaal tegutsevaid Eestiga seotud teadlasi ühendav võrgustik ning koostöö- ja naasmisgrandid. Me ei peaks kartma, et meie noored lähevad maailma. Peaksime hoolitsema selle eest, et neil oleks põhjust tagasi tulla – ja et ka välismaalased tahaksid siia tulla. Kõik eestlased ei pea Eestisse tagasi tulema, et Eesti teaduse arengusse panustada. Oma panuse saab anda ka rahvusvaheliste koostööprojektide algatamise, ühiste uurimisgrantide ning doktorantide ja järeldoktorite juhendamise kaudu.\n\nMaailmas räägitakse praegu palju sellest, mida tehisaru suudab, kuid liiga vähe sellest, kuidas tehisaru muudab inimest ennast – meie mõtlemisvõimet, autonoomiat, eetikat, suhteid ja enesemõistmist. Küsimus pole ainult selles, mida masinad meie eest ära teevad, vaid ka selles, milliseks me ise nende kasutamise käigus muutume ja mis väärtused on ohus.",
      "k3": "Ma ei vaikiks. Vea avalikustamine võib usaldust teaduse vastu ajutiselt kõigutada, kuid selle teadlik varjamine kahjustaks usalduse aluseid palju sügavamalt.\n\nKõigepealt räägiksin kolleegiga, püüaksin aru saada, mis on juhtunud, ning annaksin talle võimaluse viga ise parandada. Eksimine on inimlik. Kuid teadlikult vea varjamine on midagi muud – see on väärkäitumine, teaduseetika rikkumine.\n\nKui kolleeg keeldub viga parandamast, tuleks pöörduda ajakirja toimetuse või teadusasutuse poole, järgides hea teaduse põhimõtteid ja menetlusreegleid. Oluline on nii teadusliku vea parandamine kui ka sellest ajakirja lugejate teavitamine. Tänavu mais Vancouveris toimunud 9. teaduseetika maailmakonverentsil rõhutasid mitmed ettekandjad, et karistamisest tähtsam on motiveerida teadlasi oma vigu parandama ja vajadusel avaldatud artikleid tagasi võtma. Vigased tulemused viivad teisi teadlasi eksiteele ja võivad kaasa tuua väga raskeid tagajärgi, näiteks meditsiinis või inseneerias.\n\nTegemist on raske väärtuskonfliktiga, sest korraga on mängus nii lojaalsus kolleegile kui ka lojaalsus teadusele ja iseendale. Selle lahendamine nõuab julgust, aga ka hoolivust ja vastutustunnet.",
      "k4": "Esmalt vaidlustaksin küsimuse eelduse, et teadust tehakse kas kolleegidele või ühiskonnale. Teaduse esimene ülesanne on luua uut ja usaldusväärset teadmist.\n\nSamas ei saa teadlane jääda elevandiluust torni. Teadlastel on vastutus aidata inimestel mõista, mida me teame, mida me veel ei tea ja millised valikuvõimalused meie ees seisavad. Filosoofide ülesanne on aidata küsimusi õigesti püstitada, et neile saaks vastata, tuua nähtavale varjatud eeldusi ja väärtuskonflikte ning luua võimalusi mõistlikuks aruteluks.\n\nTeaduse ühiskondlikku väärtust ei saa mõõta sellega, kui palju teadlane avalikkuses sõna võtab. Samas ei näe ma midagi halba selles, kui teadlasest saab ka arvamusliider. Praeguses tõejärgses ühiskonnas on väga oluline, et avalikus arutelus kõlaksid teadmistel, uurimistulemustel ja teaduskirjandusel põhinevad seisukohad. Oluline on lükata ümber väärinfo ja seista vastu populismile ja vandenõuteooriate levikule.\n\nTeadlase autoriteet peab aga põhinema argumentide kvaliteedil, mitte tema tuntusel. Ta peab suutma eristada, millal ta räägib oma uurimistöö põhjal ja millal väljendab kodanikuna oma väärtuseelistusi. Samas on see ka ajakirjanduse vastutus aidata arutelu sobivalt raamistada, et inimestel oleks võimalik aru saada, mis positsioonilt teadlane sõna võtab, kas eksperdi või kodanikuna.",
      "k5": "Akadeemikuks valimine tähendaks mulle võimalust ja kohustust jätkata tipptasemel teadustööd ning aidata kaasa akadeemia ülesandele nõustada riiki ja ühiskonda.\n\nMinu jaoks tähendaks valimine suurt tunnustust Tartu Ülikooli filosoofiale, mille arendamine rahvusvaheliselt konkurentsivõimeliseks teadusvaldkonnaks on olnud minu südameasi Konstanzi ülikoolist tagasitulekust saadik. Pärast pikka vaheaega oleksid Teaduste Akadeemias taas esindatud ka filosoofid. Praktilise filosoofi ja eetikaeksperdi kaasamine võiks aidata akadeemial tõsta nii teadlaskonna kui ka kogu ühiskonna eetilist teadlikkust.\n\nMinu praegused uurimisteemad – usaldus teaduse vastu, moraalsete lahkarvamuste ja väärtuskonfliktidega toimetulek ning tehisaru kooskõlla viimine inimlike väärtustega – on suure ühiskondliku kõlapinnaga. Teaduse ja tehnoloogia kiire areng toob pidevalt kaasa uusi eetilisi küsimusi, mille lahendamine nõuab eri teadusalade koostööd. Olen interdistsiplinaarse koostöö usku ja osalenud paljudes rahvusvahelistes projektides, kus erinevate erialade teadlased uurivad sama probleemi. Hiljuti analüüsisime TÜ eetikakeskuse projektis koos andmeteadlaste, juristide ja sotsioloogidega TI-Hüppe haridusprogrammi ja tehisintellektipõhise õpirakenduse eetilisi riske, võttes aluseks Eesti Teaduste Akadeemia küberturvalisuse töörühma metoodika.\n\nOlen olnud riigikogu ja Teaduste Akadeemia kohtumiste „Vaimu ja võimu dialoog Toompeal” sünni juures ja tahan kaasa aidata, et nad jätkuvad ka tulevikus. Pean oluliseks, et saaksime paremini tööle teadmispõhise poliitikakujundamise, et teadlased tahaks nõu anda ja poliitikud oskaks seda küsida ja kasutada. 18. novembril riigikogus konverents ning minu koostatav kogumik teadlaste ja otsustajate koostöökogemustest.\n\nOlen juba üle paarikümne aasta Euroopa tippteadlasi ühendava Academia Europaea liige ning üle paarikümne aasta tegutsenud Euroopa Komisjoni eetikaeksperdina. Mul on lai rahvusvaheline koostöövõrgustik ja tunnen Euroopa teaduspoliitika kitsaskohti. Eesti Teaduste Akadeemia liikmena saaksin tõhusamalt edendada rahvusvahelist koostööd ja seista Eesti teaduse huvide eest Brüsselis. Samal ajal köidab mind võimalus osaleda Eesti tippteadlaste aruteludes, õppida tundma erinevaid lähenemisi ning otsida ühiselt lahendusi maailma ees seisvatele probleemidele.\nAkadeemikuks valimine annaks mulle uusi võimalusi ehitada sildu nii teadusalade vahel kui ka teaduse ja ühiskonna vahel."
    }

  {
    "id": 4,
    "nimi": "Tõnu Viik",
    "amet": "teenekas professor",
    "valdkond": "Filosoofia",
    "valdkonnaToon": "#ff9900",
    "asutus": "Tallinna Ülikool",
    "asutuseToon": "#B20E10",
    "pilt": "https://s.err.ee/photo/orig/2026/11/02/3868984h3062.png",
    "autor": "Raul Mee",
    "vastused": {
      "tutvustus": "Tõnu Viik uurib fenomenoloogiat, kultuurifilosoofiat ja filosoofia ajalugu. Tema teadustöö peamine panus on kultuurisõltelise tähendusloome fenomenoloogiline käsitlus, mis analüüsib, kuidas kollektiivsed struktuurid osalevad individuaalse kogemuse kujunemisel.\n\nViimastel aastatel on ta arendanud kollektiivsete emotsioonide, tehnoloogia ja populistliku poliitika fenomenoloogilisi käsitlusi ning uurinud inimeste emotsionaalseid suhteid robotitega. Samuti teeb ta tehnoloogia ja inimsuhete uurimisel koostööd Kyoto Ülikooli Inimkonna Tuleviku Instituudiga.\n\nViik on Tallinna Ülikooli filosoofia teenekas professor ning rahvusvahelise teadusorganisatsiooni Society for Phenomenology and Media juhatuse liige. Aastatel 2021–2026 oli ta Tallinna Ülikooli rektor, panustades laiemalt Eesti teadus- ja kõrghariduspoliitika kujundamisse.",
      "k1": "Oleks kurb küll, kui elu tipphetkede puhul ainult tööelu meelde tuleks, aga see \"tööks\" nimetatu on mulle tõesti väga palju tähenduslikke hetki pakkunud. Olen ajanud kahte üsnagi erinevat asja ja käinud nii õpetlase kui ka organisatsiooni juhi radu pidi, mille rõõmud ja mured on üsna erinevad.\n\nEsimese juures tuleb ette selliseid kogemusi, mis vaimustavad selle sõna otseses tähenduses – panevad elama, inspireerivad ja ergutavad mõtlemist. On olnud palju kolleege, kohtumisi ja sellist pühendumust üliõpilaste poolt, mis mulle selles tähenduses on vaimustavalt mõjunud. Ja muidugi kuuluvad siia ka oma mõtete loomise ja sõnastamise hetked – need vaiksed hommikud rohelise teega kui väljas tasapisi valgemaks läheb ja mõtted peas pöörasena keerlevad. Mõnikord mõtlen, et nende hommikute pärast ma üldse filosoofia juures olen.\n\nJuhi elu on hoopis teistsugune, – raske koorma tundega, alandlik ja erakordselt õpetlik eluviis, kus vaikseid hommikuid on harva. Selle positsiooni rõõmud on minu jaoks seotud eneseületamise, ühise ürituse õnnestumise ja eesmärkide saavutamisega ning uhkusetundega oma inimeste üle.",
      "k2": "Kui valdkonna all pidada silmas Eesti teaduse ja kõrghariduse institutsionaalset organiseerimist, siis selle üks suurimaid probleeme on projektipõhise teadusrahastuse kasutamine valedel eesmärkidel. Oleme hakanud projektide abil rahastama püsiinstitutsioonide tööd ning tänu sellele toonud teadusesse rohkem raha, kui me seda riigieelarve kaudu suudaksime, aga teadusrahastuse projektipõhisus võimendab sellise kasutuse puhul hulka negatiivseid järelmeid, alates teadlaste asjatust ajakulust ning eesmärkide hägustumisest kuni väga suurte kaudsete aja- ja ressursikuludeni, mis asutuste vaatest alati projektide majandamisega kaasas käivad.\n\nVäärtõlgenduste vältimiseks kordan üle, et projektipõhine teadusrahastus on igati hea ja vajalik instrument, aga selle eest võiks tõesti ajutise iseloomuga ettevõtmisi, mitte rahastada Eestile vajalike institutsioonide ja töökohtade püsimist.\n\nPoliitikutega lähedalt kokku puutunud inimesena ütleksin, et Eesti poliitilise välja suurim probleem on lõhe selle vahel, mida enamik meie erakondi deklareerib – et nad usuvad teadusesse ja haridusse, ning mida nad reaalselt teevad. Näiteks selle aasta eelarvet koostades ei suutnud praegune valitsus ülikoolide rahastust nii palju tõsta, kui suureneva gümnaasiumilõpetajate arvu tõttu vaja oleks. Ja ometigi oleks see samm aidanud ära kasutada meie lähemate aastakümnete ainsat positiivset demograafilist trendi. See näitab, et usk relvastusse ja transporditaristusse on tegelikult suurem kui usk teadusesse, haridusse ja selle abil meie riigi tugevdamisse.\n\nKui aga filosoofia juurde tulla, siis meenub ühe hea näitena kohe president Ülle Madise esimene kõne, mida põhjusega on kiidetud. Head ja tarmukad mõtted ja üleskutsed, hea atmosfääriloome, aga sisaldab ühte levinud eesti kultuuri mõistega seotud ebakõla, mis selle tähendust pisendab. Kuna see puudutab ühte minu teadustöö põhisuunda, milleks on kultuuri teoreetiline mõtestamine, siis hakkab see mulle silma. Ta ütleb, et kultuuri ei saa pidada millekski, mis tuleb pärast kõike muud, ning jõuab seejärel üleskutseni külastada kultuurisündmusi ja hinnata meie kunstiloojaid. \n\nSelle üleskutsega olen ma muidugi nõus, aga just siin tulebki nähtavale kultuuri mõiste tähenduse kitsendamine. Nimelt, kui me räägime kultuurist põhiseaduse mõttes ja riigi kohustusest eesti keele ja kultuuri eest hoolt kanda, siis peaksime me kultuuri all silmas pidama eesti rahva eluviisi või \"komberuumi\", kuid nii sageli libiseme me sellelt tähenduselt endale seda teadvustamata kultuuri kitsa tähenduse – kultuuri kui kunstiloome ühisnimetaja juurde. See tähenduse libisemine kultuuri laialt määratluselt kitsale ei ole pelgalt teoreetiline ebakõla mõiste määratlemisel, vaid juhib meid ekslikule arusaamale sellest, mida me riigina oma kultuuri kaitseks ja hoidmiseks tegema peaksime. Seetõttu tahaksin, et see filosoofiline arusaam kultuurist ja mõisteselgus oleks oluliselt levinum, kui see täna on.",
      "k3": "Seni kuni eetilised dilemmad on hüpoteetilised, on neile kerge vastata ning küllap lähtuvad vastused alati hoiakust, mida väljendab keskajal Aristotelesele omistatud ütlus oma õpetaja kohta: Amicus Plato, sed magis amica veritas. Ja tõepoolest, kui keegi peaks oma nime all tahtlikult valet avaldama, siis on ta reetnud põhimõtte, millele teaduslik tõetaotlus tugineb. See ei ole väike eksimus ning sellise sammuga astub inimene sisuliselt akadeemilisest kogukonnast välja.\n\nKuna teaduslik teadmine pole kunagi absoluutne ja võib põhimõtteliselt osutuda ekslikuks ning on alati ümberlükatav, kas või juba seetõttu, et avastatud tõed on alati piiratud kehtivusega, mis tuleneb kasutatud metodoloogiast, katsete või näidete hulgast jne, siis on tahtlik tõetaotlusest loobumine vaata et kõige halvem, mida üks õpetlane saab teha. Teha teadust tähendab muu hulgas ka olla teadlik teadmise ekslikkusest.\n\nPean ütlema, et ma vist ei ole kirjeldatud olukorda kogenud, ning minu kokkupuute järgi on teadlased enamasti väga pühendunud inimesed. Pühendumuse puudumisel vist teadusesse ei minda. See ei tähenda, et õpetlaste elu oleks eksimustest ja pahedest prii, aga need väljenduvad enamasti muudes kiusatustes ja teistes eetilistes dilemmades kui otsene tahtlik valetamine oma teadustöös.",
      "k4": "Võime vist niisuguse ajaloolise üldistuse teha, et pärast seda, kui teadusele pühendumise võimalus on laienenud ka neile, kes pole aristokraatideks sündinud, on alati olnud vaja teaduse vajalikkust ja kasulikkust kuidagi selgitada. Muidugi on ka valitsejad ise aeg-ajalt ühte või teist uurimistegevust omal initsiatiivil rahastanud, näiteks Putin ja Xi olevat huvitatud elu pikendamisele pühendatud uuringutest. Ning peaaegu kõik valitsused on huvitatud kaitsevõime ja majandusliku rikkuse suurendamisest.\n\nAga asjale rahastamise nurga alt lähenedes on teadustegevuse põhjendamine pigem väline, tehnilist laadi instrumentaalne probleem, mis tänapäeval on enamasti asutuste juhtkondade ja projektitaotluste kirjutajate ülesandeks delegeeritud. Ning me näeme, et ega see selgitustöö delegeerituna hästi ei tööta.\n\nMe võiksime läheneda samale küsimusele hoopis teise nurga alt ja mõtelda selle peale, kas ühiskonnale suunatud selgitustöö võiks midagi teaduslikule edenemisele endale heuristiliselt juurde anda. Kas võime oma uurimisküsimus üldmõistetavaks teha võiks viia ka suurema teadusselguseni, näiteks?\n\nMa muidugi möönan, et teadlase vaatest on küsimus pigem motivatsioonis ja ajas, sest \"arvamusliidriks\" olemises ei ole midagi lihtsat. See on sõnaseade poolest üsna nõudlik žanr, mis eeldab head auditooriumitunnetust, ülevaadet ühiskonnas levinud seisukohtadest, mida \"arvajal\" tuleb kõnetada, nendega pidevat kursisolekut, head loomuliku keele taju ja väga selget mõtlemist. Ning sellega kaasnevad omad ohud: on oht muutuda ühte või teist tüüpi poliitilise tellimuse täitjaks ja sõnastajaks või siis ajakirjanduse teenriks, kes kõikidel teemadel sõna võtab ja vabastab ajakirjaniku vajadusest erialaspetsialiste otsida.",
      "k5": "Võtaksin seda väga suure tunnustusena ning Akadeemia liikmena panustaksin ma kindlasti ka selle käekäiku ja kujunemisse. Kui ma seni olen pannud palju rõhku kõrghariduse vajalikkuse selgitamisele, siis küllap paneks liikmelisus mind rohkem ka teaduse vajalikkusest rääkima. Ma usun, et Teaduste Akadeemia muutub igal juhul aina mõjukamaks, sest mida kiiremini ja keerulisemaks ühiskond muutub, seda rohkem ta ka teaduspõhist häält oma korraldamiseks ja eduks vajab. Teaduste Akadeemia peab tegema nii, et just tema oleks selle hääle üks Eesti jaoks olulisemaid kandjaid.\n\nMa tunnen kaasa poliitikutele, kes tahavad kasvavaid kulusid teadusele ja haridusele kuidagi kärpida või kontrolli alla saada. Paraku elame me aegadel, mil ühiskond vajab täna rohkem teaduspõhist sisendit kui eile ja homme veel rohkem kui täna."
    }

  {
    "id": 5,
    "nimi": "Artu Ellmann",
    "amet": "teedeehituse ja geodeesia uurimisrühma juht",
    "valdkond": "Geomaatika",
    "valdkonnaToon": "#009900",
    "asutus": "Tallinna Tehnikaülikool",
    "asutuseToon": "#850045",
    "pilt": "https://s.err.ee/photo/orig/2026/11/02/3868987h03e4.png",
    "autor": "Erakogu",
    "vastused": {
      "tutvustus": "Artu Ellmann uurib füüsikalist geodeesiat, keskendudes Maa gravitatsioonivälja ja geoidi modelleerimisele nii maismaal kui ka merel. Tema teadustöö ühendab gravimeetria, satelliidiandmed ja loodud mudelid, et teisendada ellipsoidilised kõrgused täpseteks merepinna suhtes mõõdetud kõrgusteks.\n\nViimastel aastatel kasutab ta satelliitaltimeetriat ja masinõpet mere dünaamiliste protsesside prognoosimiseks, optimeerides meresõidu ohutust ja autonoomsete laevade liikumist. Samuti osales ta tuumikgrupi liikmena Läänemere riikide ühtse merekaardistusdaatumi BSCD2000 loomises ning panustas Eesti ametlike geoidimudelite (sh EST-GEOID2017) väljatöötamisse. Maa-ameti peadirektori asetäitjana vedas ta eest riikliku Geo3D strateegia loomist, et hõlbustada elukeskkonna 3D-modelleerimist ja ruumiandmeteenuste arengut.\n\nEllmann on Tallinna Tehnikaülikooli geodeesia tenuuriprofessor ja teedeehituse uurimisrühma juht. Ta esindab Eestit Rahvusvahelises Geodeesia Assotsiatsioonis ja Põhjamaade Geodeesiakomisjonis ning osaleb Euroopa Kosmoseagentuuri koostööprojektides.",
      "k1": "Esimesena tulevad meelde hetked, mil pikalt keerulisena tundunud probleem muutub arusaadavaks. Veel suurem rõõm on siis, kui saadud teadmist hakkavad teised kasutama. Et geodeesia tegeleb Maa kuju ja suuruse määratlemise, võib selleks kuluda aastaid. Esmalt tuleb mõista Maa ja selle gravitatsioonivälja seaduspärasusi, teha asjakohast andmehõivet, kohandada ja optimeerida teooriat ning seda valideerida. Tihti tuleb arvutusi korrata, kuni tulemus (minu puhul on selleks Maa kuju ehk geoidi täpne mudel, mida kasutatakse kõrguste määramise lähtepinnana) läbib kaasteadlaste kvaliteedikontrolli. Teadustööd motiveerib jätkama, kui teadustöö tulemusena väljatöötatud kasulik mudel võetakse laialdaselt kasutusse.\n\nTipphetkede kõrval meenub, mis mind seda põnevat teekonda ette võtma ajendas. See oli endale teadvustamine, et magistritasemel haridus ning sellele järgnenud seitse aastat inseneritöö kogemust uurimisinstituudis ja avalikus sektoris ei ole enam piisavad mulle huvipakkuva järgmise eesmärgi saavutamiseks. Soovisin nimelt 1990. aastatel teada saada, kuidas oleks võimalik toona alles levima hakanud GPS-tehnoloogiat lisaks asukohamäärangule kasutada ka täpseks kõrgusmääranguks, et asendada ajamahukas ja kallis traditsiooniline nivelleerimine. Äratundmishetk saabus siis, kui tõdesin varasemate mõtlejate eeskujul, et pole midagi praktilisemat kui hea teooria. Selleks ajaks oli selgeks saanud ka see, et toonane geoidi modelleerimise teooria vajas ajakohastamist, et tagada senisest suurusjärgu võrra täpsemate tulemuste saavutamine.\n\nNii oligi üks minu elu määranud otsuseid 2000. aastal Stockholmi Kuninglikku Tehnikaülikooli (KTH) doktorantuuri astumine. See tähendas kodumaal väljakujunenud elust-olust lahkumist ja uuesti koolipinki  asumist. Doktoriõpingud Rootsis ja väitekirja kaitsmine 2004. aastal ning sellele järgnenud teadustöö Kanadas avardasid arusaama sellest, kuidas head teadust tehakse. Vähemalt sama oluline oli Eestisse naasmine 2006. aastal: välismaal õpitu ja kogetu põhjal sai hakata kujundama kodumaist teadustööd ja õpetamist.\n\nÜhe esimese tipphetkena tooksin esile teoreetiliste geoidiuuringute jõudmise Eesti kõrgusmääramise praktikasse. Tulemusena 2011 a ja 2017 a valminud riiklikud geoidimudelid seovad moodsa satelliitpositsioneerimise tulemused kõrgustega, mida on vaja näiteks ehitatud keskkonna planeerimisel ja loomisel. See andis lõpuks lahenduse probleemile, mis oli mind aastaid varem doktorantuuri viinud.\n\nViimati pakkus samasugust rahulolu osalemine Läänemere riikide merekaardistamise ja navigeerimise jaoks ühtse kõrgussüsteemi BSCD2000 (Baltic Sea Chart Datum 2000) loomises. See võimaldab viia eri riikide hüdrograafilised sügavusmõõtmised ühisesse referentssüsteemi. Paarisentimeetrise täpsusega meregeoidi kasutamine võimaldab rakendada GNSS-põhist täppispositsioneerimist ka hüdrograafias, pakkudes usaldusväärseid sügavusandmeid ja parendades seega navigatsiooniohutust. See on pikaajalise ja jätkuva rahvusvahelise koostöö tulemus, millesse minu teadusrühm panustas oluliselt.\n\nPraegu olen aga Eesti Teadusagentuuri rühmagrandi toel uurimas võimalust käsitleda kõrgusreferentsi dünaamilisena, mis kirjeldab paremini merepinna ruumilis-ajalist dünaamikat. See võimaldab merepinna muutuste kirjeldamist ja prognoosimist masinõppe meetoditega, ühendades geodeesia, satelliitaltimeetria, okeanograafia ja andmeteaduse võimalusi. Sellel on otsene rakendus  meresõidu ohutuse ja tõhususe parandamisel, võimaldades täpsemalt hinnata mereolusid, optimeerida laevade teekondi ning toetada avamere energiataristu asukoha, tehniliste lahenduste ja majandusliku tasuvuse hindamist. See loob ka vajalikud eeldused autonoomsete laevade kasutuselevõtuks Läänemere veeteedel. \n\n\nVõrdleksin teadusteed mäestikus järk-järgult kõrgemale kulgemisega. Teekonna alguses tulevad ette madalamad tipud. Nende vallutamisest saab innustust ja oskusi kõrgemate eesmärkide poole püüdlemiseks. Praegugi paistab ees veel kõrgemaid tippe, mille saavutamist hindan seni kogutud teadmiste ja oskustega jõukohaseks ning huvitavaks. Nendeni jõudmiseks tuleb taotleda konkurentsipõhiseid rahalisi vahendeid, osaleda rahvusvahelistes uurimisprojektides ning teha teadus- ja arenduskoostööd ettevõtetega. Suurim väljakutse on aga õigete oskustega kaaslaste leidmine või väljaõpetamine. Üksi kõrgeid tippe ei valluta, ei mägedes ega teaduses. Abiks on see, et aastate jooksul on kolleegide, kaasamõtlejate, üliõpilaste ja doktorantidega kujunenud uurimisrühm, kus lahendame üheskoos erinevaid uurimisküsimusi ja esilekerkivaid teadusprobleeme. Koos kulgemine julgustab nooremaid järgmiste tippudeni püüdlema ning annab neile teekonna jätkamisel parema lähtepositsiooni.\n\nVäga isiklikud teadusalased tipphetked on juhendatud doktorantide kaitsmised, mida nüüdseks on ühtekokku kogunenud 12. Nende väljaõpe on küll aeganõudev, kuid vajalik, sest teadustööks juhatuse andmine aitab neil ühiselt kujundatud teadusmõtet teatepulgana edasi viia. Rõõmustav on näha, kui endine juhendatav leiab lahendusi olulistele küsimustele ja õpetab juba järgmist põlvkonda. Minu juhendatud või kaasjuhendatud doktoritest on kolm valitud professoriks kolmes Eesti kõrgkoolis. Küllap neid tuleb juurdegi, kuivõrd mõned on praegu veel välismaa teaduskeskustes ja ülikoolides järeldoktorid. See annab tehtule pikema vaate kui ühe artikli ilmumine.\n\nKui aus olla, on suur osa eespool kirjeldatud tipphetkedest tõesti seotud tööga. Sellest ei järeldu, et eraelu tähenduslikud sündmused oleksid vähem olulised. Neid ma teadussaavutustega ühte pingeritta ei paneks. Tean väga hästi, et töö võib võtta kogu olemasoleva aja, kui seda lasta lubada. Huvitav töö ei vabasta vajadusest valida, millele oma aega anda. Ka teadlase elus peab jääma ruumi sellele, mille väärtust ei mõõdeta publikatsioonide ega projektidega.",
      "k2": "Geomaatika tegevusvaldkond tervikuna hõlmab erinevaid teaduslikke, administratiivseid, õiguslikke ja tehnilisi meetodeid ruumiinfo tootmiseks ja juhtimiseks vajalike ruumiandmete hõiveks ja haldamiseks. Teaduslikus plaanis on selleks vajalik ühtne koordinaat- ja kõrgussüsteem koos seda kinnistavate põhivõrkudega Eestis rajatud ning see on täpsuselt üks maailma parimaid. Meie jalge all olev maapind kerkib aga jääajajärgse maatõusu tõttu kuni 4 mm aastas ja ühtlasi liigub koos terve Euroopa kontinendiga kirdesuunaliselt 2,7 cm iga-aastaselt. Seetõttu tuleb neid liikumisi pidevalt teaduslikult jälgida ja arvesse võtta, et säilitada koordinaat- ja kõrgussüsteemi täpsus võimalikult pikaks ajaks. See annab võimaluse keskenduda ruumiandmete elukaart hõlmavate rakenduslike ülesannete lahendamisele, mis on geomaatika nähtav osa ühiskonnale. Teadus saab siin appi tulla – kuidas koguda, modelleerida ja ajakohastada suuremahulisi ruumiandmeid ning kuidas siduda heterogeensed vaatlusandmed ühtseks ruumiliseks infoks. \n\nSellest üldeesmärgist tulenevalt viiksin Eestis lõpuni ühtse, süsteemselt ja kindlate reeglite järgi ajas uuendatava kolmemõõtmelise (3D) ruumiandmestiku ning selle kasutamiseks vajalike digiteenuste väljaarendamise. Seda võib nimetada Eesti elu- ja looduskeskkonna digitaalseks kaksikuks.\n\nAvan seda vajadust pisut avaramalt, kuna geomaatika tegevusvaldkonna olulisus pole tavaliselt kuigi hästi paljude jaoks teadvustatud. Suur osa ühiskonnas ringlevast infost on otseselt või kaudselt asukohapõhine. Praktiline eesmärk on, et tee või sadama projekteerija, omavalitsuse planeerija ja üleujutusriski hindav spetsialist peaksid saama lähtuda samast kontrollitud ruumiandmestikust. Nii väheneks vajadus andmeid korduvalt koguda ning eri koordinaat- ja kõrgussüsteemidest pärinevaid andmeid käsitsi kokku sobitada. Eriti tähtsad on seni lahus käsitletud maismaa ja mere kokkupuutepiirkonnad: veetase, ranniku ja sadamarajatiste kõrgused ning mere sügavus peavad olema võrreldavad, kui tahame hinnata ranniku muutusi või kavandada turvalist taristut.\n\nSeega sõltuvad iga riigi majanduslik areng ning heaolu sotsiaal- ja keskkonnaküsimustes suuresti kvaliteetsetest ruumiandmetest. Transport, kaitse- ja päästevõimed, planeerimis- ja ehitustegevus, maaviljelus, metsatööstus – seda loetelu saab veelgi pikendada. Nendes valdkondades saab mõtestatult tegutseda vaid siis, kui on ligipääs usaldusväärsele ruumiinfole.\n\nDigitaalsete ruumiandmete ja GNSS-tehnoloogia üha paranev täpsus ning asjade interneti (IoT) areng võimaldavad juba üsna käegakatsutavas tulevikus juhita sõidukite laialdasemat kasutamist maanteedel. Samuti võimaldavad need edendada täppispõllumajandust ning droonide kasutamist suurt täpsust nõudvatel töödel. Ka tee-ehituses ja -hoolduses kasutatavad masinad vajavad kvaliteetset ja ajakohast ruumiinfot, tihtilugu reaalajas. Erisugused militaar- ja pakirobotid sõltuvad samuti suuresti ruumiandmete kvaliteedist. Nende ülesannete lahendamiseks tuleb jätkuvalt tagada kvaliteetsete ruumiandmete ja -teenuste kättesaadavus.\n\nVahendite tagamine keskse andmehõive läbiviimiseks on seega oluline. Nii saavad tekkida Eesti elu- ja looduskeskkonna arengut kajastavad aegread. Mida me täna ei mõõda, seda me ju homme ei tea.\n\nÜhiskonna jaoks on oluline, et eri allikatest ja ajastutest pärinevad ruumiandmed sobiksid omavahel kokku ning usaldusväärsete andmete põhjal saaks teha teadlikke majandus- ja arenguotsuseid. Oluline on terviku toimimine: maapind, hooned, tehnovõrgud, merepõhi ja nende muutused peaksid olema seotud ühise asukoha- ja kõrgussüsteemiga, mis võimaldab eri allikatest pärinevate andmete ristkasutamist ning andmeteenuste loomist.\n\nAndmete kuvamise ja allalaadimise teenused on samuti kriitiliselt vajalikud, sest nende kaudu jõuavad andmed süsteemsel kujul otsustajateni. Erinevad virtuaal- ja liitreaalsuse keskkonnad peaksid senisest rohkem võimaldama üheskoos kuvada 3D-hoonekujusid, taimestiku teisikuid ja maapinna kõrgusmudeleid koos muude asjakohaste andmekihtidega. See võimaldab anda sihtrühmadele realistliku ettekujutuse planeeringutega kavandatavatest muudatustest ning kiirendada otsuste vastuvõtmist.\n\nSelles osas on Eestis juba palju ära tehtud. Ligipääs ruumiandmetele võimaldab ka ääremaadel tegutsevatel ettevõtjatel, näiteks ehitus- ja hooldusettevõtetel ning taastuvenergeetika valdkonna ettevõtetel, teha konkurentsivõimelisi pakkumisi, ilma et paljudel juhtudel selleks peaks kohale sõitmagi. Asukohapõhiste teenuste areng nii avalikus kui ka erasektoris on olnud Eestis äärmiselt kiire ja edukas. Juba aastaid on välisriikide geomaatikud käinud meie kogemusi uurimas ja meetodeid üle võtmas.\n\nKuid loorberitele ei saa puhkama jääda. Hakkama tuleb saada ka üha suurenevate andmemahtudega, mida inimene enam töödelda ei suudagi. Seetõttu tuleb veelgi rohkem arendada tehisintellekti tööriistu ruumiandmete automatiseeritud tootmiseks ja otsinguks, aga ka maastikumuutuste tuvastamiseks kaardistamistöödes. Uute, eriti tehisarul põhinevate tärkavate tehnoloogiate juurutamine võib siin veel üllatavaid võimalusi pakkuda.\n\nSellise süsteemi kõige püsivam osa on pädevad inimesed, kes peaksid suunama ruumiandmete elukaare arenguid ja tegema erinevaid ruumianalüüse. Neid tuleb aga aastaid koolitada, seega tuleb geomaatika valdkonna spetsialistide järelkasvule tagada pikaajaline rahastus.\n\nMaailmas räägitakse minu meelest liiga palju sellest, mida tehisaru suudab andmete modelleerimise ja analüüsi juures automaatselt ära teha, ning liiga vähe sellest, kuidas tulemust sõltumatult kontrollida. Kasutan ka ise koos kolleegidega masinõpet meregeodeesia rakendustes merepinna muutuste ja veetaseme prognoosimisel ning näen selle võimalusi. Ent mudeli väljund ei näita veel veenvalt, et kui hästi see toimib ekstreemses olukorras või uues piirkonnas. Rohkem tähelepanu väärivad treening- ja lähteandmete päritolu, määramatus ja füüsikaline põhjendatus. Geomaatikas peab oskama vastata ka küsimusele, kui palju saadud tulemust võib usaldada ehk milline on selle täpsushinnang. See kipub tihti jääma tahaplaanile.\n\nKui nüüd Eestist kaugemale vaatamiseks läks, siis on viimastel aastatel hakanud järjest rohkem huvitama teadusprobleemid, mis kaasnevad Arktika võimaliku jääst vabanemise ning seal uute mereteede otsimise ja võimaliku kasutuselevõtuga. Globaalsete tarneahelate muutumisele kaasaaitamine tundub põneva teadusliku väljakutsena, mille lahendamiseks annab seni tehtud teadustöö tugeva aluse.",
      "k3": "Lähtuda tuleb sellest, et kriitiline viga tuleb teaduskirjanduses parandada. Lähedane kollegiaalne suhe teeb selle inimlikult raskemaks, kuid ei õigusta vaikimist ega teiste teadlaste eksiteele jätmist. Usaldus teaduse vastu sõltub ka sellest, kuidas me vigu tunnistame ja parandame. Oleme ju praegu tunnistajaks sellele, et tuhandeid juba avaldatud publikatsioone kutsutakse tagasi, neist mõned on ka Nobeli preemia laureaatide omad.\n\nTuleb eristada eksimist ja teadlikku varjamist. Küsimuses eeldatakse tahtlust ning päriselus vajab ka see tõendamist. Kõigepealt tuleb kontrollida omaenda arusaama veast. Geodeesias võivad näiliselt vastuoluliste tulemuste taga olla näiteks erinev kõrgussüsteem, mõõtmisaeg või kirjeldamata eeldus. Tuleb selgeks teha vea olemus  ja mõju põhijäreldustele. Vajadusel võib paluda kolmanda kolleegi sõltumatut eksperdihinnangut. \n\nSeejärel tuleb pöörduda eksinud kolleegi poole otse ja konfidentsiaalselt ning anda talle võimaluse selgitusteks. Ta peab võtma ühendust artikli avaldanud ajakirjaga. Parandus peab selgelt näitama, mis oli valesti ja milliseid järeldusi see muudab. Kui keskne tulemus enam ei kehti, võib olla vajalik artikli tagasivõtmine. Kui kolleeg probleemi lahendamiseks samme ei astu, tuleb endal pöörduda ajakirja toimetuse poole. Teadliku varjamise kahtluse korral teavitaksin ka teadusasutuse pädevat üksust, et asjaolusid saaks erapooletult uurida.\n\nKolleegi karjääri säästmiseks ei saa jätta vea tagajärgi nende kanda, kes tema tulemusi usaldavad. Lühiajaline mainekahju võib olla valus, kuid teadliku varjamise jätkumine kahjustaks valdkonna usaldusväärsust veel sügavamalt. \n\nMul on ka konkreetne kogemus teadusliku vea käsitlemisest, kuigi see ei anna alust rääkida teadlikust varjamisest. Tänavu kevadel avaldasid ühe sõsardistsipliini teadlased tippajakirjas Nature artikli, mis tekitas minu uurimisteemaga tegelevate geodeetide seas üle maailma imestust. Meie hinnangul olid autorid jätnud arvestamata geodeetilised tõsiasjad, mis muudavad oluliselt esitatud tulemusi ja järeldusi. Need olid jäänud märkamata ka retsensentidel, kuid avaldatud artiklit oli juba hakatud tsiteerima.\n\nArutasime olukorda kolleegidega ja võtsime esmalt ühendust autoritega. Nad vastasid, kuid ei pidanud osutatud puudusi oluliseks. Seejärel pöördusime ajakirja toimetuse poole, kes küsis autoritelt täiendavaid selgitusi. Kuna need meid ei veennud, koostasime Nature-le vastusartikli. See on praeguseks läbinud retsenseerimise ja ootab toimetuse otsust. Nii saab erimeelsuse tuua teaduslikku arutellu, kus otsustavaks peavad jääma tõendid ja põhjendused.",
      "k4": "Ma ei oskaks praegu geomaatika valdkonna akadeemiku tööd nende kahe sihtrühma vahel täpselt kaalutud osadeks jagada. Kui täpsustan ja optimeerin geoidi modelleerimise meetodeid, võib sellekohast teadusartiklit süvitsi lugeda üsna väike ring. Samale teadustulemusele toetuv kõrgusmääramine jõuab aga ehitajate ja projekteerijate igapäevatöösse. Osa teaduse ühiskondlikust mõjust sünnibki nii, et kasutaja ei pea teadma kõiki lahenduse taga olevaid võrrandeid, kuid rakendust peab tal olema võimalikult lihtne kasutada.\n\nTeadlasel peab säilima piisavalt aega süvenemiseks. Ka küsimused, millele kohe rakendust ei paista, väärivad uurimist. Füüsikalise geodeesia teoreetiline alus on võimaldanud luua praktilisi lahendusi, mille kasutusala ei pruukinud lähteülesannet püstitades veel nähtav olla. Sir George Gabriel Stokesi 1849. aastal avaldatud füüsikalise geodeesia fundamentaalne valem pidi oma rakendust ootama üle sajandi, enne kui selle kasutamiseks vajalikud sisendandmed üldse tekkisid. Ühiskonna teenimine hõlmab ka selliste teadmiste ja oskuste hoidmist, mida võib vaja minna alles tulevikus.\n\nAkadeemikult ootaksin tavalisest suuremat valmisolekut oma eriala tähendust selgitada ja ühiskonna küsimusi kuulata. Minu valdkonnas tähendab see näiteks arusaadavat vastust sellele, miks ei saa satelliitvastuvõtja näidatud kõrgust alati otse ehitustegevuses kasutada või millistel eeldustel saab hinnata merepinna tõusu mõju rannikule või meresügavustele. Teadusnõu peab aitama otsustajal mõista nii võimalusi kui ka piiranguid, ka vajaminevate ressursside osas.\n\nAvaliku suhtluse kõrval on väga konkreetne ühiskondlik panus õpetamine. Eestikeelne õpik, pädev insener ja iseseisvaks kasvanud teadusdoktor võivad mõjutada valdkonda kauem kui üks meediaesinemine. Olen pidanud oluliseks, et keerulistest tehnilistest küsimustest saaks Eestis täpselt rääkida ka eesti keeles. Nii osaleb teadmise loomises ja kasutamises laiem ring inimesi. Olen palju kordi tõdenud, et asja lihtne ja arusaadav selgitamine kõrvalisele inimesele nõuab lisaks väga põhjalikele teadmistele ka head üldistamisoskust.\n\nTeadlane võib olla ka arvamusliider. Piir muutub häguseks siis, kui teaduslik autoriteet hakkab asendama argumente või kui inimene esitab oma isikliku veendumuse uurimistulemuse pähe. Akadeemiku nimetus ei anna siiski pädevust kõigis küsimustes. Mõnikord on vastutustundlikum juhatada küsija paremini teadva kolleegi juurde.",
      "k5": "teadusvaldkonnale, mille esindajaid pole varem Eesti Teaduste Akadeemia liikmeks valitud. Selle tähtsust ei saa kuidagi üle hinnata. Eriti tähenduslik oleks teadmine, et minu ja kolleegide töö väärtust nähakse ka väljaspool erialaringi. Tunnustus kuuluks sisuliselt ka neile, kellega olen koos töötanud ja kellelt õppinud: juhendajatele, kolleegidele, doktorantidele ning koostööpartneritele. Minu jaoks annaks valimine kinnitust, et meie ühisel tööl on püsiv väärtus.\n\nÜhiskonna vajaduste tunnetamine ning valupunktidele leevenduse otsimine peaksid olema ka geomaatikas uute teadusküsimuste allikaks. Geomaatika tulemused on sageli ühiskonna toimimise osa, mida märgatakse alles siis, kui mõni asukoht, kõrgus või andmestik osutub valeks. Akadeemikuna saaksin selle valdkonna teaduslikku sisu, saavutusi ja vajadusi paremini nähtavaks teha. Ühtlasi peaksin leidma rohkem aega ruumiandmete kasutamist puudutavate otsuste sisuliseks nõustamiseks.\n\nKõige praktilisem uus võimalus oleks tihedam läbikäimine teiste valdkondade teadlastega. Ruumiandmeid vajavad väga erinevad erialad, kuid vajadused ja võimalused ei kohtu alati õigel ajal. Näen siin võimalust tuua geodeesia, mereteaduse, ehituse ja andmeteaduse teadmised ühiste küsimuste juurde ning aidata riigil teha pikema vaatega otsuseid. Näiteks olen viimased 15 aastat osalenud Eesti teaduse teekaardi objekti Eesti Keskkonnaobservatoorium töös, kus teevad valdkondadevahelist koostööd eri liiki keskkonnaandmeid koguvad maismaa-, mere- ja atmosfääriteadlased, keda toetavad geomaatikud Keskkonnaobservatooriumis tegutseb praegu kaks Teaduste Akadeemia liiget. Kui ühine teadustöö pakub neile akadeemiku tasemel väljakutseid, siis küllap pakub neid ka eri allikatest kogutud keskkonnaandmete ruumilise võrreldavuse ja usaldusväärsuse tagamine. Olengi kogenud, et kõige huvitavam ongi interdistsiplinaarne teadustöö.\n\nSamuti tahaksin, et noortel oleks Eestis põhjust geomaatikat õppida ja selles valdkonnas teadustööd jätkata. Küllap suur osa senistest kohustustest jätkuks ka edaspidi. Teadustöö kvaliteedi eest vastutamine, juhendamine, eestikeelse erialakirjanduse arendamine ja praktiliste probleemide lahendamine kuuluvad mu senisesse töösse. Lisanduks teadlikum vastutus Eesti teaduse kui terviku eest: valmisolek süveneda ka teiste valdkondade vajadustesse ning anda oma panus akadeemia ühisesse töösse. See eeldab kuulamist ja koostööd sama palju kui oma eriala eest seismist.\n\nPeaksin selleks ka oma ajakasutuses valikuid tegema. Eelkõige on mul tahtmine oma teadushuvi rahuldades ühiskonnale kasulik olla. Kuna aeg on piiratud ressurss, siis tuleb seda huvi ka suunata, keskendumaks küsimustele, mille lahendamisel saan oma teadmiste ja võimalustega kõige rohkem ära teha. Akadeemiku roll vajab päriselt aega ning seda ei saa lihtsalt kõigele senisele juurde liita. Tahaksin siiski säilitada vahetu sideme teadustöö ja juhendamisega, sest sealt tuleb minu panuse sisu. Akadeemikuna tahaksin aidata kaasa sellele, et Eestis loodud geomaatikateadmised leiaksid laiemat kasutust ja nende edasiarendamiseks oleks siin ka tulevikus pädevaid inimesi."

    "autor": "Merli Neito",
    "vastused": {
      "tutvustus": "Evelyn Uuemaa uurib suurte ruumiandmete analüüsi ja kvaliteeti, keskendudes uudsete ruumiandmemudelite ning ruumilise masinõppe arendamisele ja rakendamisele keskkonnaprotsessides. Ta ühendab oma teadustöös geoinformaatika, kaugseire ja masinõppe, et lahendada kliima- ja keskkonnaprobleeme.\n\nViimastel aastatel arendab ta 2023. aastal pälvitud Euroopa Teadusnõukogu (ERC) Consolidator Granti toel lahendusi intensiivpõllumajanduse keskkonnamõju vähendamiseks. Ta juhib kestliku maakasutuse tippkeskust, kus arendab ruumiandmete andmekuupi ning elurikkuse ja süsiniku sidumise ja emissiooni ruumilisi masinõppemudeleid. Uuemaa oli ka rahvusvaheliste geoinformaatika konverentside FOSS4G Europe (2024) ja AGILE (2026) Eestisse toomise peamine eestvedaja.\n\nUuemaa on Tartu Ülikooli geoinformaatika professor ja geoinformaatika ja kartograafia õppetooli juhataja. Teda on tunnustatud Tartu Ülikooli aumärgiga ning valitud ülikooli 100 silmapaistva teadlase hulka.",
      "k1": "Tööalaselt on üks eredamaid hetki kindlasti Marie Skłodowska-Curie individuaalgrandi saamine 2015. aastal. Kuigi olen nüüdseks saanud ka ERC grandi, mis on teadlaskarjääris kahtlemata üks suurimaid saavutusi, on Marie Curie grant minu jaoks siiski kuidagi erilisem. See oli minu esimene iseseisvalt võidetud teadusgrant, mis võimaldas mul minna järeldoktorantuuri Uus-Meremaale. Seal saadud kogemused panid suuresti aluse minu edasisele teadlaskarjäärile, sealhulgas ERC grandi saamisele.\n\nTööväliselt on minu elu suurimaks rõõmuks ja saavutuseks kindlasti minu neli supertublit last. Eriti suurt hea meelt teeb asjaolu, et üks lastest soovib samuti teadlaseks saada hoolimata sellest, et ta näeb, kui palju tööd see amet tähendab.",
      "k2": "Kui raha ja bürokraatia poleks probleem, siis looksin Eestis süsteemi, kus ühe valdkonna ruumiandmeid toodetakse ja hallatakse koordineeritult, ühes kohas ja kvaliteetselt. Praegu kulutatakse sageli palju ressursse samade või väga sarnaste andmete korduvale loomisele, kuid tulemused on erineva kvaliteedi, vormingu ja metoodikaga. Meil on küll palju andmeid juba keskselt koordineeritud maa- ja ruumiametis, aga on väga palju andmeid, mida toodetakse topelt erinevates asutustes, näiteks veekogude ja teede andmed. Kõige hullem on veel see, et erinevates asutustes toodetud andmed on erinevad, nt jõed ei ole samas kohas. See teeb andmete kooskasutamise keeruliseks, raiskab aega ja raha ning tekitab tihti segadust, et mis on siis õige versioon tegelikkusest.\n\nMaailmas räägitakse praegu minu meelest liiga palju tehisarust üldiselt ning minu valdkonnas eriti keerukatest masinõppemeetoditest. Mitmete ülesannete puhul on näidatud, et suhteliselt lihtsad klassikalised statistilised meetodid võivad anda sama häid või isegi paremaid tulemusi kui keerukad tehisarumudelid, mille arendamine ja kasutamine nõuab oluliselt rohkem arvutusressurssi. Vahel tundub, et oleme rohkem huvitatud sellest, kui uudne ja keeruline on kasutatav meetod, kui sellest, kas see aitab meil tegelikult midagi paremini mõista või lahendada.\n\nLiiga vähe räägime aga andmete kvaliteedist, mudelite usaldusväärsusest ja sellest, kas saadud tulemused ka looduses toimuvate protsessidega kooskõlas on. Minu jaoks on oluline, et me ei toodaks lihtsalt üha ilusamaid kaarte ja keerukamaid mudeleid, vaid mõistaksime ka, mida need näitavad ja kui palju saame neid usaldada.",
      "k3": "Kõigepealt räägiksin kolleegiga ja püüaksin mõista, kuidas selline olukord tekkis. Seejärel üritaksin teda veenda, et ta võtaks ise ühendust ajakirjaga ja algataks artikli ametliku parandamise. Teaduses on vigade parandamine tavapärane ja vajalik osa teadusprotsessist ning vea tunnistamine on tegelikult pigem hea praktika. Vigu tuleb teaduses üsna sageli ette ja olen ise samuti pöördunud ajakirja poole, et mõni hiljem avastatud viga artiklis ära parandada.",
      "k4": "Minu teadusvaldkond on väga praktiline ja seetõttu kipun arvama, et kogu teadus peaks ühel või teisel moel olema suunatud ühiskonna hüvanguks. See ei tähenda, et igal teadustööl peaks olema kohene praktiline väljund, kuid iga teadlane peaks suutma selgitada, miks tema uurimistöö on ühiskonnale oluline. Samuti leian, et teadlasena peame olema valmis oma eriala seisukohti avalikult selgitama, põhjendama ja vajadusel kaitsma. Selles mõttes võiks iga teadlane olla oma valdkonnas arvamusliider.\n\nOluline on muidugi, et teadlane jääks oma pädevuse piiridesse ning eristaks teaduspõhiseid seisukohti isiklikest arvamustest. Iseasi, kui palju on teadlastel selleks aega, oskusi ja julgust. Mulle tundub, et viimastel aastatel on Eestis üha rohkem teadlasi hakanud ühiskondlikku arutellu panustamist oluliseks pidama. Samas võiksime senisest rohkem tähelepanu pöörata ka noorteadlaste ettevalmistamisele, et nad oskaksid ja julgeksid oma valdkonna avalikes aruteludes kaasa lüüa.",
      "k5": "Akadeemiku tiitel oleks mulle kindlasti suur au ja tunnustus, kuid see ei ole kunagi olnud minu jaoks eesmärk omaette. Mul on tegelikult väga hea meel juba selle üle, et minu valdkonda, geomaatikat, on peetud piisavalt oluliseks, et sellele Eesti Teaduste Akadeemias koht luua.\n\nAkadeemiku tiitel tähendab minu jaoks kindlasti suuremat vastutust oma valdkonna arengu ja ühiskonnas nähtavaks tegemise eest. Samas on need teemad mulle juba praegu olulised ning püüan neisse panustada nii palju kui võimalik."

    "autor": "Railo Adson",
    "vastused": {
      "tutvustus": "Margus Pedaste uurib haridusinnovatsiooni, keskendudes uurimuslikule õppele, tehnoloogiate rakendamisele ja digipädevuse hindamisele. Ta arendab e-õppekeskkondi ja robootika kasutusvõimalusi, pakkudes raamistikke vastutustundliku teaduse ning probleemipõhise õppimise integreerimiseks koolidesse.\n\nViimastel aastatel panustab ta haridusjuhtimisse ning analüüsib tehisaru, virtuaalreaalsuse ja personaalsete õpiteede rakendamist haridusmudelites. Samuti suunab ta riiklike tasemetööde arengut, osaleb õpetajate kutsestandardite uuendamisel ning tegutseb OECD ja ASEF-i hariduseksperdina. Pedaste koordineeris Euroopa Komisjoni projekti Ark of Inquiry ning tema 2015. aasta teadusartikkel on valdkonnas maailma üks viidatumaid.\n\nPedaste on Tartu Ülikooli haridusinnovatsiooni professor ja haridusteaduste instituudi juhataja. Ta pälvis Valgetähe IV klassi teenetemärgi ning tegutseb Eesti Teaduste Akadeemia hariduskomisjoni aseesimehena.",
      "k1": "Tipphetki on mitut liiki.\n\nTööga seonduvalt on eriliselt hea tunne, kui järjekordne doktorant jõuab kaitmiseni. Läbi nende tõuseb meie ühine võimekus maailma muuta – nii Eestis kui ka rahvusvaheliselt. Supertunne on ka siis, kui endale väga südamelähedane ja oluline tunduv teadusartikkel võetakse avaldamisele või järjekordne teadusprojekti idee saab tihedas konkurentsis rahastuse. Näiteks eriti on meelde jäänud see, kui Hiinas Hainani saarel taifuuni tõttu kinni olles tuli teade, et saime Euroopa komisjoni rahastuse projektile \"Uuringulaegas\" – äralõigatuna tuli nädala jooksul saada kontakt ja kinnitused 13 partnerilt 12 Euroopa riigist.\n\nEraeluliselt on tipphetked seotud minu pere ja rahvaspordiga. Kes siis ei oleks õnne tipul, kui tütar või poeg lõpetab kooli ja neil läheb oma unistuste saavutamisel hästi? Ma olen õnnelik, et täna on mu tütar ja poeg mõlemad Tartu Ülikooli üliõpilased ja poeg on saanud ka väärtusliku kogemuse Ameerika Ühendriikide ülikoolis. Samas on endorfiinid selgelt laes ka iga kord, kui finišeerid täispika Ironmani võistlusel või oma kolleegidega koos ühel või teisel võistkonnavõistlusel. Näiteks sel suvel lõpetasime rasketes ilmaoludes edukalt Tallinna 70.3 Ironmani teatevõistluse.",
      "k2": "Ma korraldaks koostöös kolleegidega Eestis koolivõrgu ja hariduse rahastamise oluliselt ümber nii, et iga õpilane saaks päriselt väga hea hariduse. See võimaldaks igas umbes 15–20-õpilasega klassiruumis toimetada kahel täiskasvanul, kes toetavad noorte kujunemist enesejuhtivatekse. See tähendab, et igaüks kujuneb agentseks inimeseks, kes mitte ainult ei kohane maailmaga, vaid kujundab ise ja teistega koos tuleviku maailma selliseks, kus hoolime iseendast, teistest ja keskkonnast.",
      "k3": "Eetika, sh teaduseetika, on minu jaoks väga tähtsal kohal. Kui tegu on hea kolleegiga, siis otsustame ilmselt üheskoos, mida ja kuidas teha. Ju olen juba aru saanud, mis põhjustel viga tekkis, milles seisneb selle kriitilisus ja miks seda varjati.\n\nIgal juhul lähtun siingi minu jaoks olulisest väärtusest – hoolimisest. See tähendab hoolimist kõigist, kes on juba lugenud või võivad edasiselt lugeda artiklit või teha koostööd mu kolleegiga, aga hoolimist ka mu kolleegist. Viga on viga. Varajamine on ka viga. Seda ei saa eitada. Viga tuleb parandada ja asjakohastele osapooltele selle leidmisest teada anda. Samas õpime vigadest ja eksimine on inimlik. Usun, et ka mu kolleeg õpib sellest ja saame koos edasi liikuda.",
      "k4": "On levinud ütlus, et pole midagi praktilisemat kui hea teadus. Seega iga akadeemiku töö peaks olema samaaegselt suunatud nii kolleegidele kui ka ühiskonnale. Akadeemikud on eelkõige teadlased, kes lahendavad probleeme. Haridusteadlasena lahendan hariduselu probleeme, mis on ühiskonnas tõusnud või tõusmas. Tõsi, iga probleemi lahendamiseks ei pea korraldama uut uuringut.\n\nTeadlase, sh akadeemiku, põhjendatud arutlusele tuginev arvamus on juba iseenesest oluline sisend otsuste tegemiseks. Omaette küsimus on see, kes kedagi üleval peab. Mina väldiks oma ökoloogi hariduse taustast tulenevalt üldse sellist kõnepruuki. Loodusökosüsteemiga samamoodi on ka ühiskonnas kui ökosüsteemis kõik omavahel seotud. Keegi ei pea kedagi üleval, vaid igaühel on oma tähtis nišš. Vaid üheskoos suudame hoida maailmas tasakaalu.",
      "k5": "Akadeemia roll on tõstatada ühiskonnas olulisi küsimusi, innustada nende arutelu, uurimist ja lahenduste leidmist. Haridusteaduste valdkonnas ei ole sel sajandil olnud Eestis ühtegi akadeemikut. Seega annaks sellesse rolli valimine mulle või ükskõik kellele valitutest võimaluse ja vastutuse tõstatada haridusteaduste küsimusi veelgi tugevamalt Eesti Teaduste Akadeemia interdistsiplinaarses kogukonnas ja seeläbi laiemalt kogu meie ühiskonnas.\n\nJah, olen seda rolli püüdnud praegugi täita, muuhulgas Eesti Teaduste Akadeemia hariduskomisjoni aseesimehena, kuid akadeemikuna on võimalik seda veelgi mõjusamalt teha."
