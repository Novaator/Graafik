<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murdude Meistriklass (6. klass)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective {
            perspective: 1000px;
        }
        .flip-card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
        .tab-active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 text-center flex items-center justify-center gap-2">
                <span>🍕</span> Murdude Meistriklass <span>🧠</span>
            </h1>
            <p class="text-center text-slate-500 text-sm mt-1">6. klassi interaktiivne õpimootor</p>
            
            <div class="flex justify-center mt-6 border-b border-slate-200">
                <button id="tab-cards" class="px-6 py-2 tab-active transition-colors hover:bg-slate-50" onclick="switchTab('cards')">Õpikaardid</button>
                <button id="tab-exercises" class="px-6 py-2 text-slate-600 transition-colors hover:bg-slate-50" onclick="switchTab('exercises')">Ülesanded</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <section id="view-cards" class="block">
            <!-- Moodulite valik -->
            <div class="flex flex-wrap gap-2 justify-center mb-8" id="module-filters">
                <!-- Nupud genereeritakse JS-iga -->
            </div>

            <!-- Kaardi konteiner -->
            <div class="flex flex-col items-center">
                <div class="mb-4 text-sm font-semibold text-slate-500 uppercase tracking-wider" id="card-topic">Teema 1.2</div>
                
                <div class="perspective w-full max-w-md h-80 cursor-pointer flip-card" id="flashcard" onclick="flipCard()">
                    <div class="flip-card-inner relative w-full h-full shadow-lg rounded-2xl">
                        <!-- Esikülg -->
                        <div class="flip-card-front absolute w-full h-full bg-white border-2 border-slate-100 rounded-2xl p-8 flex flex-col justify-center items-center text-center">
                            <span class="absolute top-4 right-4 text-3xl opacity-20">❓</span>
                            <h3 class="text-xl md:text-2xl font-medium text-slate-800" id="card-question">Küsimus laeb...</h3>
                            <p class="text-slate-400 mt-6 text-sm absolute bottom-4">Vajuta, et pöörata</p>
                        </div>
                        <!-- Tagakülg -->
                        <div class="flip-card-back absolute w-full h-full bg-blue-50 border-2 border-blue-200 rounded-2xl p-8 flex flex-col justify-center items-center text-center">
                            <span class="absolute top-4 right-4 text-3xl opacity-20">💡</span>
                            <div class="text-lg md:text-xl text-slate-800 leading-relaxed" id="card-answer">Vastus laeb...</div>
                        </div>
                    </div>
                </div>

                <!-- Navigeerimine -->
                <div class="flex items-center gap-4 mt-8">
                    <button onclick="prevCard()" class="p-3 rounded-full bg-white shadow hover:bg-slate-50 transition active:scale-95 text-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
                    </button>
                    <div class="text-slate-500 font-medium" id="card-counter">1 / 10</div>
                    <button onclick="nextCard()" class="p-3 rounded-full bg-white shadow hover:bg-slate-50 transition active:scale-95 text-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
                    </button>
                </div>
            </div>
        </section>

        <section id="view-exercises" class="hidden">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Harjutusülesanded</h2>
                <p class="text-slate-500 mt-2">Iga teema kohta 7 näidisülesannet kinnistamiseks. Kliki teemal, et näha ülesandeid.</p>
            </div>
            
            <div id="exercises-container" class="space-y-4">
                <!-- Ülesanded genereeritakse JS-iga -->
            </div>
        </section>

    </main>

                        a: "<strong>Murru põhiomadus:</strong> kui korrutad või jagad lugejat ja nimetajat *täpselt sama* arvuga (v.a 0), jääb murru väärtus samaks.<br><br>(1·2) / (2·2) = 2/4. Lõikasid pitsa lihtsalt väiksemateks tükkideks.",

                            "Taanda samm-sammult murd 12/24 lõpuni (taandamatuks murruks).",

                            "Taanda lõpuni: 18/27",
                            "Taanda lõpuni: 24/36",
                            "Taanda lõpuni: 20/50",
                            "Taanda lõpuni: 30/45",
                            "Millist murdu ei saa enam taandada? a) 4/8, b) 3/6, c) 2/5."

                    }
                ]
            },
            {
                module: "III: Ühine keel ja võrdlemine",
                id: "mod-3",
                cards: [
                    {

                        q: "Miks me ei saa otse võrrelda murde 1/2 ja 1/3?",
                        a: "Sest tükid (nimetajad) on erineva suurusega. Õunu ja pirne ei saa otse võrrelda koguse põhjal.<br><br>Peame need tegema sama suureks ehk viima <strong>ühisele nimetajale</strong>.",

                        a: "1. Uus nimetaja on vanade korrutis: 3 · 4 = 12.<br>2. 1. murru laiendaja on 2. nimetaja (4).<br>3. 2. murru laiendaja on 1. nimetaja (3).<br><br>Tulemus: <strong>8/12</strong> ja <strong>9/12</strong>.",

                            "Vii ühisele nimetajale kiire meetodiga: 1/2 ja 1/3",

                            "Vii ühisele nimetajale: 4/9 ja 1/2"
                        ]
                    },
                    {
                        topic: "1.11 Ühine nimetaja (VÜK)",
                        q: "Viime 1/6 ja 3/8 ühisele nimetajale. Kuidas hoida numbrid väikesed?",
                        a: "1. Otsi vähimat ühiskordset (VÜK) – väikseimat arvu, mis jagub nii 6 kui 8-ga. See on <strong>24</strong>.<br>2. Laiendajate leidmiseks jaga 24 vanade nimetajatega.<br>3. (24:6=4 ja 24:8=3).<br><br>Tulemus: <strong>4/24</strong> ja <strong>9/24</strong>.",

                            "Kumba meetodit on kasulikum kasutada murdude 1/20 ja 3/40 puhul: korrutist või VÜK-i?"

                    },
                    {
                        topic: "1.12 Võrdlemine (Reegel)",
                        q: "Kumb on suurem, kas 5/7 või 4/7? Mis on reegel?",
                        a: "Kui nimetajad (tükkide suurused) on samad, vaata <strong>lugejat</strong>. Kellel on lugeja suurem, see on suurem.<br><br><strong>5/7 > 4/7</strong> (5 tükki on ilmselgelt rohkem kui 4 tükki sama suurt pitsat).",
                        exercises: [
                            "Kumb on suurem: 3/5 või 4/5?",
                            "Kumb on suurem: 7/10 või 3/10?",

                            "Pane märk (>, <, =): 6/7 ... 2/7",
                            "Pane märk (>, <, =): 9/11 ... 10/11",

                            "Miks on 13/20 suurem kui 11/20? Põhjenda ühe lausega."

                    },
                    {
                        topic: "1.13 Võrdlemine (Rist)",
                        q: "Kuidas võrrelda kähku 3/5 ja 4/7 ilma uusi murde välja kirjutamata?",
                        a: "Korruta risti: esimese lugeja teise nimetajaga ja vastupidi.<br><br>Vasakul: 3 · 7 = 21.<br>Paremal: 4 · 5 = 20.<br><br>Kuna 21 > 20, siis <strong>3/5 > 4/7</strong>.",
                        exercises: [

        ];

        let currentModuleIndex = 0;
        let currentCardIndex = 0;
        let isFlipped = false;

        // Abifunktsioon murdude ilusamaks renderdamiseks tekstis
        function parseTextToFractions(text) {
            // Asendab kujul N/M murrud veidi ilusama HTML kujundusega
            return text.replace(/(\d+)\/(\d+)/g, '<span class="font-bold text-blue-700 mx-1">$1/$2</span>');
        }

        function initApp() {
            renderModuleFilters();
            renderExercises();
            loadCard(0);
        }

        function renderModuleFilters() {
            const container = document.getElementById('module-filters');
            container.innerHTML = '';
            
            appData.forEach((mod, idx) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-full text-sm font-medium transition-colors ${idx === currentModuleIndex ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`;
                btn.innerText = mod.module;
                btn.onclick = () => {
                    currentModuleIndex = idx;
                    currentCardIndex = 0;
                    if(isFlipped) flipCard();
                    renderModuleFilters();
                    loadCard(0);
                };
                container.appendChild(btn);
            });
        }

        function loadCard(index) {
            const cards = appData[currentModuleIndex].cards;
            if (index < 0) currentCardIndex = cards.length - 1;
            else if (index >= cards.length) currentCardIndex = 0;
            else currentCardIndex = index;

            const card = cards[currentCardIndex];
            
            // Juhul kui kaart on ümber pööratud, pööra tagasi enne uue laadimist
            if (isFlipped) {
                const cardEl = document.getElementById('flashcard');
                cardEl.classList.remove('flipped');
                isFlipped = false;
                
                // Oota animatsiooni lõppu, siis vaheta sisu
                setTimeout(() => {
                    updateCardDOM(card, cards.length);
                }, 300);
            } else {
                updateCardDOM(card, cards.length);
            }
        }

        function updateCardDOM(card, totalCards) {
            document.getElementById('card-topic').innerText = card.topic;
            document.getElementById('card-question').innerHTML = parseTextToFractions(card.q);
            document.getElementById('card-answer').innerHTML = parseTextToFractions(card.a);
            document.getElementById('card-counter').innerText = `${currentCardIndex + 1} / ${totalCards}`;
        }

        function flipCard() {
            const cardEl = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardEl.classList.add('flipped');
            } else {
                cardEl.classList.remove('flipped');
            }
        }

        function nextCard() {
            loadCard(currentCardIndex + 1);
        }

        function prevCard() {
            loadCard(currentCardIndex - 1);
        }

        function renderExercises() {
            const container = document.getElementById('exercises-container');
            container.innerHTML = '';

            appData.forEach((mod, modIdx) => {
                // Mooduli pealkiri
                const modTitle = document.createElement('h3');
                modTitle.className = 'text-xl font-bold text-slate-700 mt-8 mb-4 border-b pb-2';
                modTitle.innerText = mod.module;
                container.appendChild(modTitle);

                mod.cards.forEach((card, cardIdx) => {
                    // Akordioni element
                    const accItem = document.createElement('div');
                    accItem.className = 'bg-white border border-slate-200 rounded-lg overflow-hidden';
                    
                    const header = document.createElement('button');
                    header.className = 'w-full px-6 py-4 text-left font-medium text-slate-800 bg-slate-50 hover:bg-slate-100 transition-colors flex justify-between items-center';
                    header.innerHTML = `<span>${card.topic}</span><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-slate-400 transform transition-transform duration-200" id="icon-${modIdx}-${cardIdx}"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>`;
                    
                    const body = document.createElement('div');
                    body.className = 'hidden px-6 py-4 border-t border-slate-100 bg-white';
                    body.id = `body-${modIdx}-${cardIdx}`;

                    const ol = document.createElement('ol');
                    ol.className = 'list-decimal list-inside space-y-2 text-slate-600';
                    card.exercises.forEach(ex => {
                        const li = document.createElement('li');
                        li.innerHTML = parseTextToFractions(ex);
                        ol.appendChild(li);
                    });
                    
                    body.appendChild(ol);

                    // Akordioni avamise loogika
                    header.onclick = () => {
                        const isHidden = body.classList.contains('hidden');
                        const icon = document.getElementById(`icon-${modIdx}-${cardIdx}`);
                        
                        // Sulge kõik teised
                        document.querySelectorAll('[id^="body-"]').forEach(el => el.classList.add('hidden'));
                        document.querySelectorAll('[id^="icon-"]').forEach(el => el.classList.remove('rotate-180'));

                        if (isHidden) {
                            body.classList.remove('hidden');
                            icon.classList.add('rotate-180');
                        }
                    };

                    accItem.appendChild(header);
                    accItem.appendChild(body);
                    container.appendChild(accItem);
                });
            });
        }

        function switchTab(tab) {
            const cardsTab = document.getElementById('tab-cards');
            const exercisesTab = document.getElementById('tab-exercises');
            const cardsView = document.getElementById('view-cards');
            const exercisesView = document.getElementById('view-exercises');

            if (tab === 'cards') {
                cardsTab.classList.add('tab-active', 'text-blue-600');
                cardsTab.classList.remove('text-slate-600');
                exercisesTab.classList.remove('tab-active', 'text-blue-600');
                exercisesTab.classList.add('text-slate-600');
                
                cardsView.classList.remove('hidden');
                exercisesView.classList.add('hidden');
            } else {
                exercisesTab.classList.add('tab-active', 'text-blue-600');
                exercisesTab.classList.remove('text-slate-600');
                cardsTab.classList.remove('tab-active', 'text-blue-600');
                cardsTab.classList.add('text-slate-600');
                
                exercisesView.classList.remove('hidden');
                cardsView.classList.add('hidden');
            }
        }

        // Käivita rakendus
        window.onload = initApp;

        // Lisa klaviatuuri tugi (nooled navigeerimiseks, tühik pööramiseks)
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('view-cards').classList.contains('hidden')) return; // Ainult kaartide vaates
            
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });
    </script>
</body>
</html>
