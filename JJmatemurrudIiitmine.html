<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murdude Meistriklass: Liitmine ja Lahutamine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective { perspective: 1000px; }
        .flip-card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .flip-card-back { transform: rotateY(180deg); }
        .tab-active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }
        .exercise-answer { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 text-center flex items-center justify-center gap-2">
                <span>🍕</span> Liitmine ja Lahutamine <span>🥷</span>
            </h1>
            <p class="text-center text-slate-500 text-sm mt-1">6. klassi interaktiivne õpimootor (Osa 2)</p>
            
            <div class="flex justify-center mt-6 border-b border-slate-200">
                <button id="tab-cards" class="px-6 py-2 tab-active transition-colors hover:bg-slate-50" onclick="switchTab('cards')">Õpikaardid</button>
                <button id="tab-exercises" class="px-6 py-2 text-slate-600 transition-colors hover:bg-slate-50" onclick="switchTab('exercises')">Ülesanded (vastustega)</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <section id="view-cards" class="block">
            <div class="flex flex-wrap gap-2 justify-center mb-8" id="module-filters"></div>

            <div class="flex flex-col items-center">
                <div class="mb-4 text-sm font-semibold text-slate-500 uppercase tracking-wider" id="card-topic">Laeb...</div>
                
                <div class="perspective w-full max-w-lg h-96 cursor-pointer flip-card" id="flashcard" onclick="flipCard()">
                    <div class="flip-card-inner relative w-full h-full shadow-lg rounded-2xl">
                        <div class="flip-card-front absolute w-full h-full bg-white border-2 border-slate-100 rounded-2xl p-6 md:p-8 flex flex-col justify-center items-center text-center">
                            <span class="absolute top-4 right-4 text-3xl opacity-20">❓</span>
                            <h3 class="text-xl md:text-2xl font-medium text-slate-800 leading-relaxed" id="card-question">Küsimus laeb...</h3>
                            <p class="text-slate-400 mt-6 text-sm absolute bottom-4">Vajuta, et pöörata</p>
                        </div>
                        <div class="flip-card-back absolute w-full h-full bg-blue-50 border-2 border-blue-200 rounded-2xl p-6 md:p-8 flex flex-col justify-center items-center text-center overflow-y-auto">
                            <span class="absolute top-4 right-4 text-3xl opacity-20">💡</span>
                            <div id="card-img-back" class="mb-4 w-full flex justify-center items-center flex-wrap gap-2 min-h-[80px]"></div>
                            <div class="text-base md:text-lg text-slate-800 leading-relaxed" id="card-answer">Vastus laeb...</div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-4 mt-8">
                    <button onclick="prevCard()" class="p-3 rounded-full bg-white shadow hover:bg-slate-50 transition active:scale-95 text-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
                    </button>
                    <div class="text-slate-500 font-medium" id="card-counter">1 / 10</div>
                    <button onclick="nextCard()" class="p-3 rounded-full bg-white shadow hover:bg-slate-50 transition active:scale-95 text-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
                    </button>
                </div>
            </div>
        </section>

        <section id="view-exercises" class="hidden">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Harjutusülesanded</h2>
                <p class="text-slate-500 mt-2">Lahenda iseseisvalt ja vajuta silma-ikoonile, et kontrollida lõppvastust. (Vastused on alati taandatud kujul!)</p>
            </div>
            
            <div id="exercises-container" class="space-y-4"></div>
        </section>

    </main>

        function drawPizza(slices, filled, size = 60) {
            if (slices === 1) return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="drop-shadow-sm"><circle cx="${size/2}" cy="${size/2}" r="${size/2 - 2}" fill="${filled > 0 ? '#fbbf24' : '#fef3c7'}" stroke="#d97706" stroke-width="2"/></svg>`;
            
            let paths = '';
            const cx = size/2; const cy = size/2; const r = size/2 - 2;
            
            for(let i=0; i<slices; i++) {
                const startAngle = (i * 360 / slices - 90) * (Math.PI / 180);
                const endAngle = ((i + 1) * 360 / slices - 90) * (Math.PI / 180);
                
                const x1 = cx + r * Math.cos(startAngle);
                const y1 = cy + r * Math.sin(startAngle);
                const x2 = cx + r * Math.cos(endAngle);
                const y2 = cy + r * Math.sin(endAngle);
                
                const largeArc = 0;
                const fill = i < filled ? '#fbbf24' : '#fef3c7';
                paths += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${fill}" stroke="#d97706" stroke-width="1.5"/>`;
            }
            return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="drop-shadow-sm transform hover:scale-110 transition-transform">${paths}</svg>`;
        }

        let currentModuleIndex = 0;
        let currentCardIndex = 0;
        let isFlipped = false;

        function parseTextToFractions(text) {
            // Eraldab teksti sees murrud (nt 2/3 või 1 2/3) ja stiliseerib
            return text.replace(/(?:(\d+)\s+)?(\d+)\/(\d+)/g, (match, whole, num, den) => {
                if (whole) {
                    return `<span class="inline-flex items-baseline mx-1"><span class="font-bold text-slate-800 text-xl mr-0.5">${whole}</span><span class="font-bold text-blue-600 text-lg">${num}/${den}</span></span>`;
                }
                return `<span class="font-bold text-blue-600 text-lg mx-1">${num}/${den}</span>`;
            });
        }

        function initApp() {
            renderModuleFilters();
            renderExercises();
            loadCard(0);
        }

        function renderModuleFilters() {
            const container = document.getElementById('module-filters');
            container.innerHTML = '';
            
            appData.forEach((mod, idx) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-full text-sm font-medium transition-colors ${idx === currentModuleIndex ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`;
                btn.innerText = mod.module;
                btn.onclick = () => {
                    currentModuleIndex = idx;
                    currentCardIndex = 0;
                    if(isFlipped) flipCard();
                    renderModuleFilters();
                    loadCard(0);
                };
                container.appendChild(btn);
            });
        }

        function loadCard(index) {
            const cards = appData[currentModuleIndex].cards;
            if (index < 0) currentCardIndex = cards.length - 1;
            else if (index >= cards.length) currentCardIndex = 0;
            else currentCardIndex = index;

            const card = cards[currentCardIndex];
            
            if (isFlipped) {
                document.getElementById('flashcard').classList.remove('flipped');
                isFlipped = false;
                setTimeout(() => updateCardDOM(card, cards.length), 300);
            } else {
                updateCardDOM(card, cards.length);
            }
        }

        function updateCardDOM(card, totalCards) {
            document.getElementById('card-topic').innerText = card.topic;
            document.getElementById('card-question').innerHTML = parseTextToFractions(card.q);
            document.getElementById('card-answer').innerHTML = parseTextToFractions(card.a);
            
            const imgBack = document.getElementById('card-img-back');
            if (card.imgBack) {
                imgBack.innerHTML = card.imgBack;
                imgBack.classList.remove('hidden');
            } else {
                imgBack.innerHTML = '';
                imgBack.classList.add('hidden');
            }
            document.getElementById('card-counter').innerText = `${currentCardIndex + 1} / ${totalCards}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
        }

        function nextCard() { loadCard(currentCardIndex + 1); }
        function prevCard() { loadCard(currentCardIndex - 1); }

                    card.exercises.forEach((ex, exIdx) => {
                        const row = document.createElement('div');
                        row.className = 'flex justify-between items-center p-3 rounded-lg bg-slate-50 border border-slate-100 hover:border-slate-300 transition-colors';
                        
                        const qDiv = document.createElement('div');
                        qDiv.className = 'text-slate-700 font-medium';
                        qDiv.innerHTML = `<span class="text-slate-400 w-6 inline-block">${exIdx + 1}.</span> ${parseTextToFractions(ex.q)}`;
                        
                        const aDiv = document.createElement('div');
                        aDiv.className = 'flex items-center gap-3';
                        
                        const aText = document.createElement('div');
                        aText.className = 'hidden font-bold text-green-600 bg-green-50 px-3 py-1 rounded-md text-sm sm:text-base border border-green-200';
                        aText.id = `ans-${modIdx}-${cardIdx}-${exIdx}`;
                        aText.innerHTML = parseTextToFractions(ex.a);
                        
                        const toggleBtn = document.createElement('button');
                        toggleBtn.className = 'text-slate-400 hover:text-blue-600 transition-colors flex items-center justify-center p-2 rounded-full hover:bg-blue-50';
                        toggleBtn.title = 'Näita vastust';
                        toggleBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>`;
                        
                        toggleBtn.onclick = () => {
                            aText.classList.toggle('hidden');
                            if(!aText.classList.contains('hidden')) {
                                toggleBtn.classList.add('text-blue-600', 'bg-blue-50');
                            } else {
                                toggleBtn.classList.remove('text-blue-600', 'bg-blue-50');
                            }
                        };

                        aDiv.appendChild(aText);
                        aDiv.appendChild(toggleBtn);
                        
                        row.appendChild(qDiv);
                        row.appendChild(aDiv);
                        list.appendChild(row);
                    });
                    
                    body.appendChild(list);

                    header.onclick = () => {
                        const isHidden = body.classList.contains('hidden');
                        const icon = document.getElementById(`icon-${modIdx}-${cardIdx}`);
                        
                        // Close others
                        document.querySelectorAll('[id^="body-"]').forEach(el => el.classList.add('hidden'));
                        document.querySelectorAll('[id^="icon-"]').forEach(el => el.classList.remove('rotate-180'));

                        if (isHidden) {
                            body.classList.remove('hidden');
                            icon.classList.add('rotate-180');
                        }
                    };

                    accItem.appendChild(header);
                    accItem.appendChild(body);
                    container.appendChild(accItem);
                });
            });
        }

        function switchTab(tab) {
            const cardsTab = document.getElementById('tab-cards');
            const exercisesTab = document.getElementById('tab-exercises');
            const cardsView = document.getElementById('view-cards');
            const exercisesView = document.getElementById('view-exercises');

            if (tab === 'cards') {
                cardsTab.classList.add('tab-active', 'text-blue-600');
                cardsTab.classList.remove('text-slate-600');
                exercisesTab.classList.remove('tab-active', 'text-blue-600');
                exercisesTab.classList.add('text-slate-600');
                
                cardsView.classList.remove('hidden');
                exercisesView.classList.add('hidden');
            } else {
                exercisesTab.classList.add('tab-active', 'text-blue-600');
                exercisesTab.classList.remove('text-slate-600');
                cardsTab.classList.remove('tab-active', 'text-blue-600');
                cardsTab.classList.add('text-slate-600');
                
                exercisesView.classList.remove('hidden');
                cardsView.classList.add('hidden');
            }
        }

        window.onload = initApp;

        window.addEventListener('keydown', (e) => {
            if (document.getElementById('view-cards').classList.contains('hidden')) return;
            
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });
    </script>
</body>
</html>
