<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridži Tõenäosuste Arvutaja</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 space-y-6">
        <h1 class="text-xl font-bold text-gray-800 border-b pb-2">Bridži Tõenäosuste Arvutaja</h1>
        
        <div class="space-y-4">
            <!-- Minu andmed -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Minu käsi</label>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="hcp" placeholder="Minu HCP" value="13" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="number" id="dp" placeholder="Jaotuspunktid" value="0" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- Eesmärk -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Eesmärk (punktide kogusumma)</label>
                <input type="number" id="target" value="25" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Partneri vahemik -->
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <label class="block text-sm font-semibold text-blue-800 mb-2">Partneri oletatav HCP vahemik</label>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="p-min" placeholder="Min" value="0" class="w-full px-3 py-2 border rounded-lg outline-none">
                    <input type="number" id="p-max" placeholder="Max" value="40" class="w-full px-3 py-2 border rounded-lg outline-none">
                </div>
                <p id="range-limit-text" class="text-xs text-blue-600 mt-2">Max võimalik partneril: 27</p>
            </div>
        </div>

        <!-- Tulemus -->
        <div class="bg-gray-900 rounded-xl p-4 text-white">
            <p class="text-sm text-gray-400">Tõenäosus partneri käest vajalik kätte saada:</p>
            <div id="result" class="text-3xl font-bold text-blue-400 mt-1">-- %</div>
        </div>
    </div>

    <script>
        function updateUI() {
            const hcp = parseInt(document.getElementById('hcp').value) || 0;
            const dp = parseInt(document.getElementById('dp').value) || 0;
            const target = parseInt(document.getElementById('target').value) || 0;
            const pMinInput = document.getElementById('p-min');
            const pMaxInput = document.getElementById('p-max');
            
            // Loogika: Partneri max punktid ei saa ületada 40 - minu HCP
            const maxPartnerPoints = Math.max(0, 40 - hcp);
            
            // Piirangute jõustamine
            if (parseInt(pMaxInput.value) > maxPartnerPoints) {
                pMaxInput.value = maxPartnerPoints;
            }
            pMaxInput.max = maxPartnerPoints;
            document.getElementById('range-limit-text').innerText = `Max võimalik partneril: ${maxPartnerPoints}`;

            const pMin = parseInt(pMinInput.value) || 0;
            const pMax = parseInt(pMaxInput.value) || 0;

            // Arvutus
            calculateProbability(hcp, dp, target, pMin, pMax, maxPartnerPoints);
        }

        function calculateProbability(hcp, dp, target, pMin, pMax, maxPossible) {
            const neededForGeim = target - (hcp + dp);
            
            if (neededForGeim <= 0) {
                document.getElementById('result').innerText = "100%";
                return;
            }

            // Lihtsustatud tõenäosusmudel: normaaljaotuse lähendus
            // Keskmine punktide arv partneril on (40-hcp) / 3
            const mean = (40 - hcp) / 3;
            // Standardhälve bridžis on umbes 4.5
            const stdDev = 4.5;
            
            // Arvutame z-score'i vajaliku punktisumma jaoks
            const z = (neededForGeim - mean) / stdDev;
            
            // Normaaljaotuse tõenäosus (lihtsustatud ligikaudne väärtus)
            let prob = 0.5 - (0.5 * (Math.abs(z) * (1 + 0.049867347 * Math.abs(z) + 0.021141006 * Math.pow(z, 2) + 0.003277626 * Math.pow(z, 3) + 0.0000380036 * Math.pow(z, 4) + 0.0000488906 * Math.pow(z, 5) + 0.000005383 * Math.pow(z, 6))));
            if (z < 0) prob = 1 - prob;
            
            // Arvestame sisse partneri antud vahemiku (tinglik tõenäosus)
            // Kui vahemik on antud, piirame tulemust
            if (pMax > pMin) {
                // Kui vajalik punktisumma on väljaspool antud vahemikku
                if (neededForGeim > pMax) prob = 0;
                else if (neededForGeim <= pMin) prob = 1;
                else {
                    // Lineaarne skaleerimine vahemiku sees
                    prob = 1 - ((neededForGeim - pMin) / (pMax - pMin));
                }
            }

            const percentage = (prob * 100).toFixed(1);
            document.getElementById('result').innerText = `${percentage}%`;
        }

        // Event listeners
        document.querySelectorAll('input').forEach(el => {
            el.addEventListener('input', updateUI);
        });

        // Init
        updateUI();
    </script>
</body>
</html>
