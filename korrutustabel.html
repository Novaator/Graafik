<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexen Math: 20 Sekundit Ellujäämiseni</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --blood-red: #8a0303;
            --stone-dark: #231e19;
            --stone-light: #4a3e35;
            --ui-border: #14110e;
            --text-gold: #c29d70;
            --highlight: #dfb279;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--stone-dark);
            /* Hexeni mudane ja terav kivitekstuur */
            background-image: 
                radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.85) 100%),
                url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.25"/></svg>');
            color: var(--text-gold);
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 1040px;
            height: 600px;
            background: linear-gradient(135deg, var(--stone-light) 0%, #1a1612 100%);
            border: 10px solid var(--ui-border);
            border-top-color: #3b3028;
            border-left-color: #3b3028;
            box-shadow: 
                inset 8px 8px 15px rgba(0,0,0,0.6), 
                inset -8px -8px 15px rgba(0,0,0,0.9), 
                0 0 50px rgba(0,0,0,1);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Ekraani värisemine kahjustuse korral */
        .shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
            box-shadow: inset 0 0 150px rgba(138, 3, 3, 0.9) !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-6px, -2px, 0); }
            20%, 80% { transform: translate3d(6px, 4px, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, -4px, 0); }
            40%, 60% { transform: translate3d(10px, 2px, 0); }
        }

        /* Ülemine riba: Skoor ja seaded */
        #top-bar {
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 6px solid #0a0807;
            border-top: 2px solid #2a221c;
        }

        #score-display {
            font-size: 24px;
            color: #d12c2c;
            text-shadow: 3px 3px 0 #000;
        }

        #settings {
            display: flex;
            align-items: center;
            font-size: 10px;
            color: var(--highlight);
        }

        #settings input {
            margin-right: 10px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--blood-red);
        }

        /* Keskosa: Ülesanne ja kangelane */
        #battle-arena {
            flex-grow: 1;
            display: flex;
            position: relative;
        }

        #math-zone {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #question {
            font-size: 64px;
            margin-bottom: 40px;
            color: #e3c7a6;
            text-shadow: 6px 6px 0px rgba(0,0,0,0.9);
            letter-spacing: 5px;
        }

        #answer-input {
            background: rgba(10, 8, 5, 0.8);
            border: 6px solid var(--ui-border);
            border-bottom-color: var(--stone-light);
            border-right-color: var(--stone-light);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 56px;
            width: 240px;
            text-align: center;
            padding: 15px;
            outline: none;
            box-shadow: inset 4px 4px 15px #000;
        }

        #answer-input:focus {
            color: var(--highlight);
        }

        /* Kangelase kuvamine (Ettin) */
        #hero-zone {
            width: 580px;
            border-left: 6px solid #000;
            background: linear-gradient(to top, #000 0%, rgba(20,15,10,0.5) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 20px;
            box-shadow: inset 20px 0 30px rgba(0,0,0,0.6);
        }

        #hero-svg {
            width: 240px;
            height: 174px;
            filter: drop-shadow(10px 10px 5px rgba(0,0,0,0.8));
        }

        /* Alumine riba: Taimer */
        #bottom-bar {
            height: 40px;
            background: var(--ui-border);
            border-top: 6px solid #000;
            position: relative;
        }

        #timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #5c0202, #c71616, #ff4500);
            background-size: 200% 100%;
            transition: width 0.05s linear;
        }

        /* Ülekatted */
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 5, 5, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .hidden { display: none !important; }

        .btn {
            background: linear-gradient(to bottom, #52473f, #2c2520);
            border: 6px solid;
            border-top-color: #7a6b5e;
            border-left-color: #7a6b5e;
            border-bottom-color: #14110e;
            border-right-color: #14110e;
            color: var(--highlight);
            font-family: 'Press Start 2P', monospace;
            font-size: 20px;
            padding: 20px 40px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 20px;
            text-shadow: 2px 2px 0 #000;
        }

        .btn:active {
            border-top-color: #14110e;
            border-left-color: #14110e;
            border-bottom-color: #7a6b5e;
            border-right-color: #7a6b5e;
            background: linear-gradient(to bottom, #2c2520, #52473f);
        }

        .btn:hover { 
            color: #fff;
            box-shadow: 0 0 20px rgba(138, 3, 3, 0.8);
        }

        #game-over-text {
            font-size: 64px;
            color: var(--blood-red);
            text-shadow: 6px 6px 0 #000;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.3;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-bar">
        <div id="score-display">SKOOR: <span id="score">0</span></div>
        <div id="settings">
            <label><input type="checkbox" id="hardcore-mode"> HARDCORE (20x20)</label>
        </div>
    </div>

    <div id="battle-arena">
        <div id="math-zone">
            <div id="question">? x ?</div>
            <input type="number" id="answer-input" autocomplete="off" disabled>
        </div>
        
        <div id="hero-zone">
            <!-- Dünaamiliselt joonistatav Canvas graafika -->
            <canvas id="hero-canvas" width="580" height="450"></canvas>
        </div>
    </div>

    <div id="bottom-bar">
        <div id="timer-bar"></div>
    </div>

    <!-- Menüüd -->
    <div id="overlay">
        <div id="start-menu">
            <h1 style="font-size: 64px; color: var(--blood-red); margin-bottom: 10px; text-shadow: 6px 6px 0 #000; letter-spacing: -2px;">HEXEN MATH</h1>
            <p style="margin-bottom: 50px; color: #a38d78; font-size: 12px; line-height: 2;">
                Võitle 20 sekundit. <br>
                5 viga ja oled surnud.
            </p>
            <button class="btn" onclick="startGame()">SISENE AREENILE</button>
        </div>
        
        <div id="game-over-menu" class="hidden text-center">
            <div id="game-over-text">SURNUD!</div>
            <div style="font-size: 20px; margin-bottom: 40px; color: #857463;">Lõppskoor: <span id="final-score" style="color: #fff;"></span></div>
            <button class="btn" onclick="resetGame()">UUS KATSE</button>
        </div>
    </div>
</div>

<script>
    const MAX_TIME = 20000; // 20 sekundit, vastavalt Hexeni halastamatusele
    const MAX_LIVES = 5;
    
    let score = 0;
    let lives = MAX_LIVES;
    let currentAnswer = 0;
    let timeRemaining = MAX_TIME;
    let timerInterval = null;
    let isPlaying = false;

    // DOM elemendid
    const elQuestion = document.getElementById('question');
    const elInput = document.getElementById('answer-input');
    const elScore = document.getElementById('score');
    const elTimerBar = document.getElementById('timer-bar');
    const elContainer = document.getElementById('game-container');
    const elOverlay = document.getElementById('overlay');
    const elStartMenu = document.getElementById('start-menu');
    const elGameOverMenu = document.getElementById('game-over-menu');
    const elFinalScore = document.getElementById('final-score');
    const cbHardcore = document.getElementById('hardcore-mode');
    const canvas = document.getElementById('hero-canvas');
    const ctx = canvas.getContext('2d');

    // Suurema, 580px laia Ettini/Koletise pikselhaaval kaart
    // 58 pikslit lai, 45 pikslit kõrge, iga piksel on 10x10 päris pikslit
    const monsterSprite = [
        "..........................................................",
        "..........................................................",
        ".........M................................................",
        "........mMM...............................................",
        ".......MmdmM............M..M............M..M..............",
        "......MmdddmM..........Mm..mM..........Mm..mM.............",
        ".....Mm.dd.dmM........M.mmmm.M........M.mmmm.M............",
        "....Mm..dd..dmM......m..sSSs..m......m..sSSs..m...........",
        "...Mm...dd...dmM....m..sRRRRs..m....m..sRRRRs..m..........",
        "..Mm....dd....dmM...m..sWWWWs..m....m..sWWWWs..m..........",
        ".Mm.....dd.....dmM...m.ssssss.m......m.ssssss.m...........",
        "Mm......dd......dmM...MmmmmmmM........MmmmmmmM............",
        "M.......dd.......mM....MmmmmM..........MmmmmM.............",
        "........dd..............MmmM............MmmM..............",
        "........dd.............MmdmM............MmdmM.............",
        "........dd............MmMddMmM........MmMddMmM............",
        "........dd...........MDDmsmsmDDMMMMMMMDDmsmsmDDM..........",
        "........dd..........mDDsssssssDDDDDDDDsssssssDDm..........",
        "........dd.........mDDssssssssssssssssssssssssDDm.........",
        "........dd.........mDDssssssssssssssssssssssssDDm.........",
        "........dd........mDDssssssssssssssssssssssssssDDm........",
        "........dd........mDDssssssssssssssssssssssssssDDm........",
        "........dd........mDDssssssssssssssssssssssssssDDm........",
        "........dd........mDDssssssssssssssssssssssssssDDm........",
        "........dd.........DDssssssssssssssssssssssssssDD.........",
        "........dd.........DDssssssssssssssssssssssssssDD.........",
        "........dd.........DDssssssssssssssssssssssssssDD.........",
        "........dd.........DDssssssssssssssssssssssssssDD.........",
        "........dd.........LLDDDDDDDDDDDDDDDDDDDDDDDDDDLL.........",
        "........dd.........LLLLLLLLLLLLLLLLLLLLLLLLLLLLLL.........",
        "........dd.........LGGGGGGGGGGGGGGGGGGGGGGGGGDDGL.........",
        "........dd..........LGGGGGGGGGGGGGGGGGGGGGGGGGDL..........",
        "........dd...........LGGGGGGGGGGGGGGGGGGGGGGGDL...........",
        "........dd............LLLLLLLLLLLLLLLLLLLLLLLL............",
        "........dd............LL....................LL............",
        "........dd...........LL......................LL...........",
        "........dd...........LL......................LL...........",
        "........dd..........DD........................DD..........",
        "........dd..........DD........................DD..........",
        "........dd.........DD..........................DD.........",
        "........dd.........DD..........................DD.........",
        "..........................................................",
        "..........................................................",
        "..........................................................",
        ".........................................................."
    ];

    // Detailsem värvipalett
    const palette = {
        '.': null, // läbipaistev
        'M': '#EAEAEA', // Hele metall (nuia ogad)
        'm': '#808080', // Põhimetall
        'd': '#404040', // Tume metall / Varjud
        'S': '#C48D5F', // Hele nahk
        's': '#9E693F', // Keskmine nahk
        'D': '#633B1E', // Tume nahk / Varjud
        'L': '#2E1A0F', // Tume nahk (rihmad)
        'G': '#B8860B', // Kuldne (vöö)
        'R': '#FF0000', // Kurjad punased silmad
        'W': '#FFFFFF'  // Teravad hambad
    };

    function renderHero(currentLives) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const pixelSize = 10; // 58 pikslit * 10 = 580px lai
        
        let bloodThreshold = 0;
        if(currentLives === 4) bloodThreshold = 10;
        if(currentLives === 3) bloodThreshold = 30;
        if(currentLives === 2) bloodThreshold = 60;
        if(currentLives === 1) bloodThreshold = 85;
        if(currentLives === 0) bloodThreshold = 98;

        for(let y = 0; y < monsterSprite.length; y++) {
            // Lisame siia väikese nihke, et joonistus oleks kenasti keskel
            for(let x = 0; x < monsterSprite[y].length; x++) {
                const char = monsterSprite[y][x];
                
                if(char !== '.') {
                    let color = palette[char];
                    
                    if (currentLives === 0 && (char === 'R' || char === 'W')) {
                        color = '#222'; // Surnud silmad ja hambad
                    }
                    else {
                        const hash = (x * 41 + y * 23 + (x*y)) % 100;
                        if (hash < bloodThreshold) {
                            color = (hash % 3 === 0) ? '#4a0101' : '#8a0303'; // Rohkem varieeruvat verd
                        }
                    }

                    ctx.fillStyle = color;
                    
                    // Varjude efekt ainult siis, kui elus (annab sügavust)
                    if(currentLives > 0) {
                        ctx.shadowColor = 'rgba(0,0,0,0.5)';
                        ctx.shadowBlur = 3;
                        ctx.shadowOffsetX = 2;
                        ctx.shadowOffsetY = 2;
                    } else {
                        ctx.shadowColor = 'transparent';
                    }
                    
                    ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                    
                    // Resetime varju järgmiseks ringiks
                    ctx.shadowColor = 'transparent';
                }
            }
        }
    }

    // Sisendi lukustamine numbritele ja Enteri kuulamine
    elInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && isPlaying) {
            checkAnswer();
        }
    });

    // Hoiame fookust koguaeg inputil, et kiirelt tulistada
    document.addEventListener('click', () => {
        if (isPlaying) elInput.focus();
    });

    function startGame() {
        elOverlay.classList.add('hidden');
        elStartMenu.classList.add('hidden');
        elInput.disabled = false;
        elInput.focus();
        score = 0;
        lives = MAX_LIVES;
        elScore.innerText = score;
        isPlaying = true;
        
        // Joonistame koletise täies elujõus
        renderHero(lives);
        nextQuestion();
    }

    function nextQuestion() {
        const isHardcore = cbHardcore.checked;
        const maxMult = isHardcore ? 20 : 10;
        
        // Valime numbrid (väldime 1-ga korrutamist, et hoida tempo ja raskus)
        const a = Math.floor(Math.random() * (maxMult - 1)) + 2;
        const b = Math.floor(Math.random() * (maxMult - 1)) + 2;
        
        currentAnswer = a * b;
        elQuestion.innerText = `${a} x ${b}`;
        elInput.value = '';
        
        timeRemaining = MAX_TIME;
        updateTimerVisual();
        
        clearInterval(timerInterval);
        timerInterval = setInterval(gameLoop, 50); // Uuendame tihedalt sujuva riba jaoks
    }

    function gameLoop() {
        timeRemaining -= 50;
        updateTimerVisual();

        if (timeRemaining <= 0) {
            takeDamage();
        }
    }

    function updateTimerVisual() {
        const percentage = Math.max(0, (timeRemaining / MAX_TIME) * 100);
        elTimerBar.style.width = percentage + '%';
        
        // Muuda värvi ekstreemselt ohtlikuks, kui aeg hakkab otsa saama
        if (percentage < 25) {
            elTimerBar.style.background = (Math.floor(timeRemaining / 100) % 2 === 0) ? '#ff0000' : '#8a0303';
        } else {
            elTimerBar.style.background = 'linear-gradient(90deg, #5c0202, #c71616, #ff4500)';
        }
    }

    function checkAnswer() {
        const userVal = parseInt(elInput.value, 10);
        if (isNaN(userVal)) return;

        if (userVal === currentAnswer) {
            // Õige vastus - kiirus määrab punktide hulga
            const points = Math.floor((timeRemaining / MAX_TIME) * 1000);
            score += Math.max(25, points); 
            elScore.innerText = score;
            nextQuestion();
        } else {
            // Vale vastus!
            takeDamage();
        }
    }

    function takeDamage() {
        lives--;
        
        // Uuenda kangelase vigastusi
        renderHero(lives);
        
        // Ekraani halastamatu värisemine
        elContainer.classList.remove('shake');
        void elContainer.offsetWidth; // sunni brauserit reflow'd tegema, et animatsioon restardiks
        elContainer.classList.add('shake');
        
        elInput.value = '';
        
        if (lives <= 0) {
            triggerGameOver();
        } else {
            // Kohe uus küsimus, et pinget peal hoida
            nextQuestion();
        }
    }

    function triggerGameOver() {
        isPlaying = false;
        clearInterval(timerInterval);
        elInput.disabled = true;
        elFinalScore.innerText = score;
        
        setTimeout(() => {
            elOverlay.classList.remove('hidden');
            elGameOverMenu.classList.remove('hidden');
            elContainer.classList.remove('shake');
        }, 800); // Lasa mängijal hetke vaadata verist ja surnud Ettinit, enne kui menüü peale lendab
    }

    function resetGame() {
        elGameOverMenu.classList.add('hidden');
        startGame();
    }
    
    // Algne joonistus (puhtana) taustale, et menüü all poleks tühjust
    renderHero(5);
</script>
</body>
</html>
