<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novaatori, Forte ja Postimehe lugejate profiil 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        :root {
            --err-blue: #004d73;
            --err-muted-blue: #6b8e9b;
            --err-bg: #f8f9fa;
            --err-text: #222;
            --err-accent: #c25953;
            --err-grey: #8e979d;
        }
        
        * {
            box-sizing: border-box;
            font-weight: 400 !important;
        }

        body {
            font-family: 'Fira Sans', sans-serif;
            color: var(--err-text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .chart-container {
            width: 100%;
            max-width: 670px;
            background: #fff;
        }

        h1 {
            font-size: 22pt;
            margin: 0 0 10px 0;
            line-height: 1.2;
        }

        h2 {
            font-size: 20pt;
            color: #555;
            margin: 0 0 25px 0;
            line-height: 1.3;
        }

        /* Uus graafiline profiilikaart */
        .profile-image-wrapper {
            width: 100%;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            background: var(--err-bg);
        }

        .profile-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Tabid */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background: #e9ecef;
            border: none;
            padding: 8px 16px;
            font-size: 14pt;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            color: var(--err-text);
        }

        .tab-btn:hover {
            background: #d3d9df;
        }

        .tab-btn.active {
            background: var(--err-muted-blue);
            color: #fff;
        }

        /* Tööriistariba */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .sort-btn {
            background: none;
            border: 1px solid #ccc;
            padding: 6px 12px;
            font-size: 12pt;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            color: #555;
        }

        .sort-btn:hover {
            background: #f0f0f0;
        }

        /* Graafiku ala */
        .canvas-wrapper {
            position: relative;
            height: 550px;
            width: 100%;
        }

        .footer {
            font-size: 14pt;
            color: #777;
            margin-top: 25px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="chart-container">
        <h1>Kuidas jaotub Eesti teadusportaali lugejaskond?</h1>
        <h2>ERR Novaatori, Delfi Forte ja Postimees Teaduse loetavuse võrdlus erinevates ühiskonnarühmades</h2>

        <!-- Illustreeriv sotsiaaldemograafiline profiil -->
        <div class="profile-image-wrapper">
            <img src="https://s.err.ee/photo/orig/2026/11/17/3885001hfefe.jpg" alt="ERR Novaatori tüüpiline lugeja">
        </div>

        <div class="tabs" id="tabContainer">
            <button class="tab-btn active" data-category="Staatus">Staatus</button>
            <button class="tab-btn" data-category="Vanus">Vanus</button>
            <button class="tab-btn" data-category="Haridus">Haridus</button>
            <button class="tab-btn" data-category="Regioon">Regioon</button>
            <button class="tab-btn" data-category="Sugu">Sugu</button>
        </div>

        <div class="toolbar">
            <button class="sort-btn" id="sortBtn">Sorteeri Novaatori järgi: Kahanevalt</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="readersChart"></canvas>
        </div>

        <div class="footer">
            Allikas: Teadustegevuste kokkupuude 2026 uuring
        </div>
    </div>

    <script>
        const rawData = {
            'Staatus': [
                {label: 'Õpilane/üliõpilane', n: 48.5, f: 33.5, p: 41.8},
                {label: 'Ettevõtja', n: 44.8, f: 44.0, p: 41.1},
                {label: 'Palgatöötaja', n: 34.7, f: 32.3, p: 38.2},
                {label: 'Muu', n: 33.0, f: 20.3, p: 25.0},
                {label: 'Töötu, tööotsija', n: 27.7, f: 24.0, p: 16.4},
                {label: 'Pensionär', n: 18.8, f: 20.4, p: 27.8}
            ],
            'Vanus': [
                {label: '16–24', n: 46.6, f: 30.2, p: 38.8},
                {label: '25–34', n: 40.4, f: 38.7, p: 36.4},
                {label: '35–49', n: 29.3, f: 29.9, p: 34.9},
                {label: '50–64', n: 39.1, f: 36.2, p: 41.0},
                {label: '65–74', n: 23.3, f: 27.1, p: 32.3},
                {label: '75+', n: 13.8, f: 10.7, p: 21.3}
            ],
            'Haridus': [
                {label: 'Kõrgharidus', n: 41.5, f: 31.7, p: 39.8},
                {label: 'Keskharidus', n: 29.3, f: 30.2, p: 35.5},
                {label: 'Põhiharidus', n: 26.4, f: 26.6, p: 25.7}
            ],
            'Regioon': [
                {label: 'Põhja-Eesti', n: 42.4, f: 40.6, p: 35.2},
                {label: 'Tartu pk', n: 40.9, f: 27.6, p: 41.1},
                {label: 'Lõuna-Eesti', n: 37.2, f: 32.9, p: 35.7},
                {label: 'Lääne-Eesti', n: 30.6, f: 29.7, p: 35.3},
                {label: 'Tallinn', n: 28.1, f: 29.0, p: 35.2},
                {label: 'Virumaa', n: 20.7, f: 19.8, p: 27.8}
            ],
            'Sugu': [
                {label: 'Mees', n: 35.8, f: 34.8, p: 38.2},
                {label: 'Naine', n: 29.4, f: 26.0, p: 32.3},
                {label: 'Muu*', n: 66.7, f: 0, p: 33.3}
            ]
        };

        let currentCategory = 'Staatus';
        let sortByValue = true;
        let chartInstance = null;

        function getChartData() {
            let dataArr = JSON.parse(JSON.stringify(rawData[currentCategory]));
            
            if (sortByValue) {
                dataArr.sort((a, b) => b.n - a.n);
            }
            
            return {
                labels: dataArr.map(d => d.label),
                novaator: dataArr.map(d => d.n),
                forte: dataArr.map(d => d.f),
                postimees: dataArr.map(d => d.p)
            };
        }

        function initChart() {
            const ctx = document.getElementById('readersChart').getContext('2d');
            Chart.register(ChartDataLabels);
            
            const currentData = getChartData();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: currentData.labels,
                    datasets: [
                        {
                            label: 'Novaator',
                            data: currentData.novaator,
                            backgroundColor: '#004d73',
                            borderRadius: 2
                        },
                        {
                            label: 'Forte',
                            data: currentData.forte,
                            backgroundColor: '#8e979d',
                            borderRadius: 2
                        },
                        {
                            label: 'Postimees',
                            data: currentData.postimees,
                            backgroundColor: '#c25953',
                            borderRadius: 2
                        }
                    ]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { right: 40 }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: {
                                font: { family: 'Fira Sans', size: 14, weight: 400 },
                                color: '#222',
                                usePointStyle: true,
                                padding: 20
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(255, 255, 255, 0.95)',
                            titleColor: '#222',
                            bodyColor: '#222',
                            borderColor: '#ccc',
                            borderWidth: 1,
                            titleFont: { family: 'Fira Sans', size: 14, weight: 400 },
                            bodyFont: { family: 'Fira Sans', size: 14, weight: 400 },
                            displayColors: true,
                            callbacks: {
                                label: function(context) {
                                    return ' ' + context.dataset.label + ': ' + context.parsed.x.toString().replace('.', ',') + '%';
                                }
                            }
                        },
                        datalabels: {
                            anchor: 'end',
                            align: 'right',
                            offset: 4,
                            color: '#444',
                            font: { family: 'Fira Sans', size: 12, weight: 400 },
                            formatter: function(value) {
                                return value > 0 ? value.toFixed(1).replace('.', ',') + '%' : '';
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 80,
                            grid: { color: '#eee' },
                            ticks: {
                                font: { family: 'Fira Sans', size: 12, weight: 400 },
                                callback: function(value) { return value + '%'; }
                            }
                        },
                        y: {
                            grid: { display: false },
                            ticks: {
                                font: { family: 'Fira Sans', size: 14, weight: 400 },
                                color: '#222'
                            }
                        }
                    }
                }
            });
        }

        function updateChart() {
            const currentData = getChartData();
            chartInstance.data.labels = currentData.labels;
            chartInstance.data.datasets[0].data = currentData.novaator;
            chartInstance.data.datasets[1].data = currentData.forte;
            chartInstance.data.datasets[2].data = currentData.postimees;
            chartInstance.update();
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                updateChart();
            });
        });

        document.getElementById('sortBtn').addEventListener('click', (e) => {
            sortByValue = !sortByValue;
            e.target.textContent = sortByValue ? 'Sorteeri Novaatori järgi: Kahanevalt' : 'Sorteeri Novaatori järgi: Algne järjestus';
            updateChart();
        });

        window.onload = initChart;
    </script>
</body>
</html>
